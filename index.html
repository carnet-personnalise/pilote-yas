<style>
/* ---------- couleurs de base ---------- */
:root{
  --bg:#E6F0EE;--head:#CFE5E2;--surface:#FFFFFF;--ink:#1D2A31;--muted:#536570;--line:#CADAD8;
  --accent:#0F7C79;--accent-soft:#CDE8E5;--on-accent:#FFFFFF;
  --sun:#D98E04;--sun-soft:#FBEFD6;--green:#2F8A55;--orange:#D9822B;--red:#C8433C;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1D1D;--head:#163130;--surface:#172726;--ink:#E6EEF0;--muted:#9DB1B2;--line:#2A3F3E;
    --accent:#4DB8B3;--accent-soft:#163B3A;--on-accent:#0F1A1C;
    --sun:#EBA73A;--sun-soft:#3A311B;--green:#5BBF85;--orange:#E8A160;--red:#E46A62;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1D1D;--head:#163130;--surface:#172726;--ink:#E6EEF0;--muted:#9DB1B2;--line:#2A3F3E;
  --accent:#4DB8B3;--accent-soft:#163B3A;--on-accent:#0F1A1C;
  --sun:#EBA73A;--sun-soft:#3A311B;--green:#5BBF85;--orange:#E8A160;--red:#E46A62;color-scheme:dark;
}
/* ---------- ambiance selon la phase (clair) ---------- */
:root[data-phase="haute"]{--bg:#E7ECF6;--head:#D2DBF0;--line:#CBD4E8;--accent:#3E5C9A;--accent-soft:#DAE2F4}
:root[data-phase="basse"]{--bg:#F7EBDD;--head:#F0D8BC;--line:#E6D2BC;--accent:#A55A2A;--accent-soft:#F5DFCA}
/* ---------- ambiance selon la phase (sombre) ---------- */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"])[data-phase="neutre"]{--bg:#0F1D1D;--head:#163130;--surface:#172726;--line:#2A3F3E;--accent:#4DB8B3;--accent-soft:#163B3A}
  :root:not([data-theme="light"])[data-phase="haute"]{--bg:#121827;--head:#1C2640;--surface:#182033;--line:#2A3552;--accent:#8EA8E6;--accent-soft:#1F2B4A}
  :root:not([data-theme="light"])[data-phase="basse"]{--bg:#20160E;--head:#33231A;--surface:#271C14;--line:#43301F;--accent:#E39A63;--accent-soft:#3B2718}
}
:root[data-theme="dark"][data-phase="neutre"]{--bg:#0F1D1D;--head:#163130;--surface:#172726;--line:#2A3F3E;--accent:#4DB8B3;--accent-soft:#163B3A}
:root[data-theme="dark"][data-phase="haute"]{--bg:#121827;--head:#1C2640;--surface:#182033;--line:#2A3552;--accent:#8EA8E6;--accent-soft:#1F2B4A}
:root[data-theme="dark"][data-phase="basse"]{--bg:#20160E;--head:#33231A;--surface:#271C14;--line:#43301F;--accent:#E39A63;--accent-soft:#3B2718}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 170px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5;transition:background-color .5s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);border-bottom:1px solid var(--line);padding:10px 16px 0;transition:background-color .5s}
.top{display:flex;align-items:center;gap:12px;max-width:860px;margin:0 auto}
.logo{width:44px;height:44px;border-radius:12px;background:#FFFFFF;padding:3px;flex:0 0 auto;border:1px solid var(--line)}
.logo img{width:100%;height:100%;display:block}
h1{font-size:1.4rem;margin:0;line-height:1.15;letter-spacing:-.01em}
.today{color:var(--muted);font-size:.9rem;display:block}
.searchwrap{position:relative;max-width:860px;margin:10px auto 0}
#q{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit}
#results{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:55vh;overflow:auto;z-index:40;box-shadow:0 10px 28px rgba(0,0,0,.18)}
.res{display:block;width:100%;text-align:left;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;cursor:pointer;margin:0}
.res small{display:block;color:var(--muted)}
.tabbar{display:flex;align-items:center;gap:2px;max-width:860px;margin:8px auto 0}
.arrow{flex:0 0 auto;border:0;background:none;color:var(--muted);font-size:1.4rem;line-height:1;padding:6px 8px;cursor:pointer}
#tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;scroll-behavior:smooth}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;padding:10px 12px;font:inherit;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
main{max-width:860px;margin:0 auto;padding:18px 16px 230px}
h2{font-size:1.3rem;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 16px}
.hello{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.hello .logo{width:64px;height:64px;border-radius:16px}
.hello h2{font-size:1.5rem;margin:0}
.hello p{margin:2px 0 0;color:var(--muted)}
.block{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:16px;margin-bottom:14px}
.block h3{font-size:1.06rem;margin:0 0 8px;color:var(--accent)}
.block p{margin:6px 0}
.mode{display:flex;gap:8px;margin-bottom:12px}
.mode button{flex:1;padding:11px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.mode button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.modebox{border-left:6px solid var(--accent);background:var(--accent-soft);border-radius:0 14px 14px 0;padding:14px 16px;margin-bottom:14px}
.modebox.haute{border-left-color:var(--sun)}
.modebox p{margin:8px 0}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.icon{border:0;background:none;padding:6px;font-size:1.05rem;cursor:pointer;color:var(--muted);min-width:38px;min-height:38px;border-radius:8px;flex:0 0 auto}
.icon:disabled{opacity:.3;cursor:default}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=checkbox]{width:22px;height:22px;flex:0 0 auto;margin:4px 0 0;accent-color:var(--accent)}
input[hidden]{display:none}
label{display:block;font-size:.92rem;color:var(--muted);margin:12px 0 4px}
.hint{font-size:.85rem;color:var(--muted);margin:2px 0 6px}

.wprev img{max-width:160px;border-radius:10px;margin-top:6px;display:block}
.teststep{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;padding:10px 14px;margin:10px 0}
.teststep p{margin:4px 0}
/* ---------- V21 ---------- */
.murow{flex-wrap:wrap}.murow>.grow{flex:1 1 100%}.murow .mubtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%}.murow .mubtns .end{margin-left:auto}
.autobar{display:flex;justify-content:flex-end;margin-top:6px}.autobar .btn{padding:6px 12px}
.autobar{flex-wrap:wrap;gap:6px;align-items:center}
.tsort{display:flex;align-items:center;gap:8px;margin:0;color:var(--muted);font-size:.85rem;flex:1 1 100%;min-width:0}
.tsort span{white-space:nowrap}
.tsort select{flex:1 1 auto;min-width:0;width:auto;margin:0;padding:6px 8px;font-size:.9rem}
.tico{display:grid;grid-template-columns:repeat(2,34px);flex:0 0 auto;align-content:start}
.tico .icon{min-width:34px;min-height:32px;padding:2px;font-size:1rem}
img.zoom{cursor:zoom-in}
#photoBox{position:fixed;inset:0;z-index:160;background:rgba(0,0,0,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#photoBox.show{display:flex}
#photoBox img{width:100%;max-width:900px;height:auto;max-height:calc(100dvh - 130px);object-fit:contain;border-radius:10px}
a.btn{text-decoration:none;display:inline-block}
#photoBox p{color:#fff;margin:0;text-align:center}
#photoBox .btn{background:#fff;color:#1D2A31;border-color:#fff}
html.locked #photoBox{visibility:hidden}
#speakBar{z-index:110}
#speakBar button.rate{padding:5px 10px}
#speakBar button.rate.on{background:var(--bg);color:var(--ink);font-weight:700}
.ctrow{display:block}
/* ---------- V22 ---------- */
#testBack{position:fixed;left:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;align-items:stretch;border-radius:999px;background:var(--accent);color:var(--on-accent);box-shadow:0 4px 14px rgba(0,0,0,.25);overflow:hidden}
#testBack[hidden]{display:none}
#testBack button{border:0;background:transparent;color:inherit;font:inherit;font-weight:700;padding:10px 14px;min-height:44px;cursor:pointer}
#testBack .tb-x{padding:10px 12px;border-left:1px solid rgba(255,255,255,.35);font-weight:400}
html.locked #testBack{visibility:hidden}
.ctrow .cthead{display:flex;gap:10px;align-items:flex-start}
.ctrow .tel{white-space:nowrap;font-variant-numeric:tabular-nums}
.ctrow .cttools{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;margin-top:6px}
details.fold2{border-top:1px solid var(--line);margin-top:10px}
details.fold2>summary{font-weight:700;color:var(--accent);padding:10px 0}
details.fold2 details.fold2>summary{font-weight:400;color:var(--ink)}
details.catmore>summary{padding:4px 0;font-size:.92rem}
.catgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
/* ---------- écran du mot de passe ---------- */
html.locked header,html.locked main,html.locked .fab{visibility:hidden}
#lock{display:none}
html.locked #lock{display:flex;position:fixed;inset:0;z-index:200;background:var(--bg);align-items:center;justify-content:center;padding:16px}
#lock .card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 20px;text-align:center}
#lock .logo{width:72px;height:72px;border-radius:18px;margin:0 auto 10px}
#lock h1{margin:0 0 4px;color:var(--accent)}
#lock form{text-align:left;margin-top:16px}
#lock .btn{width:100%;margin-top:12px}
#lockMsg{color:var(--red);font-weight:700;min-height:1.5em;margin:10px 0 0;text-align:center}
#lockHint{margin:10px 0 0;text-align:center}
#lockNowBtn{margin-left:auto;padding:6px 10px;font-size:.88rem;flex:0 0 auto}
#syncBtn{margin-left:auto;padding:6px 10px;font-size:.88rem;flex:0 0 auto;white-space:nowrap}#syncBtn:not([hidden])~#lockNowBtn{margin-left:6px}#syncBtn.need{border-color:var(--sun);box-shadow:0 0 0 2px var(--sun)}
</style>

  {k:"Nettoyage « à effacer »",t:"Crée 3 éléments avec « test à effacer » dans leur nom : une tâche, une ligne de Reprendre ici, et un exercice kiné (ou un projet). Ferme puis rouvre le carnet : une barre te propose de les voir. Touche « Voir » : les 3 sont dans la liste, avec leur onglet. Décoche-en un, puis « Effacer les cochés ». Touche « Annuler » dans la barre : tout revient. Recommence et efface pour de bon."},

  {k:"Mes carnets",t:"Ouvre l’onglet 🔗 Mes carnets. Ajoute le Bilan du couple sans adresse : il affiche « Fichier à ouvrir dans Chrome ». Ajoute un carnet en ligne, par exemple carnet-personnalise.github.io/lea : le bouton « Ouvrir » l’ouvre."},
  {k:"Rappel du bilan du couple",t:"Dans Paramètres, « Rappel du bilan du couple », choisis le jour d’aujourd’hui. Va dans l’Accueil : le rappel 💞 est dans « Rappels du jour ». Touche « ✓ C’est fait » : il disparaît. Remets ensuite dimanche."},
  {k:"Fiche de test",t:"Pour finir : touche « Résumé ». Vérifie que toutes tes remarques y sont, puis « 📋 Copier mes remarques », et colle-les à Claude pour la V26."}

function similarProject(name,exceptId){
  const n=norm(name).trim();
  const words=n.split(/[^a-z0-9]+/).filter(w=>w.length>3&&!STOP.has(w));
  return state.projects.find(p=>p.id!==exceptId&&(norm(p.name).trim()===n||words.some(w=>norm(p.name).includes(w))));
}
function moveProj(id,dir){
  const arr=state.projects;const i=arr.findIndex(p=>p.id===id);if(i<0)return;
  const st=arr[i].status,sp=arr[i].space;let j=i+dir;
  while(j>=0&&j<arr.length&&(arr[j].status!==st||arr[j].space!==sp))j+=dir;
  if(j<0||j>=arr.length)return;
  [arr[i],arr[j]]=[arr[j],arr[i]];save();render();flash("p-"+id);
}

function taskGroup(l,sec){
  const g=[];l.forEach(t=>{const k=dupKey(t.title);let e=g.find(x=>x.k===k);if(!e){e={k,items:[]};g.push(e);}e.items.push(t);});
  return g.map(e=>e.items.length>1?`<details class="tgrp"><summary><b>${esc(e.items[0].title)}</b> <span class="badge">×${e.items.length}</span></summary>${e.items.map(t=>taskRow(t,sec)).join("")}</details>`:taskRow(e.items[0],sec)).join("");
}
/* V21 : ordre perso des tâches (au-delà du code couleur) */
const URK={rouge:0,orange:1,vert:2};
function taskSortColor(a,b){return (URK[a.urg]??2)-(URK[b.urg]??2)||((a.date||"9999")+(a.time||"")).localeCompare((b.date||"9999")+(b.time||""));}
/* V24 : « Trier par » (les plus récentes en haut par défaut) */
const TSORT={recent:"Plus récentes d’abord",proche:"Échéance la plus proche",ajout:"Date d’ajout (dernières ajoutées en haut)",couleur:"Couleur (urgent d’abord)",perso:"Autre… : mon ordre avec ↑ ↓"};
const tsMode=()=>TSORT[state.settings.taskSortBy]?state.settings.taskSortBy:"recent";
const tIdx=t=>state.tasks.indexOf(t);
const tWhen=t=>t.date?t.date+(t.time||"00:00"):(t.created||"")+"00:00";
function taskSort(a,b){const m=tsMode();
  if(m==="couleur")return taskSortColor(a,b);
  if(m==="proche")return ((a.date||"9999")+(a.time||"")).localeCompare((b.date||"9999")+(b.time||""))||tIdx(b)-tIdx(a);
  if(m==="recent")return tWhen(b).localeCompare(tWhen(a))||tIdx(b)-tIdx(a);
  return (b.created||"").localeCompare(a.created||"")||tIdx(b)-tIdx(a);}
const tsLabel=()=>({recent:"les plus récentes en haut",proche:"échéance la plus proche en haut",ajout:"dernières ajoutées en haut",couleur:"par couleur, puis par date",perso:"dernières ajoutées en haut, puis ton ordre ↑ ↓"})[tsMode()];
function tsSelect(){return `<label class="tsort"><span>Trier par</span><select id="tSortBy" aria-label="Trier les tâches">${Object.keys(TSORT).map(k=>`<option value="${k}" ${tsMode()===k?"selected":""}>${TSORT[k]}</option>`).join("")}</select></label>`;}
/* V22 : chaque domaine garde son propre ordre ; une tâche nouvelle arrive en haut */
function secList(sec){const O=state.tasks.filter(t=>!t.done);const l=(sec==="__all"?O.slice():sec==="__suivre"?O.filter(t=>t.follow):sec==="__nodom"?O.filter(t=>!tDoms(t).length):O.filter(t=>tDoms(t).includes(sec))).sort(taskSort);
  const ord=(state.taskOrd||{})[sec];if(!Array.isArray(ord)||!ord.length)return l;
  const pos=t=>{const k=ord.indexOf(t.id);return k<0?-1:k;};return l.map((t,k)=>[t,k]).sort((a,b)=>pos(a[0])-pos(b[0])||a[1]-b[1]).map(x=>x[0]);}

function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/[,;]/g,m=>"\\"+m).replace(/\n/g,"\\n");}
function icsLocal(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00";}
function downloadFile(name,content,type){
  const blob=new Blob([content],{type});const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function icsWhen(t){return t.time?(t.type==="rdv"?"1 jour avant et 2 h avant":"1 jour avant et 10 min avant"):"la veille et le jour même à 9 h";}
function makeIcs(t,atTime){
  const stamp=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Carnet Pilote//FR","BEGIN:VEVENT","UID:"+t.id+"@carnet-pilote","DTSTAMP:"+stamp];
  if(t.time){const s=new Date(t.date+"T"+t.time+":00");const e=new Date(s.getTime()+(atTime?900000:3600000));L.push("DTSTART:"+icsLocal(s),"DTEND:"+icsLocal(e));}
  else{const s=new Date(t.date+"T12:00:00");const e=new Date(s.getTime()+86400000);L.push("DTSTART;VALUE=DATE:"+t.date.replace(/-/g,""),"DTEND;VALUE=DATE:"+icsLocal(e).slice(0,8));}
  L.push("SUMMARY:"+icsEsc(t.title),"DESCRIPTION:"+icsEsc([t.domain,t.note].filter(Boolean).join(" : ")));
  const alarm=tr=>L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(t.title),"TRIGGER:"+tr,"END:VALARM");
  /* V24 : 2 rappels en notification (jamais d’e-mail) : tâche 1 jour + 10 min avant ; RDV 1 jour + 2 h avant ; sans heure : la veille à 9 h et le jour même à 9 h */
  if(atTime)alarm("PT0M");else if(t.time){alarm("-P1D");alarm(t.type==="rdv"?"-PT2H":"-PT10M");}else{alarm("-PT15H");alarm("PT9H");}
  L.push("END:VEVENT","END:VCALENDAR");
  return L.join("\r\n");
}

const EMO_WORDS=[["🔊","haut-parleur"],["✎","crayon"],["🗑","poubelle"],["⋮","trois petits points"],["🎤","micro"],["⏹","Arrêter"],["☑️","case cochée"]];
function cleanSpeech(t){t=String(t||"");EMO_WORDS.forEach(([e,w])=>{t=t.replace(new RegExp("(petit|le|la|un|une)\\s*"+e.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),"$1 "+w);});return t.replace(/[\p{Extended_Pictographic}️‍⃣]/gu," ").replace(/[•·|›‹▾▸✕✎🗑]/g," ").replace(/\s*\.\s*(\.\s*)+/g,". ").replace(/:\s*\./g,":").replace(/\s{2,}/g," ").replace(/^\s*\.\s*/,"").trim();}
function textOf(el){

/* V21 : vitesse modifiable pendant la lecture */
let spkTok=0,lastSpeak="",spkPos=0;
const RATE_ICO={lente:"🐢 ",rapide:"🐇 "};
function speakBarFill(){const r=state.settings.rate;$("#speakBar").innerHTML=`<span>🔊 Lecture…</span>`+Object.entries(RATES).map(([k,[l]])=>`<button class="rate ${r===k?"on":""}" data-act="speakRate" data-id="${k}" aria-pressed="${r===k}">${RATE_ICO[k]||""}${l}</button>`).join("")+`<button data-act="speakStop">⏹ Arrêter</button>`;}
/* V23 : morceaux courts (phrase ou bout de phrase), pour ne jamais repartir de loin */
function speakChunks(t){const out=[];(t.match(/[^.!?;:,\n]+[.!?;:,\n]*\s*/g)||[t]).forEach(p=>{let b=p;while(b.length>110){let k=b.lastIndexOf(" ",100);if(k<30)k=100;out.push(b.slice(0,k));b=b.slice(k);}if(b.trim()){const L=out.length;if(L&&out[L-1].length+b.length<45&&!/[.!?]\s*$/.test(out[L-1]))out[L-1]+=b;else out.push(b);}});return out.filter(x=>x.trim());}
let spkList=[],spkIdx=0,spkOff=0,spkStart=0,spkBound=-1;
function speak(txt,from){
  if(!("speechSynthesis" in window)||!window.SpeechSynthesisUtterance){toast("La lecture à voix haute n’est pas disponible sur cet appareil");return;}
  if(from===undefined){const t=cleanSpeech(txt);if(!t){toast("Rien à lire ici");return;}lastSpeak=t;spkList=speakChunks(t);spkIdx=0;spkOff=0;}
  else spkIdx=Math.max(0,Math.min(from,spkList.length-1));
  try{speechSynthesis.cancel();}catch(e){}
  const tok=++spkTok;speakBarFill();$("#speakBar").classList.add("show");
  setTimeout(()=>speakPart(tok),60);
}
/* V22 : une phrase après l’autre, pour reprendre au bon endroit quand la vitesse change */
function speakPart(tok){if(tok!==spkTok)return;if(spkIdx>=spkList.length){$("#speakBar").classList.remove("show");return;}
  const part=spkList[spkIdx].slice(spkOff);const base=spkOff;spkBound=-1;
  if(!part.trim()){spkIdx++;spkOff=0;speakPart(tok);return;}
  const u=new SpeechSynthesisUtterance(part);u.lang="fr-FR";u.rate=(RATES[state.settings.rate]||RATES.normale)[1];
  u.onstart=()=>{if(tok===spkTok)spkStart=Date.now();};u.onboundary=e=>{if(tok===spkTok&&typeof e.charIndex==="number")spkBound=base+e.charIndex;};spkStart=Date.now();
  const v=(speechSynthesis.getVoices()||[]).find(x=>/^fr(-|_|$)/i.test(x.lang));if(v)u.voice=v;
  u.onend=()=>{if(tok!==spkTok)return;spkIdx++;spkOff=0;speakPart(tok);};
  u.onerror=e=>{if(tok!==spkTok)return;if(e&&(e.error==="interrupted"||e.error==="canceled"))return;spkIdx++;spkOff=0;speakPart(tok);};
  speechSynthesis.speak(u);}
/* V23 : où en est la voix dans le morceau ? (mot exact si le téléphone le dit, sinon estimé d’après le temps écoulé) */
function spkHere(){const s=spkList[spkIdx]||"";let p=spkBound;
  if(p<0){const r=(RATES[state.settings.rate]||RATES.normale)[1];p=spkOff+Math.floor((Date.now()-spkStart)/1000*13*r)-12;}
  p=Math.max(spkOff>0?spkOff:0,Math.min(p,s.length));if(p<=0)return 0;const k=s.lastIndexOf(" ",p);return k>0?k+1:0;}
function speakStop(){spkTok++;try{speechSynthesis.cancel();}catch(e){}$("#speakBar").classList.remove("show");}

function withToc(html,page){
  const items=[],used=new Set();let n=0;tocOpen=false;
  const out=html.split('<section class="block"').map((chunk,i)=>{
    if(i===0)return chunk;
    const m=chunk.match(/^( id="([^"]+)")?>(\s*<div class="phead">)?\s*<h3>([\s\S]*?)<\/h3>/);
    if(!m)return '<section class="block"'+chunk;

    let id=m[2]||("sec-"+(dupKey(label).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30)||(++n)));
    while(used.has(id))id+="-"+(++n);used.add(id);items.push([id,label]);
    let c=m[1]?chunk:' id="'+id+'"'+chunk;const e=c.indexOf("</section>");if(e>=0)c=c.slice(0,e)+TOPBTN+c.slice(e);

    fav=items.map(([id,l],i)=>({id,s:(U[id]||0)*10+(def.some(d=>norm(l).includes(norm(d)))?5:0)-i*.01})).sort((a,b)=>b.s-a.s).slice(0,4).map(x=>x.id);}

  ${all?"":`<input id="tocQ" type="search" placeholder="Tape un mot pour trouver la partie" aria-label="Chercher une partie" autocomplete="off" style="margin-bottom:8px">`}
  <div class="chips wrap" id="tocChips">${items.map(([id,l])=>`<button class="chip${all||fav.includes(id)?"":" tmore"}" data-act="jump" data-id="${id}" ${all||fav.includes(id)?"":"hidden"}>${esc(l)}</button>`).join("")}</div>
  ${all?"":`<div class="meta" id="tocNone" hidden></div><div class="bar" style="margin:8px 0 0"><button class="btn ghost spk" data-act="tocAll" data-id="${items.length}" aria-expanded="false">▸ Toutes les parties (${items.length})</button></div><p class="hint">Les parties proposées sont celles que tu ouvres le plus souvent.</p>`}</nav>`;
  const p=out.indexOf("</p>");return p<0?nav+out:out.slice(0,p+4)+nav+out.slice(p+4);
}

const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return Uint8Array.from(atob(s),c=>c.charCodeAt(0));};
const rnd=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return a;};
async function bioAvailable(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());}catch(e){return false;}}
async function bioEnable(){
  if(!await bioAvailable()){toast("L’empreinte n’est pas disponible ici. Elle marche dans l’application installée, sur ton téléphone.",5000);return;}
  try{const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:"Carnet Pilote"},user:{id:rnd(16),name:"carnet-pilote",displayName:state.name||"Carnet Pilote"},
      pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"discouraged"},timeout:60000}});
    state.settings.bioId=b64(c.rawId);save();render();toast("Empreinte activée 👆");}
  catch(e){toast("Empreinte non activée : "+(e&&e.name==="NotAllowedError"?"annulé":"essaie encore"),4000);}
}
async function bioUnlock(){
  const id=state.settings.bioId;if(!id)return false;
  try{await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:"public-key",id:unb64(id)}],userVerification:"required",timeout:60000}});return true;}
  catch(e){return false;}
}

const learnWords=t=>sigWords(t).filter(w=>w.length>=5&&!GEN_W.has(w)&&!WEAK_W.has(w));
function guessSubj(text){
  const k=" "+dupKey(text)+" ",T=sigWords(text),TL=learnWords(text);if(k.trim().length<2)return "";
  const sc={},add=(n,v)=>{if(n)sc[n]=(sc[n]||0)+v;};
  const has=x=>{const q=dupKey(x);return !!q&&k.includes(" "+q+" ");};
  const live=state.projects.filter(p=>p.status!=="termine");
  live.forEach(p=>{const W=sigWords(p.name);if(W.length){const hw=W.filter(w=>k.includes(" "+w));
      if(hw.length===W.length)add(p.name,10+hw.length);else{const strong=hw.filter(w=>!WEAK_W.has(w)&&!GEN_W.has(w));if(strong.length)add(p.name,strong.length*3);}}
    sigWords([p.next,p.why,p.notes].join(" ")).filter(w=>w.length>=5&&!GEN_W.has(w)&&!WEAK_W.has(w)).slice(0,40).forEach(w=>{if(T.includes(w))add(p.name,1);});});
  const L=state.subjLearn||{},lt={};TL.forEach(w=>{const m=L[w];if(m)Object.entries(m).forEach(([s,c])=>{lt[s]=(lt[s]||0)+Math.min(3,c);});});
  Object.entries(lt).forEach(([s,v])=>add(s,Math.min(6,v)));
  Object.entries(SUBJ_KW).forEach(([d,kw])=>{if(state.lists.domains.includes(d))kw.split(",").forEach(x=>{if(has(x))add(d,2.5);});});
  const ck=CARNET_KW.split(",").filter(has).length;
  if(ck){const cp=live.find(p=>/carnet pilote/.test(norm(p.name)));add(cp?cp.name:"Carnet Pilote",5+2*Math.min(ck,3)+(has("carnet pilote")?6:0));}
  let best="",bs=2;Object.entries(sc).forEach(([n,v])=>{if(v>bs){bs=v;best=n;}});return best;
}
function autoSubj(t){const s=guessSubj(t);if(s&&!state.projects.some(p=>p.name===s)&&!state.lists.domains.includes(s))return addToList("repSubj",s);return s;}
function learnSubj(text,subj){if(!subj)return;const L=state.subjLearn=state.subjLearn||{};learnWords(text).forEach(w=>{const m=L[w]=L[w]||{};m[subj]=(m[subj]||0)+1;});}
function unlearnSubj(text,subj){if(!subj)return;const L=state.subjLearn||{};learnWords(text).forEach(w=>{const m=L[w];if(m&&m[subj]){m[subj]--;if(m[subj]<=0)delete m[subj];if(!Object.keys(m).length)delete L[w];}});}

  rec.onresult=e=>{let txt="";for(let i=0;i<e.results.length;i++)txt+=e.results[i][0].transcript;const t=document.getElementById(id);if(!t)return;t.value=(base+txt).replace(/\s{2,}/g," ");toEnd(t);if(modalKind==="form")modalDirty=true;try{t.dispatchEvent(new Event("input",{bubbles:true}));}catch(e){}};

/* ---------- V25 : nettoyage des éléments « à effacer » ---------- */
const CLEAN_RX="a effacer",CLEAN_BAK="carnetPilote_avantNettoyage";
const CLEAN_SKIP=new Set(["settings","tests","ui","taskOrd","snooze","subjLearn","seenVersion","cleanKeep","aidePins","reprendre"]);
const CLEAN_WHERE={tasks:"Tâches & RDV",projects:"Projets",rep:"Reprendre ici",ideas:"Idées",skills:"Compétences",targets:"Métier visé",contacts:"Contacts",calls:"Appels",wins:"Mes victoires",music:"Musique",asstQ:"Assistant",claudeReq:"Demandes à Claude",journal:"Journal de bord",work:"Journal de bord",urgent:"Urgences",alerts:"Rappels",lists:"Menus (choix des listes)",sante:"Santé",q:"Mon quotidien",kine:"Santé › Kiné",carnets:"Mes carnets",outbox:"Courrier pour mes carnets"};
let cleanList=[],cleanBak=null;
const nrmC=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[’'\s]+/g," ");
function strHit(v){return typeof v==="string"&&v.length<4000&&!v.startsWith("data:")&&nrmC(v).includes(CLEAN_RX);}
function objHit(o){for(const k in o){const v=o[k];if(strHit(v))return true;if(Array.isArray(v)&&v.some(strHit))return true;}return false;}
function itemLabel(o){if(typeof o==="string")return o;for(const k of["title","name","text","what","act","choice","label","q","topic","note","why"]){if(typeof o[k]==="string"&&o[k].trim())return o[k];}return Object.values(o).find(strHit)||"(sans titre)";}
function cleanSig(where,o){return where+"|"+(o&&typeof o==="object"&&o.id?o.id:itemLabel(o));}
function cleanFind(){const out=[],keep=new Set(state.cleanKeep||[]);
  const walk=(v,where,depth)=>{if(depth>7||!v||typeof v!=="object")return;
    if(Array.isArray(v)){v.forEach(it=>{if(strHit(it)||(it&&typeof it==="object"&&!Array.isArray(it)&&objHit(it))){const sig=cleanSig(where,it);if(!keep.has(sig))out.push({arr:v,item:it,where,label:itemLabel(it),sig});}else walk(it,where,depth+1);});return;}
    for(const k in v){if(depth===0&&CLEAN_SKIP.has(k))continue;walk(v[k],depth===0?(CLEAN_WHERE[k]||k):where,depth+1);}};
  walk(state,"",0);return out;}
function cleanBakGet(){if(cleanBak)return cleanBak;try{return localStorage.getItem(CLEAN_BAK);}catch(e){return null;}}
function cleanOpen(){cleanList=cleanFind();if(!cleanList.length){toast("Rien à effacer : aucun élément « à effacer » ✓",3500);return;}
  openModal(`<h2>🧹 Éléments « à effacer »</h2><p class="meta">Le carnet a trouvé ${pl(cleanList.length,"élément")} avec « à effacer ». Décoche ce que tu veux garder pour l’instant.</p>
  <div id="clList">${cleanList.map((h,i)=>`<div class="row" id="cl-${i}"><label class="grow clrow"><input type="checkbox" data-cl="${i}" checked><span><b>${esc(String(h.label).slice(0,140))}</b><span class="meta">${esc(h.where)}</span></span></label><button class="btn ghost spk" data-act="cleanKeep" data-id="${i}">Garder</button></div>`).join("")}</div>
  <p class="meta">« Garder » : le carnet ne te le proposera plus. Avant d’effacer, une copie de secours est faite : tu pourras annuler.</p>
  <div class="actions"><button class="btn ghost" data-act="cleanLater">Plus tard</button><button class="btn" data-act="cleanGo">🗑 Effacer les cochés</button></div>`,"clean");}
function cleanUndo(){const b=cleanBakGet();if(!b){toast("Pas de nettoyage à annuler");return;}
  try{const o=JSON.parse(b);state=fixState(o.state);save();cleanBak=null;try{localStorage.removeItem(CLEAN_BAK);}catch(e){}render();toast("Nettoyage annulé : tout est revenu ✓",3500);}catch(e){toast("⚠️ Impossible d’annuler");}}

function dayItems(){const out=[];const td=kineToday().filter(x=>!kineDone(x.id));

    box.forEach(m=>{if(m&&m.status==="recu"){const o=state.outbox.find(x=>x.id===m.id);if(o&&o.status!=="recu"){o.status="recu";o.recvAt=m.recvAt||today();ch=true;}}});
    box=box.filter(m=>m&&(m.from!=="carnet-pilote"||state.outbox.some(o=>o.id===m.id&&(o.status!=="recu"||m.status==="recu"))));
    const ids=new Set(box.map(m=>m.id));state.outbox.filter(o=>o.status!=="recu"&&!ids.has(o.id)).forEach(o=>box.push(mailMsg(o)));
    localStorage.setItem(MAIL_KEY,JSON.stringify(box));}catch(e){}
  if(ch){save();if(cur==="carnets")render();}return ch;}

function testLeft(){const L=TESTS[VERSION]||[];if(!L.length)return 0;const N=((state.tests||{})[VERSION]||{}).notes||{};return L.filter((x,i)=>!(N[i]||{}).r).length;}
function testPop(){const L=TESTS[VERSION]||[],n=testLeft();
  openModal(`<span class="em" aria-hidden="true">🧪</span><h2 class="center">Test de la ${VERSION}</h2><p class="center">Il reste <b>${pl(n,"étape")}</b> à tester, sur ${L.length}.</p>
  <p class="center meta">Cette fenêtre revient à chaque ouverture tant que chaque étape n’a pas « ✓ Ça marche » ou « ✗ Problème ».</p>
  <div class="actions" style="justify-content:center"><button class="btn ghost" data-act="closeModal">Plus tard</button><button class="btn" data-act="testOpen">▶ Continuer le test</button></div>`,"news");}
const testRun=()=>{const T=state.tests[VERSION]=state.tests[VERSION]||{i:0,notes:{}};if(!T.notes)T.notes={};return T;};
function testModal(i){const L=TESTS[VERSION]||[];if(!L.length){toast("Pas de fiche de test pour cette version");return;}
  const T=testRun();if(i===undefined){const f=L.findIndex((x,k)=>!(T.notes[k]||{}).r);i=f>=0?f:(T.i||0);}
  if(i>=L.length){testSummary();return;}
  i=Math.max(0,i);T.i=i;T.back=true;save();const s=L[i],n=T.notes[i]||{};
  openModal(`<h2>🧪 Tester la ${VERSION}</h2><p class="meta">Étape ${i+1} sur ${L.length}</p>${barH(Math.round(i*100/L.length))}
  <div class="teststep" id="testTxt"><p><b>${esc(s.k)}</b></p><p>${esc(s.t)}</p></div>
  <div class="bar noread"><button class="btn ghost" data-act="testRead">▶ Lire</button><button class="btn ghost" data-act="speakStop">⏸ Pause</button></div>
  <p class="hint noread">« Pause » arrête la lecture. « ▶ Lire » reprend l’étape au début, quand tu es prête.</p>
  <label>Résultat</label><div class="seg" id="testRes" role="group" aria-label="Résultat">${[["ok","✓ Ça marche"],["ko","✗ Problème"]].map(([k,l])=>`<button type="button" class="${n.r===k?"on":""}" data-act="testMark" data-id="${i}|${k}">${l}</button>`).join("")}</div>
  <label for="testNote">Ma remarque pour la version suivante <span class="hint">(facultatif)</span></label>
  <div class="inline" style="align-items:flex-start"><textarea id="testNote" class="grow-ta" rows="2" data-i="${i}" placeholder="Ce qui ne va pas, ce que je voudrais…">${esc(n.note||"")}</textarea>${micBtn("testNote")}</div>
  <div class="actions"><button class="btn ghost" data-act="testGo" data-id="${i-1}" ${i?"":"disabled"}>‹ Précédente</button><button class="btn ghost" data-act="testSum">Résumé</button><button class="btn" data-act="testGo" data-id="${i+1}">${i===L.length-1?"Terminer":"Suivante ›"}</button></div>`,"test");
  if(state.settings.testAuto)setTimeout(()=>{if(modalKind==="test")speak(s.k+". "+s.t);},350);}
/* V23 : la remarque de l’étape est enregistrée avant de changer d’étape, même si elle a été dictée */
function testFlush(){const t=document.getElementById("testNote");if(!t||t.dataset.i===undefined)return;const T=testRun(),n=T.notes[t.dataset.i]=T.notes[t.dataset.i]||{};const v=t.value.trim();if(v!==(n.note||"")){n.note=v;save();}}
function testText(){testFlush();const L=TESTS[VERSION]||[],T=testRun();const out=[];
  L.forEach((s,i)=>{const n=T.notes[i]||{};if(n.note||n.r==="ko")out.push("- ["+s.k+"]"+(n.r==="ko"?" ✗ problème":"")+(n.note?" : "+n.note:""));});
  const ok=L.filter((s,i)=>(T.notes[i]||{}).r==="ok").length;
  return "Remarques après les tests de la "+VERSION+" :\n"+(out.length?out.join("\n"):"- Tout fonctionne, rien à signaler.")+"\n("+ok+" étape"+(ok>1?"s":"")+" sur "+L.length+" validée"+(ok>1?"s":"")+")";}
function testSummary(){testFlush();speakStop();const L=TESTS[VERSION]||[],T=testRun();
  openModal(`<h2>🧪 Résumé du test de la ${VERSION}</h2>${testLeft()?"":testDoneBox()}
  ${L.map((s,i)=>{const n=T.notes[i]||{};return `<div class="row"><span class="pic">${n.r==="ok"?"✓":n.r==="ko"?"✗":"·"}</span><div class="grow"><b>${esc(s.k)}</b>${n.note?`<div class="meta">${esc(n.note)}</div>`:""}</div><button class="icon" data-act="testGo" data-id="${i}" aria-label="Revoir l’étape">↩</button></div>`;}).join("")}
  <label for="testOut">Texte pour Claude</label><textarea id="testOut" rows="5" readonly>${esc(testText())}</textarea>
  <div class="bar"><button class="btn" data-act="testCopy">📋 Copier mes remarques</button><button class="btn ghost" data-act="testToRep">☑️ Mettre dans Reprendre ici</button></div>
  <div class="actions"><button class="btn ghost" data-act="testReset">Recommencer à zéro</button><button class="btn" data-act="closeModal">Fermer</button></div>`,"test");}

const asstName=()=>state.settings.asstName||"Mon assistant";

const byWhen=(a,b)=>((a.date||"9999")+(a.time||"")).localeCompare((b.date||"9999")+(b.time||""));
function microPick(){const O=state.tasks.filter(t=>!t.done);return O.find(t=>t.micro)||O.filter(t=>t.urg!=="rouge").sort(byWhen)[0]||null;}
function asstAnswer(src,txt){
  const td=today(),O=state.tasks.filter(t=>!t.done),li=a=>a.map(x=>`<p>• ${x}</p>`).join("");
  const tl=t=>esc(t.title)+(t.date?` <span class="meta">(${t.date===td?"aujourd’hui":fmt(t.date)}${t.time?" à "+hText(t.time):""})</span>`:"");
  if(src==="today"){const now=O.filter(t=>t.date===td).sort(byWhen),late=O.filter(t=>t.date&&t.date<td).sort(byWhen),urg=O.filter(t=>t.urg==="rouge"&&!t.date);let h="";
    if(now.length)h+=`<p><b>Aujourd’hui :</b></p>`+li(now.map(tl));if(late.length)h+=`<p><b>Date passée, encore à faire :</b></p>`+li(late.slice(0,4).map(tl));if(urg.length)h+=`<p><b>Urgent, sans date :</b></p>`+li(urg.slice(0,3).map(tl));
    if(!h){const m=microPick();h=`<p>Rien de prévu aujourd’hui.</p>${m?`<p>Une idée : <b>${esc(m.title)}</b>.</p>`:""}`;}
    const tip={basse:"Phase basse : une seule chose, 10 minutes maximum. Le reste peut attendre.",haute:"Phase haute : note tes idées, mais ne lance rien de nouveau."}[state.mode]||"Une chose à la fois, avec le minuteur 🍅.";
    return h+`<p class="meta">${tip}</p>`;}
  if(src==="week"){const end=isoOf(new Date(Date.now()+7*86400000)),L=O.filter(t=>t.date&&t.date>=td&&t.date<=end&&(t.type==="rdv"||t.time)).sort(byWhen);
    return L.length?`<p><b>${pl(L.length,"rendez-vous","rendez-vous")} dans les 7 prochains jours :</b></p>`+li(L.map(t=>`${longDay(t.date)}${t.time?" à "+hText(t.time):""} : ${esc(t.title)}`)):`<p>Aucun rendez-vous dans les 7 prochains jours.</p>`;}
  if(src==="where"){const R=state.rep.filter(r=>!r.done).slice(0,5),j=state.journal[0],w=state.work.find(x=>x.cat!=="Visite"&&(x.details||x.cat));let h="";
    if(R.length)h+=`<p><b>Reprendre ici :</b></p>`+li(R.map(r=>esc(r.text)));
    if(w)h+=`<p><b>Dernière séance de travail</b> (${fmt(w.date)}) : ${esc([w.cat,w.details].filter(Boolean).join(", "))}.</p>`;
    if(j)h+=`<p><b>Dernière note du journal</b> (${fmt(j.date)}) : ${esc(j.text.slice(0,160))}${j.text.length>160?"…":""}</p>`;
    return h||`<p>Rien de noté pour l’instant. Écris où tu en es dans « Reprendre ici », sur l’Accueil.</p>`;}
  if(src==="win"){const C=[];state.tasks.filter(t=>t.done).forEach(t=>C.push(`Tu as fait : <b>${esc(t.title)}</b>${t.doneDate?" (le "+fmt(t.doneDate)+")":""}.`));
    state.wins.forEach(w=>C.push(`Tu te souviens ? <b>${esc(w.title)}</b>${w.date?" (le "+fmt(w.date)+")":""}${w.learn?". À retenir : "+esc(w.learn):""}.`));
    state.projects.filter(p=>p.status==="termine").forEach(p=>C.push(`Projet terminé : <b>${esc(p.name)}</b>.`));
    const wk=state.tasks.filter(t=>t.done&&t.doneDate&&daysSince(t.doneDate)<7).length;
    return C.length?`<p>${pick(C)}</p><p>Bravo 👏</p><p class="meta">Cette semaine : ${pl(wk,"tâche faite","tâches faites")}.</p>`:`<p>Ta première victoire t’attend : coche une petite tâche, même de 5 minutes. Tu peux aussi ajouter une victoire passée dans « Mes victoires ».</p>`;}
  if(src==="micro"){const m=microPick();return m?`<p>Une seule chose, 10 minutes maximum :</p><p><b>${esc(m.title)}</b></p><p class="meta">Lance le minuteur 🍅 si tu veux. Et si c’est trop aujourd’hui, c’est OK aussi.</p>`:`<p>Écris une phrase dans ton journal de bord : ce que tu as fait, ou ce que tu ressens.</p>`;}
  if(src==="prio"){const S=state.projects.filter(p=>p.star&&p.status!=="termine");return S.length?li(S.map(p=>`<b>${esc(p.name)}</b>${p.next?" : "+esc(p.next):""}`)):`<p>Aucune priorité choisie. Dans Projets, touche ☆ sur 3 projets maximum.</p>`;}
  if(src==="urgent"){const U=state.urgent.map(u=>esc(u.text)),A=state.alerts.filter(a=>(!a.until||a.until>=td)&&(!a.from||a.from<=td)).map(a=>esc(a.text));
    return U.length||A.length?(U.length?`<p><b>Notes urgentes :</b></p>`+li(U):"")+(A.length?`<p><b>Rappels importants :</b></p>`+li(A):""):`<p>Rien d’urgent. Respire.</p>`;}
  if(src==="abo"){const lim=isoOf(new Date(Date.now()+30*86400000)),L=state.q.abo.filter(x=>!aboOff(x)&&((x.end&&x.end<=lim)||(x.remind&&x.remind<=lim)||(x.until&&x.until<=lim)));
    return L.length?li(L.map(x=>`<b>${esc(x.name)}</b>${x.remind?" : résilier avant le "+fmt(x.remind):x.until?" : actif jusqu’au "+fmt(x.until):x.end?" : fin ou renouvellement le "+fmt(x.end):""}`)):`<p>Aucun abonnement ne se termine dans les 30 prochains jours.</p>`;}
  if(src==="pret"){const L=state.q.pret.filter(x=>!isBack(x));return L.length?li(L.map(x=>`<b>${esc(x.what)}</b> (${esc(x.kind||"Prêté")}${x.who?", "+esc(x.who):""}${x.ret?", retour le "+fmt(x.ret):""})`)):`<p>Rien en cours : tout est rendu ✓</p>`;}
  if(src==="ess"){const E=state.sante.ess.concat(state.q.alim.filter(a=>a.ali));if(!E.length)return `<p>Aucun essentiel noté pour l’instant (✚ Santé, Mes essentiels).</p>`;const x=pick(E);return `<p>N’oublie pas : <b>${esc(x.name)}</b>${x.use?", pour "+esc(x.use):""}.</p>${x.where?`<p>📍 Rangé : ${esc(x.where)}</p>`:""}`;}
  return `<p>${esc(txt||"").replace(/\n/g,"<br>")||"(réponse vide : modifie ta question)"}</p>`;}

  const ld=longDate();return "Aujourd’hui : "+ld.charAt(0).toLowerCase()+ld.slice(1)+", "+ph+"."+(S.length?"\nMes priorités : "+S.join(" ; ")+".":"");}
function claudeText(id){const td=today(),O=state.tasks.filter(t=>!t.done),tl=t=>"- "+t.title+(t.date?" ("+(t.date===td?"aujourd’hui":fmt(t.date))+(t.time?" à "+hText(t.time):"")+")":"")+(t.urg==="rouge"?" [urgent]":"");

  if(id==="decoupe"){const sel=val("clTask"),t=state.tasks.find(x=>x.id===sel),name=t?t.title:(val("clTaskO")||"…");

const SKILL_PROMPT="Voici ce que j’ai fait récemment, extrait de mon Carnet Pilote. Traduis-le en compétences utiles pour un CV ou un recrutement (savoir-faire, savoir-être, compétences numériques). Réponds avec une compétence par ligne, sous la forme « Compétence : exemple concret qui la prouve [technique] » ou « … [transversale] ». [technique] = savoir-faire, outil, compétence numérique ou de métier ; [transversale] = savoir-être, organisation, utile dans tous les métiers. Reste simple et concis, sans titre ni introduction.";
function skillsSource(){
  const since=state.lastSkills&&state.lastSkills.date||"";
  const ok=d=>!since||(d||"")>=since;
  const L=[SKILL_PROMPT,"",since?"Période : depuis le "+fmt(since)+".":"Période : depuis le début du carnet."];
  const j=state.journal.filter(x=>ok(x.date));
  if(j.length){L.push("","JOURNAL DE BORD :");j.forEach(x=>L.push("- "+fmt(x.date)+" : "+x.text.replace(/\n/g," ")));}
  const w=state.work.filter(x=>ok(x.date)&&x.cat!=="Visite");
  if(w.length){L.push("","DURÉE DE TRAVAIL :");w.forEach(x=>L.push("- "+fmt(x.date)+", "+[x.tool,x.cat,x.details].filter(Boolean).join(", ")+" ("+fmtSec(wSec(x))+")"));}
  const done=state.tasks.filter(t=>t.done&&ok(t.doneDate||t.created));
  if(done.length){L.push("","TÂCHES TERMINÉES :");done.forEach(t=>L.push("- "+t.title+" ("+t.domain+")"));}
  const b=state.projects.filter(p=>p.status==="termine"&&(p.bilan||p.notes));
  if(b.length){L.push("","BILANS DE PROJETS TERMINÉS :");b.forEach(p=>L.push("- "+p.name+" : "+[p.bilan,p.notes].filter(Boolean).join(" ").replace(/\n/g," ")));}
  const a=state.projects.filter(p=>p.status==="actif");
  if(a.length){L.push("","PROJETS EN COURS :");a.forEach(p=>L.push("- "+p.name+(p.notes?" : "+p.notes.replace(/\n/g," "):"")));}
  return L.join("\n");
}
const SK_TYPES={tech:"🛠️ Technique",transv:"🤝 Transversale"};
function skType(raw){const n=norm(raw);if(/transv|savoir.?etre/.test(n))return "transv";if(/techn|savoir.?faire/.test(n))return "tech";return "";}
function cutType(l){const m=l.match(/\s*[\[(]\s*(techniques?|transversales?|savoir.?faire|savoir.?[eê]tre)\s*[\])]\s*\.?\s*$/i);return m?{l:l.slice(0,m.index).trim(),type:skType(m[1])}:{l,type:""};}
function parseSkills(raw){
  const items=[];
  raw.split(/\n/).forEach(line=>{
    let l=line.trim();if(!l||/^\|?\s*:?-{3,}/.test(l))return;
    if(l.includes("|")){const c=l.split("|").map(x=>x.replace(/\*\*/g,"").trim()).filter(Boolean);if(c.length>=1&&!/^comp[ée]tence/i.test(c[0])){const ct=cutType(c[1]||"");items.push({name:c[0],proof:ct.l,type:ct.type||skType(c[2]||"")});}return;}
    l=l.replace(/^([-*•]|\d+[.)])\s*/,"").replace(/\*\*/g,"").trim();
    const ct=cutType(l);l=ct.l;const ty=ct.type;
    const i=l.indexOf(":");
    if(i===l.length-1)return;
    if(i>0)items.push({name:l.slice(0,i).trim(),proof:l.slice(i+1).trim(),type:ty});else if(l)items.push({name:l,proof:"",type:ty});
  });
  return items;
}

function parseJob(raw){
  const have=[],todo=[];let mode="";
  raw.split(/\n/).forEach(line=>{
    let l=line.replace(/^[#>*\s]+|[*\s]+$/g,"").replace(/\*\*/g,"").trim();if(!l)return;
    const n=norm(l),head=!/^([-•]|\d+[.)])\s/.test(line.trim())&&(l.indexOf(":")<0||/:$/.test(l))&&l.length<60;
    if(head&&/deja|transferable|acquis/.test(n)){mode="have";return;}
    if(head&&/developp|manque|a acquerir/.test(n)){mode="todo";return;}
    if(!mode)return;
    l=l.replace(/^([-*•]|\d+[.)])\s*/,"").trim();const i=l.indexOf(":");
    const it={name:(i>0?l.slice(0,i):l).trim(),note:i>0?l.slice(i+1).trim():""};
    if(it.name)(mode==="have"?have:todo).push(mode==="todo"?Object.assign(it,{done:false}):it);
  });
  return {have,todo};
}

  ["asst","🤖 Mon assistant et 💬 Demander à Claude",`<p><b>🤖 Mon assistant</b> : le petit robot en haut de l’écran. Touche une question toute prête (« Qu’est-ce que je fais aujourd’hui ? », « Où j’en étais ? »…) : il répond avec ce qui est dans ton carnet, et lit la réponse à voix haute. Sans IA, sans Internet.</p>
    <p><b>➕ Autre…</b> : ta question à toi. Tu choisis d’où vient la réponse (tes RDV, tes priorités, tes prêts…) ou tu l’écris toi-même.</p>
    <p><b>💬 Demander à Claude</b> (Accueil ou robot) : choisis une demande (organiser ma journée, trier mes pensées, découper une tâche, écrire un message, améliorer mon carnet, ou ➕ Autre…). Le carnet prépare le texte avec ce qu’il sait. Relis-le, puis « Copier et ouvrir Claude » : colle dans Claude.</p>
    <p class="meta">Nom (ex. « Pilotias »), visage et lecture à voix haute : ⚙️ Paramètres, Mon assistant.</p>`],
  ["note20","✍️ Note rapide et dictée",`<ol class="steps"><li><span>Dans n’importe quel onglet, touche le bouton flottant <b>✍️</b> (pâle quand il ne sert pas).</span></li>
    <li><span>Dicte ton idée (🎤 ou le micro du clavier). La case s’agrandit : tu vois toujours les derniers mots.</span></li>
    <li><span><b>Ajouter</b> : la ligne arrive en haut de Reprendre ici, avec l’endroit devant (ex. [Paramètres]) et son sujet trouvé tout seul. Tu restes sur ta page.</span></li></ol>
    <p class="meta">Un sujet faux ? ✎ sur la ligne pour le corriger : le carnet apprend. « 🔄 Revoir les sujets » corrige toutes les lignes au sujet automatique.</p>`],
  ["test20","🧪 Tester une nouvelle version",`<ol class="steps"><li><span>À l’ouverture d’une nouvelle version : <b>« 🧪 Tester les nouveautés »</b> (ou ⚙️ Paramètres, Historique).</span></li>
    <li><span>Chaque étape se lit à voix haute. <b>⏸ Pause</b> quand tu veux, <b>▶ Lire</b> pour reprendre l’étape.</span></li>
    <li><span>Note « ✓ Ça marche » ou « ✗ Problème », et ta remarque (tu peux dicter). Elle est rangée sous le nom de l’étape.</span></li>
    <li><span><b>Résumé</b>, puis <b>📋 Copier mes remarques</b> : colle-les à Claude pour la version suivante. Ou « ☑️ Mettre dans Reprendre ici ».</span></li></ol>
    <p class="meta">Tu peux t’arrêter et reprendre plus tard : le carnet garde ta place et tes remarques.</p>`],
  ["mots20","🔎 Mes mots cachés",`<p>Tu tapes un mot dans la recherche et rien n’apparaît ? Touche <b>« Ajouter comme mot caché »</b>, ou va dans ⚙️ Paramètres, <b>Mes mots cachés</b> : choisis la partie, écris le mot (ex. « SOS » pour tes contacts d’urgence).</p>
    <p>Dans « Aller à » (Paramètres, Journal, Compétences) : si rien n’est trouvé dans la page, le carnet cherche dans tout le carnet.</p>`],
  ["barre19","☰ Onglets et sommaires adaptés",`<p><b>Barre des onglets :</b> elle montre l’Accueil, les Paramètres et tes onglets les plus utilisés, moins en phase basse. Touche <b>« ☰ +… »</b> au bout de la barre pour tout voir, <b>« ▴ Moins »</b> pour revenir. Réglages : ⚙️ Paramètres, Barre des onglets.</p>
    <p><b>« Aller à »</b> (Paramètres, Journal, Compétences) : tes parties les plus ouvertes d’abord. <b>« ▸ Toutes les parties »</b> pour tout voir, ou tape un mot dans la case.</p>
    <p><b>Barres qui restent en haut :</b> les filtres de Tâches & RDV, les parties de Quotidien et de Santé. « ▾ Replier » pour gagner de la place.</p>
    <p><b>‹ ›</b> : les petites flèches font défiler un tableau ou une barre trop large.</p>`],
  ["v21","↕️ Ordre, photos, Musicolet et replis (V21)",`<p><b>↕️ Ordre des tâches :</b> dans Tâches & RDV, ↑ ↓ à côté d’une tâche la fait monter ou descendre, même au-dessus d’une urgente. « ↺ Ordre automatique » (en haut du domaine) remet le classement par couleur, puis par date. Pareil pour tes liens dans Fichiers Drive.</p>
    <p><b>🔍 Photos :</b> touche une photo pour l’ouvrir en grand. Touche Fermer, ou l’image, pour revenir.</p>
    <p><b>🎶 Musicolet :</b> pendant le minuteur 🍅 et les pauses, « 🎶 Ouvrir Musicolet ». Selon le téléphone, Musicolet s’ouvre directement, ou sa page Play Store : touche alors « Ouvrir ». Choisis ta playlist dans l’appli. Dans « 🎵 Mes musiques », coche « playlist de Musicolet » pour garder le nom de tes playlists.</p>
    <p><b>🗂️ Replier :</b> touche le titre d’une partie longue (Journal de bord, Historique des versions…) pour la replier ou la déplier. Le carnet se souvient de ton choix.</p>
    <p><b>⏱ Natures du chronomètre :</b> tes 3 natures les plus utilisées sont toujours visibles, les autres sous « Autres natures ».</p>
    <p class="meta">🧪 Après une nouvelle version, la fenêtre de test revient à chaque ouverture tant que toutes les étapes ne sont pas testées.</p>`],
  ["v22","🧪 Retour au test, ordre et lecture (V22)",`<p><b>🧪 Retour au test :</b> pendant la fiche de test, ferme-la (✕) pour aller vérifier dans un onglet. En bas à gauche, « 🧪 Retour au test » te ramène à la même étape. Il disparaît quand toutes les étapes sont testées. ✕ à côté pour le cacher.</p>
    <p><b>↕️ Ordre des tâches :</b> chaque domaine a son propre ordre. Une tâche dans deux domaines peut être en haut dans l’un et plus bas dans l’autre. Une nouvelle tâche arrive en haut. « ↺ Ordre automatique » remet le classement par couleur, puis par date.</p>
    <p><b>🎶 Musicolet :</b> ▶ ouvre Musicolet directement. Sur certains téléphones, le Play Store passe une fraction de seconde avant.</p>
    <p><b>🔊 Vitesse de lecture :</b> change-la pendant la lecture : elle reprend à la phrase en cours. 🐢 Lente, Normale, 🐇 Rapide.</p>`],
  ["v23","📋 Une seule liste, musiques et lecture (V23)",`<p><b>📋 Une seule liste :</b> dans Tâches & RDV, ce filtre montre toutes tes tâches ensemble. ↑ ↓ les classe comme tu veux, tous domaines confondus. Les domaines gardent leur propre ordre.</p>
    <p><b>↺ Ordre automatique :</b> toujours visible sous les filtres. Il remet le classement par couleur, puis par date, pour ce que tu regardes.</p>
    <p><b>🎶 Musicolet :</b> le bouton ouvre sa page Play Store ; touche « Ouvrir ». Une page web ne peut pas faire mieux sur Android. Astuce : icône ou widget Musicolet sur l’écran d’accueil.</p>
    <p><b>🔊 Vitesse :</b> change-la pendant la lecture, elle repart au mot en cours.</p>
    <p class="meta">🧪 Tes remarques dictées avec 🎤 dans la fiche de test sont bien gardées.</p>`],
  ["v24","🪟 Fiches protégées, tri et rappels (V24)",`<p><b>🪟 Fiches protégées :</b> si la pause du minuteur 🍅 arrive pendant que tu remplis une fiche, sa fenêtre s’affiche par-dessus. Réponds (pause, reprendre…) : ta fiche revient, remplie. Si le carnet se ferme avant « Enregistrer », il te propose de la reprendre à la prochaine ouverture.</p>
    <p><b>✍️ Note rapide :</b> le bouton ✍️ reste visible sur les fiches. Tu le déplaces au doigt s’il cache une case.</p>
    <p><b>↕️ Trier par :</b> dans Tâches & RDV, en haut. Changer de tri remplace ton ordre fait avec ↑ ↓ (le carnet te demande d’abord). « Autre… » : tu ranges toi-même avec ↑ ↓.</p>
    <p><b>🔔 Rappels Google Agenda, sans e-mail :</b> le fichier de la cloche contient 2 rappels. Google Agenda ne les garde pas toujours : règle-le une fois pour toutes.</p>
    <ol class="steps"><li><span>Ouvre <b>Google Agenda</b>, puis ☰ (en haut à gauche) et <b>Paramètres</b>.</span></li>
    <li><span>Touche ton agenda (ton adresse Gmail), puis <b>Notifications par défaut</b>.</span></li>
    <li><span>Garde seulement des <b>Notifications</b> : 1 jour avant, et 10 minutes avant. Supprime toute ligne « E-mail ».</span></li>
    <li><span>Pour les RDV, change le 2ᵉ rappel en <b>2 heures</b> dans l’événement, si Google ne l’a pas gardé.</span></li></ol>
    <p class="meta">Un vrai lien direct entre le carnet et Google Agenda est possible plus tard, mais demande un compte Google Cloud et une connexion : à voir si tu en as besoin.</p>`],
  ["v25","🧘 Kiné, nettoyage et mes carnets (V25)",`<p><b>🧹 « À effacer » :</b> pendant un test, mets « test à effacer » dans le nom de ce que tu crées. Le carnet les retrouve tous et te propose de les effacer. « Plus tard » : il redemande le lendemain. « Garder » : il ne le propose plus. Juste après un nettoyage, « Annuler » remet tout.</p>
    <p><b>🧘 Kiné :</b> Santé › Kiné. Une fiche par exercice, rangée par « Pour quoi ? ». Les vidéos filmées avec le téléphone sont trop lourdes : range-les sur ton Drive et colle le lien. Les jours choisis, le rappel est dans l’Accueil. Le bouton 🔔 Agenda crée un événement qui revient chaque semaine (règle ses notifications à la main dans Google Agenda).</p>
    <p><b>💞 Bilan du couple :</b> le rappel se règle dans Paramètres. Le fichier n’est pas en ligne : ouvre-le dans Chrome.</p>
    <p><b>🔗 Mes carnets :</b> un carnet en ligne (GitHub) s’ouvre d’un toucher. Un simple fichier ne peut pas s’ouvrir depuis le carnet : Chrome l’interdit pour ta sécurité.</p>`],
  ["v26","☁️ Synchroniser mes appareils (V26)",`<p>But : le <b>même carnet</b> sur ton téléphone et ton ordinateur. Il faut d’abord créer, <b>une seule fois</b>, ton identifiant Google (gratuit). Fais-le sur l’ordinateur, c’est plus confortable (environ 15 minutes).</p>
    <ol class="steps"><li><span><span class="pic">🌐</span> Va sur <b>console.cloud.google.com</b> et connecte-toi avec le compte Google de ton Drive. Accepte les conditions.</span></li>
    <li><span><span class="pic">➕</span> En haut, « Sélectionner un projet », puis <b>Nouveau projet</b>. Nom : <b>Carnet Pilote</b>. <b>Créer</b>, puis choisis ce projet.</span></li>
    <li><span><span class="pic">📚</span> Menu ☰, <b>API et services</b>, <b>Bibliothèque</b>. Cherche <b>Google Drive API</b>, ouvre-la, puis <b>Activer</b>.</span></li>
    <li><span><span class="pic">📝</span> Menu ☰, <b>API et services</b>, <b>Écran de consentement OAuth</b> (parfois appelé « Google Auth Platform »), puis <b>Commencer</b>. Nom de l’application : <b>Carnet Pilote</b>. E-mail d’assistance : le tien. Cible : <b>Externe</b>. E-mail de contact : le tien. Accepte, puis <b>Créer</b>.</span></li>
    <li><span><span class="pic">👤</span> Partie <b>Audience</b>, « Utilisateurs test » : <b>Add users</b>, écris ton adresse Gmail, <b>Enregistrer</b>.</span></li>
    <li><span><span class="pic">🔑</span> Partie <b>Clients</b> : <b>Créer un client</b>. Type : <b>Application Web</b>. Nom : Carnet Pilote. « Origines JavaScript autorisées » : <b>Ajouter un URI</b>, écris <b>https://carnet-personnalise.github.io</b> (rien après). <b>Créer</b>.</span></li>
    <li><span><span class="pic">📋</span> Copie l’<b>ID client</b> (il finit par <b>.apps.googleusercontent.com</b>). Range-le dans une note : ce n’est pas un mot de passe, mais ne le mets pas dans le fichier du carnet.</span></li>
    <li><span><span class="pic">⚙️</span> Dans le carnet <b>en ligne</b> : Paramètres, <b>☁️ Synchronisation</b>. Choisis l’appareil, colle l’identifiant, puis <b>Activer et synchroniser</b>. Google te demande ton compte : accepte. S’il affiche « Google n’a pas validé cette application » : c’est normal, c’est la tienne. Touche <b>Continuer</b>.</span></li>
    <li><span><span class="pic">📱</span> Fais pareil sur l’autre appareil. Le bouton « 📋 Copier mon identifiant » t’évite de le retaper.</span></li></ol>
    <p><b>Commence par l’appareil qui a les données les plus à jour.</b> Au premier passage, le carnet réunit ce qu’il y a sur les deux appareils.</p>
    <p><b>☁️ Ensuite :</b> après chaque changement, l’envoi se fait tout seul (environ 15 secondes). Depuis la V27, l’autre appareil le reçoit aussi tout seul, en moins d’une minute, s’il est ouvert. En haut : <b>☁️✓</b> = à jour. <b>☁️ Synchro</b> (entouré) = Google demande de te reconnecter, environ toutes les heures : touche-le. À l’ouverture, le carnet te pose la question.</p>
    <p><b>🛟 Sécurité :</b> le fichier <b>Carnet_Pilote_synchro.json</b> sur ton Drive contient tout ton carnet, santé comprise : ne le modifie pas, ne le partage pas, ne le mets jamais sur GitHub. Garde aussi ta sauvegarde .json de la semaine.</p>
    <p><b>Si ça bloque :</b> « origin_mismatch » : l’adresse de l’étape 6 est mal écrite. « Accès bloqué… validation » : ajoute ton adresse dans les utilisateurs test (étape 5). Rien ne s’ouvre dans l’application installée : essaie la même adresse dans Chrome (mêmes données).</p>
    <h3 style="margin:18px 0 4px">📤 Le courrier vers mes autres carnets</h3>
    <p>Le Carnet Pilote est ton point d’entrée. Quand tu écris « KN » (ou Kay Numérique, Caille numérique…) dans Reprendre ici, la note rapide ✍️ ou une tâche, il te propose de l’envoyer dans Kay Numérique, dans la bonne partie. Les mots-clés et les parties de chaque carnet se changent dans 🔗 Mes carnets (✎).</p>
    <p>Pour que l’autre carnet range son courrier tout seul, il doit apprendre à le lire. Une seule fois par carnet : ouvre un projet Claude avec ce carnet, colle ce texte, en remplaçant [ADRESSE] par son adresse de réception${(state.carnets||[]).filter(c=>c.key).length?" ("+(state.carnets||[]).filter(c=>c.key).map(c=>esc(c.name)+" : <b>"+esc(c.key)+"</b>").join(" ; ")+")":""}.</p>
    <label for="mailPrompt">Texte à donner à Claude</label><textarea id="mailPrompt" rows="8" readonly>${esc(MAIL_PROMPT)}</textarea>
    <div class="bar" style="margin:10px 0 0"><button class="btn ghost" data-act="copyMailPrompt">Copier le texte</button></div>
    <p class="meta">En attendant, chaque message a un bouton « 📋 Copier » et « Ouvrir le carnet ». Le courrier marche quand les deux carnets sont en ligne au même endroit (carnet-personnalise.github.io), sur le même appareil. Avec la synchronisation, il suit sur tes deux appareils.</p>`],
  ["regles","📋 Mes règles pour tout nouveau carnet HTML",`<p>Avant de créer un nouveau carnet (ou de faire évoluer celui de Kay Numérique), copie ce texte et colle-le à Claude <b>avant</b> de décrire ton besoin.</p>
    <label for="basePrompt">Règles communes à copier</label><textarea id="basePrompt" rows="8" readonly>${esc(BASE_PROMPT)}</textarea>
    <div class="bar" style="margin:10px 0 0"><button class="btn ghost" data-act="copyBase">Copier les règles</button></div>`],
  ["appli","📲 Mon carnet en application",`<p>Le carnet est en ligne à l’adresse <b>carnet-personnalise.github.io/pilote-yas</b>. Il s’installe comme une vraie application, avec son icône « Yas ».</p>
    <ol class="steps">
    <li><span><span class="pic">🌐</span> Ouvre l’adresse dans <b>Chrome</b>.</span></li>
    <li><span><span class="pic">⋮</span> Menu ⋮, puis <b>Installer l’application</b> (ou « Ajouter à l’écran d’accueil »), puis <b>Installer</b>.</span></li>
    <li><span><span class="pic">📱</span> Ouvre-la toujours depuis l’icône <b>Carnet Pilote</b> de ton écran.</span></li>
    <li><span><span class="pic">⚙️</span> La première fois seulement : Paramètres, <b>Restaurer</b> ta sauvegarde .json.</span></li></ol>
    <p class="meta">Sans Internet, l’application s’ouvre quand même avec la dernière version gardée dans le téléphone.</p>`],
  ["enligne","🌐 Mettre un carnet en ligne (GitHub Pages)",`<p>À faire une seule fois par carnet (le tien, celui de Léa, celui d’un client).</p>
    <p><b>Les fichiers d’un dépôt :</b></p>
    <div class="tablewrap"><table style="min-width:0"><thead><tr><th>Fichier</th><th>À quoi il sert</th></tr></thead><tbody>
    <tr><td>index.html</td><td>Le carnet lui-même (le seul qui change à chaque version)</td></tr>
    <tr><td>manifest.json</td><td>La carte d’identité de l’application : nom, couleurs, icônes</td></tr>
    <tr><td>sw.js</td><td>Le Service Worker : fait reconnaître l’application et garde une copie pour ouvrir sans Internet</td></tr>
    <tr><td>icon-192.png, icon-512.png, icon-maskable-512.png</td><td>Les icônes de l’écran d’accueil (le logo)</td></tr></tbody></table></div>
    <ol class="steps">
    <li><span><span class="pic">👤</span> Compte GitHub : <b>carnet-personnalise</b>.</span></li>
    <li><span><span class="pic">➕</span> <b>+</b>, <b>New repository</b>. Nom court (ex. <b>pilote</b>, <b>lea</b>, prénom du client). <b>Public</b>. <b>Create repository</b>.</span></li>
    <li><span><span class="pic">⬆️</span> <b>uploading an existing file</b> : ajoute les 6 fichiers, puis <b>Commit changes</b>.</span></li>
    <li><span><span class="pic">⚙️</span> <b>Settings</b>, <b>Pages</b>. Branch : <b>main</b> et <b>/(root)</b>, puis <b>Save</b>.</span></li>
    <li><span><span class="pic">⏳</span> Attends 2 à 5 minutes. Adresse : <b>carnet-personnalise.github.io/nom-du-dépôt</b>.</span></li>
    <li><span><span class="pic">📲</span> Installe l’application (partie « Mon carnet en application »).</span></li></ol>
    <p class="meta">⚠️ Le dépôt est public : n’écris rien de personnel dans le fichier. Ce que tu tapes dans le carnet reste dans ton téléphone.</p>`],
  ["important","⚠️ Important",`<p>Tes données restent dans le téléphone, liées à l’adresse du carnet. Si tu vides les données de Chrome, désinstalles l’application ou changes de téléphone, le .json te permet de tout retrouver.</p>
    <p>Le fichier du carnet est <b>public</b> sur GitHub, mais tes données ne le sont pas : elles ne quittent jamais ton téléphone (sauf dans ton .json).</p>
    <p>Le mot de passe de départ (1234) est visible dans le fichier public : change-le dans ⚙️ Paramètres.</p>`]
  ];
  const toc=S.map(([k,t],i)=>`<button class="tocbtn${P.includes(k)?" pinned":""}" data-act="aideGo" data-id="${k}"><span class="num">${i+1}</span><span>${t}${P.includes(k)?" 🧷":""}</span></button>`).join("");
  return `<h2>🧠 Aide-mémoire</h2><p class="lead">Touche un numéro pour ouvrir la partie. Épingle 🧷 celles que tu veux garder ouvertes.</p>
  <nav class="block" id="aideToc" aria-label="Sommaire"><h3>Sommaire</h3>${toc}</nav>
  ${S.map(([k,t,h],i)=>{const on=P.includes(k);return `<details class="sec" id="a-${k}" ${on?"open":""}><summary><span class="num">${i+1}</span><span class="st">${t}</span>
    <button class="pinbtn ${on?"on":""}" data-act="aidePin" data-id="${k}" aria-pressed="${on}" aria-label="${on?"Désépingler":"Épingler"} la partie ${i+1}" title="${on?"Désépingler":"Épingler pour garder ouvert"}">🧷</button><span class="chev" aria-hidden="true">›</span></summary>
    <div class="body" id="ab-${k}"><div class="bar noread" style="margin:4px 0 8px">${spkBtn("ab-"+k)}</div>${h}<div class="bar noread" style="margin:14px 0 0"><button class="btn ghost" data-act="aideTop">↑ Retour au sommaire</button></div></div></details>`;}).join("")}`;
}

/* ---------- paramètres ---------- */
function stampText(x){if(!x)return "Aucune pour l’instant.";return fmt(x.date)+(x.time?" à "+hText(x.time):"")+(x.file?"<br><span class=\"meta\">Fichier : "+esc(x.file)+"</span>":"");}
const LC={cats:["Nouvelle catégorie","Ajouter une catégorie"],tools:["Nouvel outil","Ajouter un outil"],domains:["Nouveau domaine","Ajouter un domaine"]};
function listChips(kind){const lab=LC[kind]||["Nouveau","Ajouter"];return `<div class="chips wrap">${state.lists[kind].map((x,i)=>`<span class="chip tag">${i?`<button data-act="listMove" data-id="${kind}|${i}" aria-label="Avancer ${esc(x)} d’une place">‹</button>`:""}${esc(x)}<button data-act="delListItem" data-id="${kind}|${i}" aria-label="Retirer ${esc(x)}">✕</button></span>`).join("")}</div>
  <div class="inline"><input id="add_${kind}" placeholder="${lab[0]}" aria-label="${lab[1]}"><button class="btn ghost" data-act="addListItem" data-id="${kind}">Ajouter</button></div>`;}
function vParams(){return withToc(vParams0(),"params");}
function vParams0(){
  const s=state.settings;
  return `<h2>⚙️ Paramètres</h2><p class="lead">Les réglages et la sauvegarde du carnet.</p>
  <section class="block"><h3>Version</h3>
  <p><b>Carnet Pilote ${VERSION}</b>, du ${VERSION_DATE}</p>
  <p class="meta">Nom du fichier : ${FILE_NAME}</p>
  <p class="meta">Aujourd’hui : ${longDate()}</p></section>
  <section class="block" id="pClean"><h3>🧹 Nettoyer le carnet</h3><p class="meta">Retrouve partout ce que tu as marqué « à effacer » (par exemple « test à effacer »), pour l’effacer d’un coup.</p>
  <div class="bar"><button class="btn" data-act="cleanOpen">Chercher les éléments « à effacer »</button>${cleanBakGet()?`<button class="btn ghost" data-act="cleanUndoBtn">↩️ Annuler le dernier nettoyage</button>`:""}${(state.cleanKeep||[]).length?`<button class="btn ghost spk" data-act="cleanKeepReset">Reproposer ceux gardés (${state.cleanKeep.length})</button>`:""}</div></section>
  <section class="block" id="pCouple"><h3>💞 Rappel du bilan du couple</h3><p class="meta">Le jour choisi, un rappel s’affiche à l’ouverture du carnet et dans l’Accueil. Ton fichier n’étant pas en ligne, ouvre-le ensuite dans Chrome.</p>${coupleSel()}</section>
  ${syncSec()}
  <section class="block"><h3>Sauvegarde et restauration</h3>
  <p><b>Dernière sauvegarde :</b> ${stampText(state.lastExport)}</p>

/* ---------- fenêtre (modale) ---------- */
let modalKind="";
/* V24 : une fenêtre automatique (pause, fin de pause…) se pose PAR-DESSUS une fiche en cours, sans l’effacer */
let modalStash=null;
function stashForm(){const m=$("#modal");if(modalStash||modalKind!=="form"||!m.classList.contains("open"))return;
  if(rec){try{rec.stop();}catch(e){}}
  const sh=$("#sheet"),frag=document.createDocumentFragment();const sc=sh.scrollTop;draftSaveNow();
  while(sh.firstChild)frag.appendChild(sh.firstChild);
  modalStash={frag,kind:modalKind,dirty:modalDirty,scroll:sc,idea:pendingIdea};}
function unstashForm(){const S=modalStash;if(!S)return false;modalStash=null;
  const sh=$("#sheet");sh.innerHTML="";sh.appendChild(S.frag);modalKind=S.kind;modalDirty=S.dirty;pendingIdea=S.idea;
  const m=$("#modal");m.classList.add("open");m.classList.remove("mid");m.setAttribute("aria-hidden","false");
  sh.scrollTop=S.scroll;hsArrows(sh);recenter();testBackSync();return true;}
function openOver(html,kind){stashForm();openModal(html,kind);}
/* V24 : brouillon de la fiche en cours, gardé au fur et à mesure (si le carnet se ferme avant « Enregistrer ») */
const DRAFT_KEY="carnetPilote_ficheEnCours";let draftT=0;
function draftSaveNow(){clearTimeout(draftT);if(modalKind!=="form"||!modalDirty)return;const sh=$("#sheet");if(!sh||!sh.firstChild)return;
  const vals={};sh.querySelectorAll("input,textarea,select").forEach(el=>{if(!el.id||el.type==="file"||el.type==="password")return;vals[el.id]=(el.type==="checkbox"||el.type==="radio")?{c:el.checked}:{v:el.value};});
  const h=sh.querySelector("h2");try{localStorage.setItem(DRAFT_KEY,JSON.stringify({t:Date.now(),html:sh.innerHTML,vals,title:h?h.textContent:"Ma fiche"}));}catch(e){}}
function draftSave(){clearTimeout(draftT);draftT=setTimeout(draftSaveNow,700);}
function draftClear(){clearTimeout(draftT);try{localStorage.removeItem(DRAFT_KEY);}catch(e){}}
function draftGet(){try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");if(d&&d.html&&Date.now()-d.t<7*86400000)return d;}catch(e){}return null;}
function draftRestore(){const d=draftGet();if(!d)return;openModal(d.html,"form");const sh=$("#sheet");
  Object.keys(d.vals||{}).forEach(id=>{let el=null;try{el=sh.querySelector("#"+CSS.escape(id));}catch(e){}if(!el)return;const x=d.vals[id];if("c" in x)el.checked=x.c;else el.value=x.v;});
  sh.querySelectorAll("select[data-kind]").forEach(x=>{const o=document.getElementById(x.id+"O");if(o)o.hidden=x.value!=="__autre";});
  sh.querySelectorAll(".chips input[value='__autre']").forEach(x=>{const b=x.closest(".chips"),o=b&&b.id&&document.getElementById(b.id+"O");if(o)o.hidden=!x.checked;});
  sh.querySelectorAll("textarea.grow-ta").forEach(autoGrow);modalDirty=true;toast("Ta fiche est revenue, telle que tu l’avais laissée",3500);}
function draftOffer(){const d=draftGet();if(!d)return false;
  ask(`📝 Une fiche n’était pas terminée : « ${esc(d.title)} ». La reprendre ?`,[["Reprendre",()=>draftRestore(),true],["Non, l’effacer",()=>draftClear()]],30000);return true;}
function openModal(html,kind){$("#sheet").innerHTML=html;modalKind=kind||"";const m=$("#modal");m.classList.add("open");m.setAttribute("aria-hidden","false");
  m.classList.toggle("mid",["chrono","pomo","start","pause","news"].includes(modalKind));
  modalDirty=false;$("#sheet").scrollTop=0;hsArrows($("#sheet"));recenter();testBackSync();document.body.classList.add("modal-open");}
let modalDirty=false;
function tryClose(){
  if(modalDirty&&modalKind==="form"&&$("#modal").classList.contains("open")){
    if(!$("#leaveWarn")){const a=$("#sheet .actions");if(!a){closeModal();return;}
      const w=document.createElement("div");w.className="warn";w.id="leaveWarn";
      w.innerHTML=`Tu as fait des changements. Les enregistrer ?<div class="bar" style="margin:8px 0 0"><button class="btn" data-act="leaveSave">Enregistrer</button><button class="btn ghost" data-act="leaveDiscard">Quitter sans enregistrer</button></div>`;
      a.before(w);}
    $("#leaveWarn").scrollIntoView({block:"nearest"});return;}
  closeModal();
}
function closeModal(){if(modalKind==="form")draftClear();if(unstashForm())return;document.body.classList.remove("modal-open");const m=$("#modal");m.classList.remove("open");m.setAttribute("aria-hidden","true");modalKind="";pendingIdea=null;testBackSync();}
/* V22 : bouton « Retour au test », visible dans tous les onglets pendant un test */
function testBackSync(){const b=document.getElementById("testBack");if(!b||!state)return;const T=(state.tests||{})[VERSION];
  const on=!!(TESTS[VERSION]&&T&&T.back&&testLeft()>0&&!(modalKind==="test"&&$("#modal").classList.contains("open")));b.hidden=!on;
  if(on){const n=(T.i||0)+1;b.querySelector(".tb-go").textContent="🧪 Retour au test (étape "+n+")";}}

function dueReminders(){
  const st=state.settings,sn=state.snooze||{},t=today(),r=[],le=state.lastExport,lk=state.lastSkills;
  if(daysSince(le&&le.date)>=st.remSave&&sn.save!==t)r.push({k:"save",t:"Faire une sauvegarde",sub:le?"Dernière : "+fmt(le.date):"Aucune sauvegarde pour l’instant",btn:"Sauvegarder maintenant"});
  if(daysSince(lk&&lk.date)>=st.remSkills&&sn.skills!==t)r.push({k:"skills",t:"Faire le point compétences",sub:lk?"Dernier point : "+fmt(lk.date):"Pas encore fait",btn:"Ouvrir Mes compétences"});
  return r;
}

function recordWork(c,start,end){
  const sec=Math.round((end-start-(c.gap||0))/1000);if(sec<60)return 0;const min=Math.round(sec/60);
  const s=new Date(start),e=new Date(end);
  addToList("tools",c.tool);splitCats(c.cat).forEach(x=>addToList("cats",x));
  state.work.push({id:uid(),date:isoOf(s),tool:c.tool||"",cat:c.cat||"",details:c.details||"",start:hm(s),end:hm(e),min,sec});
  sortWork(state);return sec;
}
const chronoMs=()=>Date.now()-state.chrono.start-(state.chrono.gap||0);
function startVisit(){const n=Date.now();state.chrono={running:true,start:n,lastSeen:n,gap:0,tool:"Carnet Pilote",cat:"Visite",details:""};save();}
let merged=false;
/* V27 : le chronomètre s’arrête de compter après 30 minutes sans toucher le carnet (ex. ordinateur resté allumé pendant que tu travailles sur le téléphone) */
const IDLE_MS=30*60000;let chronoAct=Date.now();
function onAct(){const now=Date.now(),was=chronoAct;chronoAct=now;const c=state.chrono;
  if(c&&c.running&&c.start&&now-was>IDLE_MS&&c.lastSeen&&now-c.lastSeen>IDLE_MS){recordWork(c,c.start,c.lastSeen);startVisit();render();toast("Bon retour ! Le chronomètre s’était arrêté pendant ton absence. Nouvelle visite lancée.");}}
["pointerdown","keydown","wheel","touchstart"].forEach(ev=>window.addEventListener(ev,onAct,{passive:true,capture:true}));
function bootChrono(){
  const c=state.chrono,now=Date.now(),g=(state.settings.mergeGap||0)*60000;
  if(c.running&&c.start&&c.lastSeen&&g>0&&now-c.lastSeen>=0&&now-c.lastSeen<=g){c.gap=(c.gap||0)+(now-c.lastSeen);c.lastSeen=now;merged=true;save();return;}
  if(c.running&&c.start){const end=c.lastSeen&&c.lastSeen>c.start?c.lastSeen:c.start;recordWork(c,c.start,end);}
  startVisit();
}

function ensureAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(e){}}
function beep(){
  try{ensureAudio();if(!actx)return;[0,0.35,0.7].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=660;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(0.25,actx.currentTime+t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+t+0.28);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+0.3);});}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([300,150,300]);}catch(e){}
}

function startWork(cycle){

function startPause(alert){

const FABS={fabChrono:chronoModal,fabPomo:pomoModal,fabPin:pinModal,fabNote:()=>quickNote()};
function placeFab(el,x,y){
  const w=el.offsetWidth||56,h=el.offsetHeight||56;
  const vw=document.documentElement.clientWidth||innerWidth;
  x=Math.max(4,Math.min(vw-w-14,x));y=Math.max(12,Math.min(innerHeight-h-4,y));
  el.style.left=x+"px";el.style.top=y+"px";el.style.right="auto";el.style.bottom="auto";
}
function restoreFabs(){
  Object.keys(FABS).forEach(k=>{const el=document.getElementById(k);const p=state.fabPos[k];
    if(p)placeFab(el,p.x,p.y);else{el.style.left="";el.style.top="";el.style.right="";el.style.bottom="";}});
}
function setupFab(el){
  let sx=0,sy=0,ox=0,oy=0,down=false,moved=false;
  el.addEventListener("pointerdown",e=>{down=true;moved=false;sx=e.clientX;sy=e.clientY;const r=el.getBoundingClientRect();ox=r.left;oy=r.top;try{el.setPointerCapture(e.pointerId);}catch(_){}});
  el.addEventListener("pointermove",e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&Math.hypot(dx,dy)<8)return;moved=true;placeFab(el,ox+dx,oy+dy);});
  const end=()=>{if(!down)return;down=false;if(moved){const r=el.getBoundingClientRect();state.fabPos[el.id]={x:r.left,y:r.top};save();justDragged=true;setTimeout(()=>justDragged=false,350);}};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  el.addEventListener("click",()=>{if(justDragged){justDragged=false;return;}FABS[el.id]();});
}
function setBadge(el,txt){const b=el.querySelector(".b");if(txt){b.textContent=txt;b.hidden=false;}else b.hidden=true;}
function updateFabs(){

  const soft=n?0:dueReminders().length;pin.classList.toggle("alert",n>0);pin.classList.toggle("soft",!n&&soft>0);pin.classList.toggle("calm",!n&&!soft);setBadge(pin,n?String(n):soft?"🌿":"");

}
function tick(){
  const p=state.pomo,now=Date.now();
  if(state.chrono.running&&now-chronoAct<=IDLE_MS){state.chrono.lastSeen=now;if(++tickCount%10===0){tickSave=true;save();tickSave=false;}}
  if(p.phase==="work"&&now>=p.end)startPause(true);
  else if(p.phase==="pause"&&now>=p.end)endPause();
  const cd=$("#chronoDisp");if(cd&&state.chrono.running)cd.textContent=hms(chronoMs());
  const pd=$("#pomoDisp");if(pd&&state.pomo.phase!=="off")pd.textContent=hms(state.pomo.end-now);
  updateFabs();
  if(tickCount%15===0)pomoNudgeCheck();
}

function copyText(txt,sel,msg){
  let t=sel?$(sel):null,tmp=false;
  const fail=()=>toast("Copie bloquée par le téléphone : appuie longuement sur le texte, puis « Tout sélectionner » et « Copier »",6000);
  const fb=()=>{
    if(!t){t=document.createElement("textarea");t.value=txt;t.setAttribute("readonly","");t.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";document.body.appendChild(t);tmp=true;}
    t.focus();t.select();try{t.setSelectionRange(0,t.value.length);}catch(e){}
    let ok=false;try{ok=document.execCommand("copy");}catch(e){}
    if(tmp)t.remove();
    if(ok)toast(msg);else fail();};
  if(window.isSecureContext&&navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast(msg),fb);else fb();}

  tagPaste:()=>{const raw=($("#tagIn")||{}).value||"";let n=0;
