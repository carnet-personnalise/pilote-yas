<style>
/* ---------- couleurs de base ---------- */
:root{
  --bg:#E6F0EE;--head:#CFE5E2;--surface:#FFFFFF;--ink:#1D2A31;--muted:#536570;--line:#CADAD8;
  --accent:#0F7C79;--accent-soft:#CDE8E5;--on-accent:#FFFFFF;
  --sun:#D98E04;--sun-soft:#FBEFD6;--green:#2F8A55;--orange:#D9822B;--red:#C8433C;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1D1D;--head:#163130;--surface:#172726;--ink:#E6EEF0;--muted:#9DB1B2;--line:#2A3F3E;
    --accent:#4DB8B3;--accent-soft:#163B3A;--on-accent:#0F1A1C;
    --sun:#EBA73A;--sun-soft:#3A311B;--green:#5BBF85;--orange:#E8A160;--red:#E46A62;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1D1D;--head:#163130;--surface:#172726;--ink:#E6EEF0;--muted:#9DB1B2;--line:#2A3F3E;
  --accent:#4DB8B3;--accent-soft:#163B3A;--on-accent:#0F1A1C;
  --sun:#EBA73A;--sun-soft:#3A311B;--green:#5BBF85;--orange:#E8A160;--red:#E46A62;color-scheme:dark;
}
/* ---------- ambiance selon la phase (clair) ---------- */
:root[data-phase="haute"]{--bg:#E7ECF6;--head:#D2DBF0;--line:#CBD4E8;--accent:#3E5C9A;--accent-soft:#DAE2F4}
:root[data-phase="basse"]{--bg:#F7EBDD;--head:#F0D8BC;--line:#E6D2BC;--accent:#A55A2A;--accent-soft:#F5DFCA}
/* ---------- ambiance selon la phase (sombre) ---------- */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"])[data-phase="neutre"]{--bg:#0F1D1D;--head:#163130;--surface:#172726;--line:#2A3F3E;--accent:#4DB8B3;--accent-soft:#163B3A}
  :root:not([data-theme="light"])[data-phase="haute"]{--bg:#121827;--head:#1C2640;--surface:#182033;--line:#2A3552;--accent:#8EA8E6;--accent-soft:#1F2B4A}
  :root:not([data-theme="light"])[data-phase="basse"]{--bg:#20160E;--head:#33231A;--surface:#271C14;--line:#43301F;--accent:#E39A63;--accent-soft:#3B2718}
}
:root[data-theme="dark"][data-phase="neutre"]{--bg:#0F1D1D;--head:#163130;--surface:#172726;--line:#2A3F3E;--accent:#4DB8B3;--accent-soft:#163B3A}
:root[data-theme="dark"][data-phase="haute"]{--bg:#121827;--head:#1C2640;--surface:#182033;--line:#2A3552;--accent:#8EA8E6;--accent-soft:#1F2B4A}
:root[data-theme="dark"][data-phase="basse"]{--bg:#20160E;--head:#33231A;--surface:#271C14;--line:#43301F;--accent:#E39A63;--accent-soft:#3B2718}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 170px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5;transition:background-color .5s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);border-bottom:1px solid var(--line);padding:10px 16px 0;transition:background-color .5s}
.top{display:flex;align-items:center;gap:12px;max-width:860px;margin:0 auto}
.logo{width:44px;height:44px;border-radius:12px;background:#FFFFFF;padding:3px;flex:0 0 auto;border:1px solid var(--line)}
.logo img{width:100%;height:100%;display:block}
h1{font-size:1.4rem;margin:0;line-height:1.15;letter-spacing:-.01em}
.today{color:var(--muted);font-size:.9rem;display:block}
.searchwrap{position:relative;max-width:860px;margin:10px auto 0}
#q{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit}
#results{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:55vh;overflow:auto;z-index:40;box-shadow:0 10px 28px rgba(0,0,0,.18)}
.res{display:block;width:100%;text-align:left;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;cursor:pointer;margin:0}
.res small{display:block;color:var(--muted)}
.tabbar{display:flex;align-items:center;gap:2px;max-width:860px;margin:8px auto 0}
.arrow{flex:0 0 auto;border:0;background:none;color:var(--muted);font-size:1.4rem;line-height:1;padding:6px 8px;cursor:pointer}
#tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;scroll-behavior:smooth}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;padding:10px 12px;font:inherit;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
main{max-width:860px;margin:0 auto;padding:18px 16px 230px}
h2{font-size:1.3rem;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 16px}
.hello{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.hello .logo{width:64px;height:64px;border-radius:16px}
.hello h2{font-size:1.5rem;margin:0}
.hello p{margin:2px 0 0;color:var(--muted)}
.block{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:16px;margin-bottom:14px}
.block h3{font-size:1.06rem;margin:0 0 8px;color:var(--accent)}
.block p{margin:6px 0}
.mode{display:flex;gap:8px;margin-bottom:12px}
.mode button{flex:1;padding:11px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.mode button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.modebox{border-left:6px solid var(--accent);background:var(--accent-soft);border-radius:0 14px 14px 0;padding:14px 16px;margin-bottom:14px}
.modebox.haute{border-left-color:var(--sun)}
.modebox p{margin:8px 0}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.icon{border:0;background:none;padding:6px;font-size:1.05rem;cursor:pointer;color:var(--muted);min-width:38px;min-height:38px;border-radius:8px;flex:0 0 auto}
.icon:disabled{opacity:.3;cursor:default}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=checkbox]{width:22px;height:22px;flex:0 0 auto;margin:4px 0 0;accent-color:var(--accent)}
input[hidden]{display:none}
label{display:block;font-size:.92rem;color:var(--muted);margin:12px 0 4px}
.hint{font-size:.85rem;color:var(--muted);margin:2px 0 6px}
.inline{display:flex;gap:8px}
.inline > *{flex:1;min-width:0}
.inline > .btn{flex:0 0 auto}
.linkrow{display:grid;grid-template-columns:1fr 110px;gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.linkrow input[type=url]{grid-column:1 / -1}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.dot{width:18px;height:18px;border-radius:50%;border:0;flex:0 0 auto;margin-top:6px;cursor:pointer;padding:0}
.dot.vert{background:var(--green)}.dot.orange{background:var(--orange)}.dot.rouge{background:var(--red)}
.done .ttl{text-decoration:line-through;color:var(--muted)}
.meta{font-size:.9rem;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.93rem;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.tag{cursor:default;display:inline-flex;align-items:center;gap:4px;padding:4px 4px 4px 12px}
.chip.tag button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:2px 6px}
.badge{display:inline-block;font-size:.8rem;font-weight:400;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:middle}
.badge.goal{background:var(--sun-soft);color:var(--ink)}
.warn{background:var(--sun-soft);border-radius:10px;padding:10px 12px;margin:10px 0}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.phead h3{margin:0}
.tools{display:flex;flex-wrap:wrap;justify-content:flex-end}
details summary{cursor:pointer;color:var(--muted);padding:8px 0}
.tablewrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.93rem;min-width:560px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:400}
td.nowrap{white-space:nowrap}
ol.steps{padding-left:0;list-style:none;counter-reset:s;margin:0}
ol.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s);flex:0 0 28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center}
.pic{font-size:1.3rem;flex:0 0 auto}
.num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:700}
.tocbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 0;font:inherit;color:var(--ink);cursor:pointer}
.tocbtn:last-child{border-bottom:0}
details.sec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;margin-bottom:12px}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;cursor:pointer;color:var(--ink);font-weight:700}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .st{flex:1}
details.sec>summary .chev{color:var(--muted);transition:transform .2s}
details.sec[open]>summary .chev{transform:rotate(90deg)}
.pinbtn{border:1px dashed var(--line);background:none;font-size:1.15rem;cursor:pointer;opacity:.35;min-width:42px;min-height:42px;border-radius:10px;filter:grayscale(1)}
.pinbtn.on{opacity:1;filter:none;background:var(--sun-soft);border:2px solid var(--accent)}
.tocbtn.pinned{background:var(--accent-soft);border-radius:8px;padding-left:8px;font-weight:700;border-bottom-color:transparent;margin:2px 0}
details.sec>.body{padding:0 16px 16px}
details.sec>.body p{margin:6px 0}
.dots{letter-spacing:.35em;color:var(--accent);font-size:1.3rem;margin:4px 0}
.fab{position:fixed;right:16px;width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.2);font-size:1.45rem;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;z-index:50;color:var(--ink);user-select:none;-webkit-user-select:none;padding:0}
#fabPin{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#fabPomo{bottom:calc(82px + env(safe-area-inset-bottom,0px))}
#fabChrono{bottom:calc(148px + env(safe-area-inset-bottom,0px))}
.fab .b{position:absolute;top:-8px;right:-12px;background:var(--accent);color:var(--on-accent);font-size:.72rem;border-radius:999px;padding:2px 6px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums;white-space:nowrap}
#fabPin.calm{opacity:.4}
#fabPin.soft .b{background:var(--accent-soft);color:var(--ink)}
#fabPin.alert{background:var(--red);border-color:var(--red)}
#fabPin.alert .b{background:var(--ink);color:var(--bg)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:100}
#modal.open{display:flex}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){#modal{align-items:center}.sheet{border-radius:18px}}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.big{font-size:2.8rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:12px 0}
.center{text-align:center}
.em{font-size:3.4rem;text-align:center;display:block;line-height:1.2}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:120;opacity:0;pointer-events:none;transition:opacity .2s;max-width:80vw;text-align:center}
#toast.show{opacity:1}
.flash{animation:flash 1.8s}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--sun)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:3px solid var(--sun)}#tabs{scroll-behavior:auto}#toast,body,header{transition:none}}
/* ---------- V14 : santé, pense-bête, natures ---------- */
.gcross{color:#1E9E4A;font-weight:700;margin-right:4px}
.chip.check{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:.93rem;color:var(--ink)}
.chip.check input{margin:0;width:18px;height:18px}
.chip.check:has(input:checked){background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.lvl{display:inline-block;min-width:2.2em;text-align:center;border-radius:999px;padding:1px 8px;font-weight:700;font-size:.85rem}
.lvl.l0{background:var(--accent-soft);color:var(--ink)}.lvl.l1{background:var(--sun-soft);color:var(--ink)}.lvl.l2{background:var(--orange);color:#fff}.lvl.l3{background:var(--red);color:#fff}
.range{display:flex;align-items:center;gap:12px}.range input{flex:1;padding:0;accent-color:var(--accent)}.range output{font-weight:700;font-size:1.3rem;min-width:3.2em;text-align:right}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.seg button{flex:1;min-width:80px;padding:9px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
#note{position:fixed;left:14px;right:92px;max-width:360px;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:rotate(-1.2deg);background:#FFF6BF;color:#3A3420;border-radius:4px 4px 14px 4px;padding:16px 16px 12px;box-shadow:0 10px 24px rgba(0,0,0,.22),0 2px 4px rgba(0,0,0,.12);z-index:90;display:none}
#note.show{display:block;animation:noteIn .35s ease-out}
#note h3{margin:0 0 6px;font-size:1rem}#note p{margin:6px 0;font-size:.95rem}
#note .x{position:absolute;top:4px;right:6px;border:0;background:none;font-size:1.2rem;color:#6B6040;cursor:pointer;padding:4px 8px}
#note .bar{margin:10px 0 0;gap:6px}#note .btn{padding:7px 12px;font-size:.88rem}
#note .btn.ghost{background:transparent;color:#3A3420;border-color:#C9B970}
@keyframes noteIn{from{opacity:0;transform:translateY(16px) rotate(-1.2deg)}to{opacity:1;transform:rotate(-1.2deg)}}
@media (prefers-reduced-motion:reduce){#note.show{animation:none}}
html.locked #note{visibility:hidden}
.histv{border-left:4px solid var(--accent);padding:2px 0 2px 12px;margin:12px 0}
.histv ul{margin:6px 0 0;padding-left:20px}.histv li{margin:4px 0}
/* ---------- écran du mot de passe ---------- */
html.locked header,html.locked main,html.locked .fab{visibility:hidden}
#lock{display:none}
html.locked #lock{display:flex;position:fixed;inset:0;z-index:200;background:var(--bg);align-items:center;justify-content:center;padding:16px}
#lock .card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 20px;text-align:center}
#lock .logo{width:72px;height:72px;border-radius:18px;margin:0 auto 10px}
#lock h1{margin:0 0 4px;color:var(--accent)}
#lock form{text-align:left;margin-top:16px}
#lock .btn{width:100%;margin-top:12px}
#lockMsg{color:var(--red);font-weight:700;min-height:1.5em;margin:10px 0 0;text-align:center}
#lockHint{margin:10px 0 0;text-align:center}
#lockNowBtn{margin-left:auto;padding:6px 10px;font-size:.88rem;flex:0 0 auto}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,"0");
const isoOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hm=d=>pad(d.getHours())+":"+pad(d.getMinutes());
const today=()=>isoOf(new Date());
function fmt(iso){if(!iso)return "";const [y,m,d]=iso.split("-");return d+"/"+m+"/"+y;}
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";
function fmtDur(min){min=Math.max(0,Math.round(min||0));const h=Math.floor(min/60),m=min%60;return h?(h+" h "+pad(m)):(m+" min");}
function daysSince(iso){if(!iso)return 999;return Math.floor((new Date(today())-new Date(iso))/86400000);}
function hms(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000);const h=Math.floor(s/3600);const m=Math.floor(s%3600/60);const ss=s%60;return (h?h+":"+pad(m):pad(m))+":"+pad(ss);}
function minutesBetween(s,e){if(!s||!e)return 0;const [a,b]=s.split(":").map(Number),[c,d]=e.split(":").map(Number);let x=(c*60+d)-(a*60+b);if(x<0)x+=1440;return x;}
const hText=t=>t?t.replace(":","h"):"";
const pick=a=>a[Math.floor(Math.random()*a.length)];
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():"";};

  };

function fixState(s){
  s=Object.assign(defaults(),s||{});
  s.settings=Object.assign(defaults().settings,s.settings||{});
  const keys=Object.keys(TABS);let o=(s.settings.tabOrder||[]).filter(k=>keys.includes(k));
  if(!o.includes("loisirs")){const i=o.indexOf("projets");o.splice(i<0?1:i+1,0,"loisirs");}
  if(!o.includes("sante")){const i=o.indexOf("taches");o.splice(i<0?o.length:i,0,"sante");}
  if(!o.includes("competences")){const i=o.indexOf("journal");o.splice(i<0?o.length:i+1,0,"competences");}
  keys.forEach(k=>{if(!o.includes(k))o.push(k);});
  s.settings.tabOrder=o;
  ["projects","tasks","files","journal","work","urgent","ideas","skills","targets"].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];});
  if(!Array.isArray(s.aidePins))s.aidePins=["routine","maj"];s.snooze=s.snooze||{};
  s.lists=Object.assign({cats:DEF_CATS.slice(),tools:DEF_TOOLS.slice()},s.lists||{});
  Object.keys(DEF_SANTE).forEach(k=>{if(!Array.isArray(s.lists[k]))s.lists[k]=DEF_SANTE[k].slice();});
  if(!s.lists.cats.includes("Alimentation du carnet")){const i=s.lists.cats.indexOf("Amélioration du carnet");s.lists.cats.splice(i<0?s.lists.cats.length:i+1,0,"Alimentation du carnet");}
  s.sante=Object.assign({suivi:[],ess:[]},s.sante||{});["suivi","ess"].forEach(k=>{if(!Array.isArray(s.sante[k]))s.sante[k]=[];});
  if(!s.lists.cats.includes("Création du carnet")){const i=s.lists.cats.indexOf("Amélioration du carnet");s.lists.cats.splice(i<0?s.lists.cats.length:i,0,"Création du carnet");}
  s.projects.forEach(p=>{
    if(!p.space||p.space==="principal")p.space=/candidat|emploi|cifelm|kay|tuto|atelier|duoday|formation|mission/.test(norm(p.name))?"pro":"perso";
    p.kind=p.kind||"projet";p.star=!!p.star;if(p.status==="termine")p.star=false;p.bilan=p.bilan||"";p.otherFiles=p.otherFiles||"";
    if(!Array.isArray(p.links)){p.links=p.drive?[{name:"",url:p.drive,type:"dossier"}]:[];}
    delete p.drive;
  });
  s.files.forEach(f=>{f.type=f.type||"fichier";});
  s.ideas.forEach(i=>{i.later=!!i.later;});
  s.work.forEach(w=>{if(w.cat===undefined){w.cat=w.nature||"";delete w.nature;}w.tool=w.tool||"";w.details=w.details||"";});
  if(!s.seeded){SEED_WORK.forEach(sw=>{if(!s.work.some(w=>w.id===sw.id))s.work.push(Object.assign({min:minutesBetween(sw.start,sw.end)},sw));});s.seeded=true;}
  if(typeof s.lastExport==="string")s.lastExport=s.lastExport?{date:s.lastExport,time:"",file:""}:null;
  if(s.name==="Yasmine")s.name="Yas";
  s.fabPos=s.fabPos||{};
  s.chrono=Object.assign({running:false,start:0,lastSeen:0,gap:0,tool:"",cat:"",details:""},s.chrono||{});
  if(s.chrono.nature!==undefined){s.chrono.cat=s.chrono.cat||s.chrono.nature;delete s.chrono.nature;}
  s.pomo=Object.assign({phase:"off",end:0,emoji:"",cycle:0,skips:0,next:1,long:false},s.pomo||{});
  sortWork(s);
  return s;
}
function sortWork(s){s.work.sort((a,b)=>(b.date+(b.start||"")).localeCompare(a.date+(a.start||"")));}

function addToList(kind,v){v=(v||"").trim();if(v&&!state.lists[kind].some(x=>norm(x)===norm(v)))state.lists[kind].push(v);}
function selField(id,label,kind,value){
  const list=state.lists[kind];const extra=value&&!list.includes(value);
  return `<label for="${id}">${label}</label><select id="${id}" data-kind="${kind}">
    ${value?"":`<option value="">Choisir…</option>`}
    ${list.map(x=>`<option ${x===value?"selected":""}>${esc(x)}</option>`).join("")}
    ${extra?`<option selected>${esc(value)}</option>`:""}
    <option value="__autre">➕ Autre…</option></select>
    <input id="${id}O" placeholder="Écris le nouveau nom" aria-label="${label} : autre" hidden>`;
}
const splitCats=v=>String(v||"").split(" + ").map(x=>x.trim()).filter(Boolean);
function catChecks(id,value){
  const sel=splitCats(value),list=state.lists.cats.slice();sel.forEach(x=>{if(!list.includes(x))list.push(x);});
  return `<label>Nature du travail <span class="hint">(tu peux en cocher plusieurs)</span></label>
    <div class="chips wrap" id="${id}" role="group" aria-label="Nature du travail">${list.map(x=>`<label class="chip check"><input type="checkbox" value="${esc(x)}" ${sel.includes(x)?"checked":""}>${esc(x)}</label>`).join("")}
    <label class="chip check"><input type="checkbox" value="__autre" data-other="${id}O">➕ Autre…</label></div>
    <input id="${id}O" placeholder="Écris la nouvelle nature" aria-label="Nature du travail : autre" hidden>`;
}
function catVal(id,addIt){
  const box=document.getElementById(id);if(!box)return "";const out=[];
  box.querySelectorAll("input:checked").forEach(c=>{
    if(c.value==="__autre"){const v=val(id+"O");if(v){if(addIt)addToList("cats",v);if(!out.includes(v))out.push(v);}}
    else out.push(c.value);});
  return out.join(" + ");
}
function selVal(id,addIt){
  const s=document.getElementById(id);if(!s)return "";
  if(s.value!=="__autre")return s.value;
  const v=val(id+"O");if(addIt&&v)addToList(s.dataset.kind,v);return v;
}

    <button class="icon" data-act="ideaLater" data-id="${i.id}" title="Plus tard" aria-label="Ranger dans Plus tard">⏳</button>`}
    <button class="icon" data-act="delIdea" data-id="${i.id}" title="Abandonner l’idée" aria-label="Abandonner l’idée">✕</button></div>`;

function vAccueil(){

  const lact=loisirs().filter(p=>p.status==="actif");

  const open=state.tasks.filter(t=>!t.done);
  const dated=open.filter(t=>t.date).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||""))).slice(0,5);

  }else if(m==="basse"){

    const totW=state.work.reduce((s,w)=>s+(w.min||0),0);

    ${state.journal.slice(0,2).map(j=>`<p class="meta">${fmt(j.date)} : ${esc(j.text.slice(0,140))}${j.text.length>140?"…":""}</p>`).join("")}
    ${whys.map(p=>`<p><b>${esc(p.name)} compte parce que :</b> ${esc(p.why)}</p>`).join("")}
    <p><b>Une seule micro-action (10 min max) :</b> ${micro?esc(micro.title):"écrire une phrase dans ton journal."}</p>

function similarProject(name,exceptId){
  const n=norm(name).trim();
  const words=n.split(/[^a-z0-9]+/).filter(w=>w.length>3&&!STOP.has(w));
  return state.projects.find(p=>p.id!==exceptId&&(norm(p.name).trim()===n||words.some(w=>norm(p.name).includes(w))));
}
function moveProj(id,dir){
  const arr=state.projects;const i=arr.findIndex(p=>p.id===id);if(i<0)return;
  const st=arr[i].status,sp=arr[i].space;let j=i+dir;
  while(j>=0&&j<arr.length&&(arr[j].status!==st||arr[j].space!==sp))j+=dir;
  if(j<0||j>=arr.length)return;
  [arr[i],arr[j]]=[arr[j],arr[i]];save();render();flash("p-"+id);
}

function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/[,;]/g,m=>"\\"+m).replace(/\n/g,"\\n");}
function icsLocal(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00";}
function downloadFile(name,content,type){
  const blob=new Blob([content],{type});const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function makeIcs(t,atTime){
  const stamp=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Carnet Pilote//FR","BEGIN:VEVENT","UID:"+t.id+"@carnet-pilote","DTSTAMP:"+stamp];
  if(t.time){const s=new Date(t.date+"T"+t.time+":00");const e=new Date(s.getTime()+(atTime?900000:3600000));L.push("DTSTART:"+icsLocal(s),"DTEND:"+icsLocal(e));}
  else{const s=new Date(t.date+"T12:00:00");const e=new Date(s.getTime()+86400000);L.push("DTSTART;VALUE=DATE:"+t.date.replace(/-/g,""),"DTEND;VALUE=DATE:"+icsLocal(e).slice(0,8));}
  L.push("SUMMARY:"+icsEsc(t.title),"DESCRIPTION:"+icsEsc([t.domain,t.note].filter(Boolean).join(" : ")));
  const alarm=tr=>L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(t.title),"TRIGGER:"+tr,"END:VALARM");
  if(atTime)alarm("PT0M");else{alarm("-P1D");if(t.time)alarm("-PT1H");}
  L.push("END:VEVENT","END:VCALENDAR");
  return L.join("\r\n");
}

const SKILL_PROMPT="Voici ce que j’ai fait récemment, extrait de mon Carnet Pilote. Traduis-le en compétences utiles pour un CV ou un recrutement (savoir-faire, savoir-être, compétences numériques). Réponds avec une compétence par ligne, sous la forme « Compétence : exemple concret qui la prouve [technique] » ou « … [transversale] ». [technique] = savoir-faire, outil, compétence numérique ou de métier ; [transversale] = savoir-être, organisation, utile dans tous les métiers. Reste simple et concis, sans titre ni introduction.";
function skillsSource(){
  const since=state.lastSkills&&state.lastSkills.date||"";
  const ok=d=>!since||(d||"")>=since;
  const L=[SKILL_PROMPT,"",since?"Période : depuis le "+fmt(since)+".":"Période : depuis le début du carnet."];
  const j=state.journal.filter(x=>ok(x.date));
  if(j.length){L.push("","JOURNAL DE BORD :");j.forEach(x=>L.push("- "+fmt(x.date)+" : "+x.text.replace(/\n/g," ")));}
  const w=state.work.filter(x=>ok(x.date)&&x.cat!=="Visite");
  if(w.length){L.push("","DURÉE DE TRAVAIL :");w.forEach(x=>L.push("- "+fmt(x.date)+", "+[x.tool,x.cat,x.details].filter(Boolean).join(", ")+" ("+fmtDur(x.min)+")"));}
  const done=state.tasks.filter(t=>t.done&&ok(t.doneDate||t.created));
  if(done.length){L.push("","TÂCHES TERMINÉES :");done.forEach(t=>L.push("- "+t.title+" ("+t.domain+")"));}
  const b=state.projects.filter(p=>p.status==="termine"&&(p.bilan||p.notes));
  if(b.length){L.push("","BILANS DE PROJETS TERMINÉS :");b.forEach(p=>L.push("- "+p.name+" : "+[p.bilan,p.notes].filter(Boolean).join(" ").replace(/\n/g," ")));}
  const a=state.projects.filter(p=>p.status==="actif");
  if(a.length){L.push("","PROJETS EN COURS :");a.forEach(p=>L.push("- "+p.name+(p.notes?" : "+p.notes.replace(/\n/g," "):"")));}
  return L.join("\n");
}
const SK_TYPES={tech:"🛠️ Technique",transv:"🤝 Transversale"};
function skType(raw){const n=norm(raw);if(/transv|savoir.?etre/.test(n))return "transv";if(/techn|savoir.?faire/.test(n))return "tech";return "";}
function cutType(l){const m=l.match(/\s*[\[(]\s*(techniques?|transversales?|savoir.?faire|savoir.?[eê]tre)\s*[\])]\s*\.?\s*$/i);return m?{l:l.slice(0,m.index).trim(),type:skType(m[1])}:{l,type:""};}
function parseSkills(raw){
  const items=[];
  raw.split(/\n/).forEach(line=>{
    let l=line.trim();if(!l||/^\|?\s*:?-{3,}/.test(l))return;
    if(l.includes("|")){const c=l.split("|").map(x=>x.replace(/\*\*/g,"").trim()).filter(Boolean);if(c.length>=1&&!/^comp[ée]tence/i.test(c[0])){const ct=cutType(c[1]||"");items.push({name:c[0],proof:ct.l,type:ct.type||skType(c[2]||"")});}return;}
    l=l.replace(/^([-*•]|\d+[.)])\s*/,"").replace(/\*\*/g,"").trim();
    const ct=cutType(l);l=ct.l;const ty=ct.type;
    const i=l.indexOf(":");
    if(i===l.length-1)return;
    if(i>0)items.push({name:l.slice(0,i).trim(),proof:l.slice(i+1).trim(),type:ty});else if(l)items.push({name:l,proof:"",type:ty});
  });
  return items;
}

function parseJob(raw){
  const have=[],todo=[];let mode="";
  raw.split(/\n/).forEach(line=>{

    const n=norm(l),head=!/^([-•]|\d+[.)])\s/.test(line.trim())&&(l.indexOf(":")<0||/:$/.test(l))&&l.length<60;
    if(head&&/deja|transferable|acquis/.test(n)){mode="have";return;}
    if(head&&/developp|manque|a acquerir/.test(n)){mode="todo";return;}
    if(!mode)return;
    l=l.replace(/^([-*•]|\d+[.)])\s*/,"").trim();const i=l.indexOf(":");

const SK_STOP=new Set(["avec","pour","dans","des","les","une","sur","par","aux","du","de","la","le","et","en","un","au","ou"]);
function skWords(n,full){const w=norm(n).replace(/\(.*?\)/g," ").split(/[^a-z0-9]+/).filter(w=>w.length>=2&&!SK_STOP.has(w));return full?w:w.map(x=>x.slice(0,5));}
function skSame(a,b){

  const B=new Set(wb),A=new Set(wa);let c=0;A.forEach(w=>{if(B.has(w))c++;});

function skillGroups(){

function skillForm(k){
  k=k||{id:"",name:"",proof:"",date:today()};
  return `<h2>${k.id?"Modifier la compétence":"Nouvelle compétence"}</h2>
  <label for="kName">Compétence</label><input id="kName" value="${esc(k.name)}" placeholder="Ex. : Rédiger un bilan clair et concis">
  <label for="kProof">Exemple qui la prouve</label><textarea id="kProof" rows="3">${esc(k.proof)}</textarea>
  <label for="kDate">Date</label><input id="kDate" type="date" value="${esc(k.date)}">
  <label for="kType">Étiquette</label><select id="kType"><option value="" ${!k.type?"selected":""}>Sans étiquette</option>${Object.entries(SK_TYPES).map(([v,l])=>`<option value="${v}" ${k.type===v?"selected":""}>${l}</option>`).join("")}</select>
  <label for="kLink">Regrouper dans la Synthèse</label><select id="kLink">
    <option value="" ${!k.link?"selected":""}>Automatique (selon le nom)</option>
    <option value="none" ${k.link==="none"?"selected":""}>Ne pas regrouper</option>
    ${state.skills.filter(x=>x.id!==k.id).sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option value="${x.id}" ${k.link===x.id?"selected":""}>Avec : ${esc(x.name)} (${fmt(x.date)})</option>`).join("")}</select>
  <div class="actions"><button class="btn ghost" data-act="closeModal">Annuler</button><button class="btn" data-act="saveSkill" data-id="${k.id}">Enregistrer</button></div>`;
}

PARAMÈTRES : version du carnet et date du jour. Date, heure et nom du fichier de la dernière sauvegarde et de la dernière restauration. Sauvegarde et restauration en .json. Thème clair, sombre ou comme le téléphone. Onglets réordonnables.

function recordWork(c,start,end){
  const min=Math.round((end-start-(c.gap||0))/60000);if(min<1)return 0;
  const s=new Date(start),e=new Date(end);
  addToList("tools",c.tool);splitCats(c.cat).forEach(x=>addToList("cats",x));
  state.work.push({id:uid(),date:isoOf(s),tool:c.tool||"",cat:c.cat||"",details:c.details||"",start:hm(s),end:hm(e),min});
  sortWork(state);return min;
}
const chronoMs=()=>Date.now()-state.chrono.start-(state.chrono.gap||0);
function startVisit(){const n=Date.now();state.chrono={running:true,start:n,lastSeen:n,gap:0,tool:"Carnet Pilote",cat:"Visite",details:""};save();}
let merged=false;
function bootChrono(){
  const c=state.chrono,now=Date.now(),g=(state.settings.mergeGap||0)*60000;
  if(c.running&&c.start&&c.lastSeen&&g>0&&now-c.lastSeen>=0&&now-c.lastSeen<=g){c.gap=(c.gap||0)+(now-c.lastSeen);c.lastSeen=now;merged=true;save();return;}
  if(c.running&&c.start){const end=c.lastSeen&&c.lastSeen>c.start?c.lastSeen:c.start;recordWork(c,c.start,end);}
  startVisit();
}

    <label for="chDet">Détails</label><textarea id="chDet" rows="2">${esc(c.details)}</textarea>`;

    <p class="meta">Les changements s’enregistrent tout seuls.</p>

function syncChronoField(id){

/* ---------- minuteur de pauses ---------- */
function ensureAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(e){}}
function beep(){
  try{ensureAudio();if(!actx)return;[0,0.35,0.7].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=660;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(0.25,actx.currentTime+t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+t+0.28);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+0.3);});}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([300,150,300]);}catch(e){}
}
const nCycles=()=>Math.max(2,state.settings.cycles||4);
function dots(c){const n=nCycles();return `<p class="center dots" aria-label="Cycle ${c} sur ${n}">${Array.from({length:n},(_,i)=>i<c?"●":"○").join("")}</p>`;}
function nextCycle(){const p=state.pomo;return p.cycle>=nCycles()?1:(p.cycle||0)+1;}
function pomoModal(){
  const p=state.pomo,s=state.settings,n=nCycles();
  if(p.phase==="work"){
    openModal(`<h2>${p.emoji||"💪"} Cycle ${p.cycle} sur ${n}</h2>${dots(p.cycle)}<p class="center meta">Pause dans</p><div class="big" id="pomoDisp">${hms(p.end-Date.now())}</div>
    <div class="actions"><button class="btn ghost" data-act="pomoStop">Arrêter</button><button class="btn ghost" data-act="pomoPauseNow">Pause maintenant</button><button class="btn" data-act="closeModal">Continuer</button></div>`,"pomo");
  }else if(p.phase==="pause"){
    openModal(`<h2>${p.emoji||"⏳"} ${p.long?"Grande pause":"Pause"} en cours</h2>${dots(p.cycle)}<p class="center">Bouge, bois un verre d’eau 💧, repose tes yeux.</p><div class="big" id="pomoDisp">${hms(p.end-Date.now())}</div>
    <div class="actions"><button class="btn ghost" data-act="pomoStop">Arrêter</button><button class="btn" data-act="pomoResume">Reprendre le travail</button></div>`,"pomo");
  }else{
    const cont=p.next>1;
    openModal(`<h2>🍅 Minuteur Pomodoro</h2><p>${n} cycles de ${s.pomo} min, avec une petite pause de ${s.pause} min entre chaque, puis une grande pause de ${s.longPause} min.</p>
    <p class="meta">Garde le carnet ouvert pour entendre l’alerte. Durées réglables dans Paramètres.</p>
    <div class="actions"><button class="btn ghost" data-act="closeModal">Annuler</button>${cont?`<button class="btn ghost" data-act="pomoFresh">Recommencer au cycle 1</button><button class="btn" data-act="pomoResume">Continuer au cycle ${p.next}</button>`:`<button class="btn" data-act="pomoFresh">Démarrer</button>`}</div>`,"pomo");
  }
}
function startWork(cycle){
  ensureAudio();const n=nCycles();cycle=cycle>n||cycle<1?1:cycle;
  const m=pick(WORK_MSG);const music=Math.random()<0.35?pick(MUSIC):"";const em=music?pick(["🎵","🎶"]):m.e;
  Object.assign(state.pomo,{phase:"work",end:Date.now()+state.settings.pomo*60000,emoji:em,cycle,long:false});save();updateFabs();
  openModal(`<span class="em" aria-hidden="true">${em}</span><h2 class="center">Cycle ${cycle} sur ${n} : ${state.settings.pomo} min de concentration</h2>${dots(cycle)}
  <p class="center">${m.t}</p>${music?`<p class="center meta">🎵 ${music}</p>`:""}
  <div class="actions" style="justify-content:center"><button class="btn" data-act="closeModal">C’est parti</button></div>`,"start");
  setTimeout(()=>{if(modalKind==="start")closeModal();},9000);
}
function startPause(alert){
  const p=state.pomo,long=p.cycle>=nCycles(),m=pick(PAUSE_MSG);
  Object.assign(p,{phase:"pause",end:Date.now()+(long?state.settings.longPause:state.settings.pause)*60000,emoji:m.e,long});save();
  if(alert){
    beep();const left=2-(p.skips||0);
    openModal(`<span class="em" aria-hidden="true">${m.e}</span><h2 class="center">${long?"C’est l’heure de la grande pause":"C’est l’heure de la pause"}</h2>${dots(p.cycle)}

    ${left>0?`<p class="center meta">Pas prête ? Tu peux passer la pause (encore ${left} fois).</p>`:`<div class="warn center">Tu as déjà passé 2 pauses de suite : celle-ci est obligatoire 🌿</div>`}
    <div class="actions" style="justify-content:center">${left>0?`<button class="btn ghost" data-act="pomoSkip">Passer la pause</button>`:""}<button class="btn ghost" data-act="pomoStop">Arrêter le minuteur</button><button class="btn" data-act="closeModal">OK, je prends ma pause</button></div>`,"pause");
  }
  updateFabs();
}
function endPause(){
  const p=state.pomo,next=p.long?1:(p.cycle||0)+1;
  Object.assign(p,{phase:"off",end:0,emoji:"",skips:0,next});save();beep();

/* ---------- boutons flottants ---------- */
const FABS={fabChrono:chronoModal,fabPomo:pomoModal,fabPin:pinModal};
function placeFab(el,x,y){
  const w=el.offsetWidth||56,h=el.offsetHeight||56;
  x=Math.max(4,Math.min(innerWidth-w-4,x));y=Math.max(4,Math.min(innerHeight-h-4,y));
  el.style.left=x+"px";el.style.top=y+"px";el.style.right="auto";el.style.bottom="auto";
}
function restoreFabs(){
  Object.keys(FABS).forEach(k=>{const el=document.getElementById(k);const p=state.fabPos[k];
    if(p)placeFab(el,p.x,p.y);else{el.style.left="";el.style.top="";el.style.right="";el.style.bottom="";}});
}
function setupFab(el){
  let sx=0,sy=0,ox=0,oy=0,down=false,moved=false;
  el.addEventListener("pointerdown",e=>{down=true;moved=false;sx=e.clientX;sy=e.clientY;const r=el.getBoundingClientRect();ox=r.left;oy=r.top;try{el.setPointerCapture(e.pointerId);}catch(_){}});
  el.addEventListener("pointermove",e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&Math.hypot(dx,dy)<8)return;moved=true;placeFab(el,ox+dx,oy+dy);});
  const end=()=>{if(!down)return;down=false;if(moved){const r=el.getBoundingClientRect();state.fabPos[el.id]={x:r.left,y:r.top};save();justDragged=true;setTimeout(()=>justDragged=false,350);}};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  el.addEventListener("click",()=>{if(justDragged){justDragged=false;return;}FABS[el.id]();});
}
function setBadge(el,txt){const b=el.querySelector(".b");if(txt){b.textContent=txt;b.hidden=false;}else b.hidden=true;}
function updateFabs(){
  const pin=$("#fabPin"),n=state.urgent.length;
  const soft=n?0:dueReminders().length;pin.classList.toggle("alert",n>0);pin.classList.toggle("soft",!n&&soft>0);pin.classList.toggle("calm",!n&&!soft);setBadge(pin,n?String(n):soft?"🌿":"");
  const c=state.chrono;setBadge($("#fabChrono"),c.running?hms(chronoMs()):"");
  const p=state.pomo,pf=$("#fabPomo");
  pf.querySelector(".ic").textContent=p.phase!=="off"&&p.emoji?p.emoji:"🍅";
  setBadge(pf,p.phase!=="off"?Math.max(0,Math.ceil((p.end-Date.now())/60000))+" min":"");
}
function tick(){
  const p=state.pomo,now=Date.now();
  if(state.chrono.running){state.chrono.lastSeen=now;if(++tickCount%10===0)save();}
  if(p.phase==="work"&&now>=p.end)startPause(true);
  else if(p.phase==="pause"&&now>=p.end)endPause();
  const cd=$("#chronoDisp");if(cd&&state.chrono.running)cd.textContent=hms(chronoMs());
  const pd=$("#pomoDisp");if(pd&&state.pomo.phase!=="off")pd.textContent=hms(state.pomo.end-now);
  updateFabs();
}

/* ---------- recherche ---------- */
function doSearch(q){
  const box=$("#results"),n=norm(q.trim());
  if(n.length<2){box.hidden=true;box.innerHTML="";return;}
  const has=(...xs)=>xs.some(x=>norm(x).includes(n));
  const hits=[];
  state.settings.tabOrder.forEach(k=>{const t=TABS[k];if(has(t.label,t.kw))hits.push({tab:k,title:"Onglet "+t.label,sub:"Aller à l’onglet"});});
  state.projects.forEach(p=>{if(has(p.name,p.why,p.bilan,p.next,p.notes,p.otherFiles,...p.links.map(l=>l.name)))hits.push({tab:p.space==="loisirs"?"loisirs":"projets",id:"p-"+p.id,title:p.name,sub:(p.kind==="objectif"?"Objectif, ":"")+(SPACE_TXT[p.space]||"Projet")+", "+STATUS[p.status]+(p.star?", ⭐":"")});});
  state.tasks.forEach(t=>{if(has(t.title,t.note,t.domain))hits.push({tab:"taches",id:"t-"+t.id,filter:t.done?"Faites":"Tous",title:t.title,sub:(t.type==="rdv"?"RDV, ":"Tâche, ")+t.domain+(t.done?", faite":"")});});
  state.files.forEach(f=>{if(has(f.name,f.where,f.kw))hits.push({tab:"fichiers",id:"f-"+f.id,title:f.name,sub:f.type==="dossier"?"Dossier Drive":"Fichier Drive"});});
  state.journal.forEach(j=>{if(has(j.text))hits.push({tab:"journal",id:"j-"+j.id,title:j.text.slice(0,70),sub:"Journal, "+fmt(j.date)});});
  state.work.forEach(w=>{if(has(w.tool,w.cat,w.details))hits.push({tab:"journal",id:"w-"+w.id,title:w.cat||w.tool,sub:"Durée de travail, "+fmt(w.date)});});
  state.ideas.forEach(i=>{if(has(i.text))hits.push({tab:"accueil",id:"i-"+i.id,title:i.text,sub:i.later?"Idée, plus tard":"Boîte à idées",later:i.later});});
  state.urgent.forEach(u=>{if(has(u.text))hits.push({pin:true,title:u.text,sub:"Note urgente"});});
  state.sante.ess.forEach(x=>{if(has(x.name,x.use,x.where,x.cat))hits.push({tab:"sante",view:"ess",id:"e-"+x.id,title:x.name,sub:"Mes essentiels"+(x.where?", rangé : "+x.where:"")});});
  state.sante.suivi.forEach(x=>{if(has(x.loc,x.type,x.trig,x.relief,x.note))hits.push({tab:"sante",view:"suivi",id:"s-h-"+x.id,title:x.loc+" ("+(+x.int||0)+"/10)",sub:"Suivi santé, "+fmt(x.date)});});
  state.skills.forEach(k=>{if(has(k.name,k.proof))hits.push({tab:"competences",id:"s-"+k.id,title:k.name,sub:"Compétence, "+fmt(k.date)});});
  lastHits=hits.slice(0,30);
  box.innerHTML=lastHits.length?lastHits.map((h,i)=>`<button class="res" data-act="goto" data-id="${i}">${esc(h.title)}<small>${esc(h.sub)}</small></button>`).join("")
    :`<p class="res">Rien trouvé pour « ${esc(q)} ». Essaie un mot proche : un thème, un lieu, une personne.</p>`;
  box.hidden=false;
}
function clearSearch(){$("#q").value="";$("#results").hidden=true;$("#results").innerHTML="";}

function copyText(txt,sel,msg){
  let t=sel?$(sel):null,tmp=false;
  const fail=()=>toast("Copie bloquée par le téléphone : appuie longuement sur le texte, puis « Tout sélectionner » et « Copier »",6000);
  const fb=()=>{
    if(!t){t=document.createElement("textarea");t.value=txt;t.setAttribute("readonly","");t.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";document.body.appendChild(t);tmp=true;}
    t.focus();t.select();try{t.setSelectionRange(0,t.value.length);}catch(e){}
    let ok=false;try{ok=document.execCommand("copy");}catch(e){}
    if(tmp)t.remove();
    if(ok)toast(msg);else fail();};
  if(window.isSecureContext&&navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast(msg),fb);else fb();}

    if(id)Object.assign(state.skills.find(k=>k.id===id),data);else{kid=uid();state.skills.push(Object.assign({id:kid},data));state.lastSkills={date:today()};}
    save();closeModal();render();flash("s-"+kid);toast("Compétence enregistrée");},
  delSkill:id=>{const k=state.skills.find(x=>x.id===id);if(!k||!confirm("Supprimer « "+k.name+" » ?"))return;state.skills=state.skills.filter(x=>x.id!==id);save();render();},
  copySkills:()=>{const v=state.skillView==="synth"?"synth":"list",t=skillsText(v);const o=$("#skillsOut");if(o){o.value=t;o.rows=Math.min(12,t.split("\n").length+1);}copyText(t,"#skillsOut",v==="synth"?"Synthèse copiée":"Liste copiée");},
  skillType:id=>{const y=window.scrollY;state.skillType=id||"";save();render();window.scrollTo(0,y);},
  tagPrepare:()=>{if(!untagged().length){toast("Toutes tes compétences ont une étiquette");return;}const t=tagSource(),ta=$("#tagSrc");if(ta)ta.value=t;copyText(t,"#tagSrc","Texte copié : colle-le à Claude");},
  tagPaste:()=>{const raw=($("#tagIn")||{}).value||"";let n=0;
    const K=x=>norm(x).replace(/[^a-z0-9]+/g,""),strip=x=>String(x).replace(/\s+[—–]\s+.*$/,"").replace(/\s*\([^)]*\)\s*$/,"").trim();
    raw.split(/\n/).forEach(line=>{let l=line.replace(/^([-*•]|\d+[.)])\s*/,"").replace(/\*\*/g,"").trim();if(!l)return;
      const i=l.lastIndexOf(":");const ty=skType(i>0?l.slice(i+1):l);if(!ty)return;
      const full=(i>0?l.slice(0,i):l).replace(/\s+[—–]\s+.*$/,"").trim(),un=state.skills.filter(k=>!k.type);
      let hit=un.filter(k=>K(k.name)===K(full));
      if(!hit.length)hit=un.filter(k=>K(k.name)===K(strip(full)));
      if(!hit.length)hit=un.filter(k=>K(strip(k.name))===K(strip(full)));
      hit.forEach(k=>{k.type=ty;n++;});});
    if(!n){toast("Aucune étiquette reconnue : colle la réponse de Claude");return;}
    save();render();flash("skillsBlock");toast(n+" compétence"+(n>1?"s étiquetées":" étiquetée"),4000);},
  jobPrepare:()=>{const job=val("jobIn");if(!job){toast("Écris d’abord le métier visé");return;}
    const from=val("jobFrom"),base=(document.getElementById("jobBase")||{}).value||"both";state.jobFrom=from;state.jobBase=base;save();
    if(base!=="carnet"&&!from){toast("Écris ton ancien métier, ou choisis « Mon carnet seulement »",5000);return;}
    const t=JOB_TXT(job,from,base)+(base==="from"?"":"\n\nMES COMPÉTENCES :\n"+(skillsText("synth")||"(aucune pour l’instant)"));
    const ta=$("#jobSrc");if(ta)ta.value=t;state.jobDraft=job;copyText(t,"#jobSrc","Texte copié : colle-le à Claude");},
  jobPaste:()=>{const job=val("jobIn")||state.jobDraft||"";if(!job){toast("Écris le métier visé");return;}
    const r=parseJob(($("#jobResp")||{}).value||"");if(!r.have.length&&!r.todo.length){toast("Colle la réponse de Claude (avec J’AI DÉJÀ et À DÉVELOPPER)",4500);return;}
    const id=uid();state.targets.push({id,job,from:val("jobFrom"),base:(document.getElementById("jobBase")||{}).value||"both",date:today(),have:r.have,todo:r.todo});state.jobDraft="";save();render();flash("j-"+id);toast("Comparaison ajoutée");},
  jobTick:id=>{const [tid,i]=id.split("|");const t=state.targets.find(x=>x.id===tid);if(!t||!t.todo[i])return;t.todo[i].done=!t.todo[i].done;const y=window.scrollY;save();render();window.scrollTo(0,y);
    toast(t.todo[i].done?"Bravo, compétence acquise !":"Remise à développer");},
  jobCopy:id=>{const t=state.targets.find(x=>x.id===id);if(!t)return;const o=$("#jobSrc");const txt=jobText(t);if(o)o.value=txt;copyText(txt,"#jobSrc","Comparaison copiée");},
  jobDel:id=>{const t=state.targets.find(x=>x.id===id);if(!t||!confirm("Supprimer la comparaison « "+t.job+" » ?"))return;state.targets=state.targets.filter(x=>x.id!==id);save();render();},
  skillFold:()=>{const y=window.scrollY;state.skillsFold=!state.skillsFold;save();render();window.scrollTo(0,y);toast(state.skillsFold?"Liste repliée":"Liste dépliée");},
  skillView:id=>{const y=window.scrollY;state.skillView=id;save();render();window.scrollTo(0,y);},
  copyBase:()=>copyText(BASE_PROMPT,"#basePrompt","Règles copiées"),
  copyPrompt:()=>{const t=$("#promptCopy");const done=()=>toast("Message copié");
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(UPDATE_PROMPT).then(done,()=>{t.select();document.execCommand("copy");done();});
    else{t.select();document.execCommand("copy");done();}}
};

/* ---------- écouteurs ---------- */
document.addEventListener("click",e=>{
  if(e.target.id==="modal"){closeModal();return;}
  const b=e.target.closest("[data-act]");
  if(!b){if(!e.target.closest(".searchwrap"))$("#results").hidden=true;return;}
  const fn=ACT[b.dataset.act];if(fn)fn(b.dataset.id,b,e);
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q")doSearch(t.value);
  if(t.id==="reprendre"){state.reprendre=t.value;save();const s=$("#repSaved");if(s)s.textContent="Enregistré ✓";}
  if(state.chrono.running&&["chDet","chToolO","chCatO"].includes(t.id))syncChronoField(t.id);
  if(t.id==="sInt"){const o=$("#sIntOut");if(o)o.textContent=t.value+" / 10";}
});
document.addEventListener("change",e=>{
  const t=e.target,k=t.dataset.set;
  if(t.tagName==="SELECT"&&t.dataset.kind){
    const o=document.getElementById(t.id+"O");
    if(o){o.hidden=t.value!=="__autre";if(!o.hidden)o.focus();}
    if(state.chrono.running&&(t.id==="chTool"||t.id==="chCat"))syncChronoField(t.id);
  }
  if(t.type==="checkbox"&&t.closest(".chips")&&t.closest(".chips").id){
    const box=t.closest(".chips");
    if(t.value==="__autre"){const o=document.getElementById(box.id+"O");if(o){o.hidden=!t.checked;if(t.checked)o.focus();}}
    if(state.chrono.running&&box.id==="chCat")syncChronoField("chCat");
  }
  if(t.id==="tProj"){const w=$("#tProjNewWrap");if(w){w.hidden=t.value!=="__new";if(!w.hidden)$("#tProjNew").focus();}}
  if(t.id==="fStatus"){const end=t.value==="termine";$("#fWhyWrap").hidden=end;$("#fBilanWrap").hidden=!end;}
  if(k==="name"){state.name=t.value.trim()||"Yas";save();renderHeader();}
  else if(k==="theme"){state.settings.theme=t.value;save();applyTheme();}
  else if(k==="lockIdle"||k==="lockAway"){state.settings[k]=parseInt(t.value,10);save();lastAct=Date.now();toast("Réglage enregistré");}
  else if(k==="lockOn"){state.settings.lockOn=t.value==="1";save();renderHeader();toast(state.settings.lockOn?"Mot de passe activé":"Mot de passe désactivé");}
  else if(k==="lockHint"){state.settings.lockHint=t.value.trim();save();toast("Indice enregistré");}
  else if(["pomo","pause","longPause","cycles","remSave","remSkills","mergeGap"].includes(k)){
    const lim={pomo:[5,90],pause:[1,30],longPause:[5,60],cycles:[2,8],remSave:[1,60],remSkills:[1,60],mergeGap:[0,120]}[k];
    const pv=parseInt(t.value,10);const v=Math.max(lim[0],Math.min(lim[1],isNaN(pv)?lim[0]:pv));state.settings[k]=v;t.value=v;save();toast("Réglage enregistré");}
  if(t.id==="importFile"&&t.files&&t.files[0]){
    const file=t.files[0],r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.projects)||!Array.isArray(o.tasks))throw new Error("format");
      if(!confirm("Remplacer le contenu actuel par cette sauvegarde ?"))return;
      const keepChrono=state.chrono,d=new Date();
      state=fixState(o);state.chrono=keepChrono;state.lastRestore={date:isoOf(d),time:hm(d),file:file.name};
      save();applyTheme();restoreFabs();cur="params";render();toast("Carnet restauré");}
      catch(err){toast("Ce fichier n’est pas une sauvegarde du carnet");}};
    r.readAsText(file);t.value="";
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if($("#modal").classList.contains("open"))closeModal();else if($("#note").classList.contains("show"))hideNote();else{$("#results").hidden=true;}}
  if(e.key==="Enter"&&!e.shiftKey){
    if(e.target.id==="ideaIn"){e.preventDefault();ACT.addIdea();}
    else if(e.target.id==="uIn"){e.preventDefault();ACT.addUrgent();}
  }
});
document.addEventListener("visibilitychange",()=>{
  const c=state.chrono,now=Date.now();
  if(document.hidden){if(c.running){c.lastSeen=now;save();}return;}
  if(c.running&&c.lastSeen&&now-c.lastSeen>30*60000){recordWork(c,c.start,c.lastSeen);startVisit();render();toast("Bon retour ! Nouvelle visite lancée.");}
});
window.addEventListener("pagehide",()=>{if(state.chrono.running){state.chrono.lastSeen=Date.now();save();}});
window.addEventListener("resize",()=>{Object.keys(FABS).forEach(k=>{const p=state.fabPos[k];if(p)placeFab(document.getElementById(k),p.x,p.y);});});

/* ---------- écran du mot de passe ---------- */
let lastAct=Date.now(),hiddenAt=0;
function canLock(){const s=state.settings;return !!(s.lockOn&&s.lockPass);}
const isLocked=()=>document.documentElement.classList.contains("locked");
function lockNow(){if(!canLock()||isLocked())return;closeModal();clearSearch();document.documentElement.classList.add("locked");setupLock();}
["pointerdown","keydown","input"].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now();},true));
window.addEventListener("scroll",()=>{lastAct=Date.now();},{passive:true});
setInterval(()=>{const m=state.settings.lockIdle;if(m>0&&canLock()&&!isLocked()&&!document.hidden&&Date.now()-lastAct>=m*60000)lockNow();},5000);
document.addEventListener("visibilitychange",()=>{const now=Date.now();
  if(document.hidden){hiddenAt=now;return;}
  const a=state.settings.lockAway;
  if(hiddenAt&&a>=0&&canLock()&&!isLocked()&&now-hiddenAt>=a*60000)lockNow();
  hiddenAt=0;lastAct=now;});
function setupLock(){
  const s=state.settings,root=document.documentElement;
  if(!s.lockOn||!s.lockPass){root.classList.remove("locked");onOpen();return;}
  $("#lockLogo").src=LOGO;
  const inp=$("#lockIn"),msg=$("#lockMsg"),hb=$("#lockHintBtn"),hp=$("#lockHint");
  msg.textContent="";hp.hidden=true;inp.value="";
  hb.hidden=!s.lockHint;
  hb.onclick=()=>{hp.textContent="💡 "+s.lockHint;hp.hidden=false;};
  $("#lockForm").onsubmit=e=>{e.preventDefault();
    if(inp.value===s.lockPass){root.classList.remove("locked");inp.value="";msg.textContent="";lastAct=Date.now();onOpen();}
    else{msg.textContent="Mot de passe incorrect";inp.value="";inp.focus();}};
  setTimeout(()=>inp.focus(),50);
}

/* ---------- démarrage ---------- */
applyTheme();applyPhase();
bootChrono();
Object.keys(FABS).forEach(k=>setupFab(document.getElementById(k)));
restoreFabs();
render();
setInterval(tick,1000);
setupLock();
if(merged)setTimeout(()=>toast("Bon retour ! Ta séance continue."),600);
</script>

/* Application mobile : fonctionne seulement une fois le carnet en ligne (https) */
if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
