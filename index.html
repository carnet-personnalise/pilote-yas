/* ---------- écouteurs ---------- */
document.addEventListener("click",e=>{
  if(e.target.id==="modal"){tryClose();return;}
  if(e.target.id==="photoBox"||(e.target.tagName==="IMG"&&e.target.closest("#photoBox"))){$("#photoBox").classList.remove("show");return;}
  const b=e.target.closest("[data-act]");
  if(b&&/^save/.test(b.dataset.act||""))modalDirty=false;
  if(!b){if(!e.target.closest(".searchwrap"))$("#results").hidden=true;return;}
  const fn=ACT[b.dataset.act];if(fn)fn(b.dataset.id,b,e);
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(modalKind==="form"&&t.closest&&t.closest("#sheet")){modalDirty=true;draftSave();}
  if(t.id==="q")doSearch(t.value);
  if(t.id==="tocQ")tocFilter();
  if(t.classList&&t.classList.contains("grow-ta"))autoGrow(t);
  if(modalKind==="claude"){if(t.id==="clOut")claudeEdited=true;else if(t.closest&&t.closest("#claudeForm"))claudeRefresh();}
  if(t.id==="testNote"){const T=testRun(),i=t.dataset.i,n=T.notes[i]=T.notes[i]||{};n.note=t.value.trim();save();}

  if(state.chrono.running&&["chDet","chToolO","chCatO"].includes(t.id))syncChronoField(t.id);
  if(t.id==="sInt"){const o=$("#sIntOut");if(o)o.textContent=t.value+" / 10";}
});
document.addEventListener("change",e=>{
  const t=e.target,k=t.dataset.set;
  if(t.id==="mlTo"){const o=$("#mlToO");if(o){o.hidden=t.value!=="__autre";if(!o.hidden)o.focus();}const s=$("#mlSec");if(s)s.innerHTML=secOpts((state.carnets||[]).find(x=>x.id===t.value),"");const so=$("#mlSecO");if(so)so.hidden=true;return;}
  if(t.id==="mlSec"){const o=$("#mlSecO");if(o){o.hidden=t.value!=="__autre";if(!o.hidden)o.focus();}return;}
  if(t.tagName==="SELECT"&&t.dataset.kind){
    const o=document.getElementById(t.id+"O");
    if(o){o.hidden=t.value!=="__autre";if(!o.hidden)o.focus();}
    if(state.chrono.running&&(t.id==="chTool"||t.id==="chCat"))syncChronoField(t.id);
  }
  if(t.type==="checkbox"&&t.closest(".chips")&&t.closest(".chips").id){
    const box=t.closest(".chips");
    if(t.value==="__autre"){const o=document.getElementById(box.id+"O");if(o){o.hidden=!t.checked;if(t.checked)o.focus();}}
    if(state.chrono.running&&box.id==="chCat")syncChronoField("chCat");
  }
  if(modalKind==="form"&&t.closest&&t.closest("#sheet")){modalDirty=true;draftSave();}
  if(t.id==="tSortBy"){const v=t.value,had=Object.values(state.taskOrd||{}).some(a=>Array.isArray(a)&&a.length);
    if(had&&v!=="perso"&&!confirm("Ton ordre fait avec ↑ ↓ sera remplacé par ce tri : « "+TSORT[v]+" ». Continuer ?")){t.value=tsMode();return;}
    if(v!=="perso")state.taskOrd={};state.settings.taskSortBy=v;save();keepPos("main",render);
    toast(v==="perso"?"Range tes tâches avec ↑ ↓ : le carnet garde ton ordre. Les nouvelles arrivent en haut.":"Tri : "+TSORT[v],4000);return;}
  if(t.id==="fKind"){const w=$("#fCarnetWrap");if(w)w.hidden=t.value!=="Carnet";}
  if(t.id==="mangeMemo"&&mangeCur){state.q.memoMange[mangeCur]=t.value.trim();save();toast("Fiche mémo enregistrée");}
  if(t.id==="sorsMemo"&&sorsCur){state.q.memo[sorsCur]=t.value.trim();save();toast("Fiche mémo enregistrée");}
  if(t.id&&t.id.startsWith("jobSt-")){const jid=t.id.slice(6).replace(/O$/,""),tg=state.targets.find(x=>x.id===jid);
    if(tg){if(t.tagName==="SELECT"){if(t.value!=="__autre"){tg.status=t.value;save();jobOpen.add(jid);render();toast("Statut : "+t.value);}}
      else{const v=t.value.trim();if(v){addToList("jobStatus",v);tg.status=v;save();render();toast("Statut : "+v);}}}}
  if(t.id&&t.id.startsWith("jobWhy-")){const tg=state.targets.find(x=>x.id===t.id.slice(7));if(tg){tg.why=t.value.trim();save();toast("Enregistré");}}
  if(t.id==="addFile"&&t.files&&t.files[0]){
    const file=t.files[0],r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);
      if(o&&Array.isArray(o.projects)&&Array.isArray(o.tasks)){toast("C’est une sauvegarde complète : utilise plutôt « Restaurer »",5000);return;}
      if(!o||o.carnetPilote!=="ajout")throw new Error("format");
      const res=importAdd(o);save();render();
      toast(res.add+" élément"+(res.add>1?"s":"")+" ajouté"+(res.add>1?"s":"")+(res.skip?", "+res.skip+" déjà présent"+(res.skip>1?"s":""):""),5000);}
      catch(err){toast("Ce fichier n’est pas un fichier d’ajout du carnet",4000);}};
    r.readAsText(file);t.value="";
  }
  if(t.dataset&&t.dataset.proj){const o=document.getElementById(t.id+"New");if(o){o.hidden=t.value!=="__new";if(!o.hidden)o.focus();}}
  if(t.dataset&&t.dataset.subj){const o=document.getElementById(t.id+"O");if(o){o.hidden=t.value!=="__autre";if(!o.hidden)o.focus();}}
  if(t.id==="micDayIn"&&t.value){micDay=t.value;render();}
  if(t.id==="clWho"){const o=$("#clWhoO");if(o){o.hidden=t.value!=="__autre";if(!o.hidden)o.focus();}}
  if(t.id==="clTask"){const o=$("#clTaskO");if(o){o.hidden=t.value!=="__autre";if(!o.hidden)o.focus();}claudeRefresh();}
  if(t.id==="aqSrc"){const w=$("#aqTxtWrap");if(w)w.hidden=t.value!=="txt";}
  if(t.id==="kiPh"&&t.files&&t.files.length){const fs=[...t.files].slice(0,Math.max(0,3-kinePhotos.length));if(!fs.length){toast("3 photos au maximum : retire-en une d’abord");t.value="";return;}
    Promise.all(fs.map(shrinkPhoto)).then(ds=>{kinePhotos.push(...ds);modalDirty=true;const pv=$("#kiPrev");if(pv)pv.innerHTML=kinePrevHtml();t.value="";if(t.files&&t.files.length>fs.length)toast("3 photos au maximum");}).catch(()=>toast("Cette photo n’a pas pu être lue"));return;}
  if(t.id==="cpDay"){const v=t.value,c=state.settings.couple,box=$("#cpDays");if(v==="__autre"){if(box)box.hidden=false;return;}if(box)box.hidden=true;
    c.days=v==="we"?[6,0]:v==="none"?[]:[+v];c.on=v!=="none";save();toast(v==="none"?"Rappel du bilan du couple arrêté":"Rappel du bilan du couple : "+t.options[t.selectedIndex].text.toLowerCase());return;}
  if(t.closest&&t.closest("#cpDays")){const c=state.settings.couple;c.days=[...document.querySelectorAll("#cpDays input:checked")].map(x=>+x.value);c.on=c.days.length>0;save();toast(c.days.length?"Jours du rappel enregistrés":"Aucun jour coché : pas de rappel");return;}
  if(t.id==="cpTxt"){state.settings.couple.text=t.value.trim();save();toast("Message enregistré");return;}
  if(t.id==="wiPh"&&t.files&&t.files[0]){shrinkPhoto(t.files[0]).then(d=>{winPhoto=d;modalDirty=true;const p=$("#wiPrev");if(p)p.innerHTML=`<img class="zoom" src="${d}" alt="Aperçu (toucher pour agrandir)" data-act="photoZoom" data-id=""><button type="button" class="btn ghost spk" data-act="winPhotoDel">Retirer la photo</button>`;}).catch(()=>toast("Cette photo n’a pas pu être lue"));t.value="";}
  if(k==="asstName"){state.settings.asstName=t.value.trim()||"Mon assistant";save();renderHeader();toast("Nom enregistré : "+asstName());}
  if((t.id==="micLever"||t.id==="micCoucher")&&micDay){const D=state.sante.micDays[micDay]=state.sante.micDays[micDay]||{};D[t.id==="micLever"?"lever":"coucher"]=t.value;save();render();toast("Enregistré");}
  if(t.id==="mUri"){const w=$("#mUriWrap");if(w)w.hidden=!t.checked;}
  if(t.id==="mNm"){const v=$("#mVol");if(v){v.disabled=t.checked;if(t.checked)v.value="";}}
  if(t.id==="tProj"){const w=$("#tProjNewWrap");if(w){w.hidden=t.value!=="__new";if(!w.hidden)$("#tProjNew").focus();}}
  if(t.id==="fStatus"){const end=t.value==="termine";$("#fWhyWrap").hidden=end;$("#fBilanWrap").hidden=!end;}
  if(k==="name"){state.name=t.value.trim()||"Yas";save();renderHeader();}
  else if(k==="theme"){state.settings.theme=t.value;save();applyTheme();}
  else if(k==="lockIdle"||k==="lockAway"){state.settings[k]=parseInt(t.value,10);save();lastAct=Date.now();toast("Réglage enregistré");}
  else if(k==="lockOn"){state.settings.lockOn=t.value==="1";save();renderHeader();toast(state.settings.lockOn?"Mot de passe activé":"Mot de passe désactivé");}
  else if(k==="lockHint"){state.settings.lockHint=t.value.trim();save();toast("Indice enregistré");}
  else if(["pomo","pause","longPause","cycles","remSave","remSkills","mergeGap","pomoNudge"].includes(k)){
    const lim={pomo:[5,90],pause:[1,30],longPause:[5,60],cycles:[2,8],remSave:[1,60],remSkills:[1,60],mergeGap:[0,120],pomoNudge:[0,180]}[k];
    const pv=parseInt(t.value,10);const v=Math.max(lim[0],Math.min(lim[1],isNaN(pv)?lim[0]:pv));state.settings[k]=v;t.value=v;save();toast("Réglage enregistré");}
  if(t.id==="importFile"&&t.files&&t.files[0]){
    const file=t.files[0],r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.projects)||!Array.isArray(o.tasks))throw new Error("format");
      if(!confirm("Remplacer le contenu actuel par cette sauvegarde ?"))return;
      const keepChrono=state.chrono,d=new Date();
      state=fixState(o);state.chrono=keepChrono;state.lastRestore={date:isoOf(d),time:hm(d),file:file.name};syncCfg.base=null;syncCfg.dirtyAt=Date.now();syncCfg.dirty=true;syncSave();
      save();applyTheme();restoreFabs();cur="params";render();toast("Carnet restauré");}
      catch(err){toast("Ce fichier n’est pas une sauvegarde du carnet");}};
    r.readAsText(file);t.value="";
  }
});
document.addEventListener("toggle",e=>{const d=e.target;if(d&&d.dataset&&d.dataset.fold){state.ui.fold=state.ui.fold||{};state.ui.fold[d.dataset.fold]=d.open;save();}if(d&&d.dataset&&d.dataset.sp){state.ui.foldSp[d.dataset.sp]=!d.open;save();}if(d&&d.dataset&&d.dataset.fg!==undefined){state.ui.fileFold[d.dataset.fg]=!d.open;save();}if(d&&d.id==="jobRech")jobSec.r=d.open;if(d&&d.id==="jobRes")jobSec.s=d.open;if(d&&d.classList&&d.classList.contains("jobc")){const id=d.dataset.job;if(d.open){jobOpen.add(id);jobOpen.delete("x"+id);}else{jobOpen.delete(id);jobOpen.add("x"+id);}}},true);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#photoBox").classList.contains("show")){$("#photoBox").classList.remove("show");return;}
  if(e.key==="Escape"){speakStop();if($("#qnote").classList.contains("show"))qnClose();else if($("#alertPop").classList.contains("show"))$("#alertPop").classList.remove("show");else if($("#modal").classList.contains("open"))tryClose();else if($("#note").classList.contains("show"))hideNote();else{$("#results").hidden=true;}}
  if(e.key==="Enter"&&!e.shiftKey){
    if(e.target.id==="ideaIn"){e.preventDefault();ACT.addIdea();}
    else if(e.target.id==="uIn"){e.preventDefault();ACT.addUrgent();}
    else if(e.target.id==="repIn"){e.preventDefault();ACT.repAdd();}
    else if(e.target.id==="qnIn"){e.preventDefault();ACT.qnAdd();}
    else if(e.target.id&&e.target.id.startsWith("bagIn-")){e.preventDefault();ACT.bagAdd(e.target.id.slice(6));}
  }
});
document.addEventListener("visibilitychange",()=>{
  const c=state.chrono,now=Date.now();
  if(document.hidden){draftSaveNow();if(c.running){c.lastSeen=now;save();}return;}
  if(c.running&&c.lastSeen&&now-c.lastSeen>30*60000){recordWork(c,c.start,c.lastSeen);startVisit();render();toast("Bon retour ! Nouvelle visite lancée.");}
});
document.addEventListener("visibilitychange",()=>{if(typeof syncCfg==="undefined")return;
  if(document.hidden){if(syncCfg.dirty&&tokOk())syncNow(false);return;}
  mailPublish();syncBtnUpd();if(syncReady()&&tokOk()&&Date.now()-(syncCfg.lastOk||0)>60000)syncNow(false);});
window.addEventListener("online",()=>{if(syncReady()&&tokOk())syncNow(false);else syncBtnUpd();});
window.addEventListener("pagehide",()=>{draftSaveNow();if(state.chrono.running){state.chrono.lastSeen=Date.now();save();}});
window.addEventListener("resize",()=>{Object.keys(FABS).forEach(k=>{const p=state.fabPos[k];if(p)placeFab(document.getElementById(k),p.x,p.y);});setHdr();document.querySelectorAll(".hs").forEach(hsUpd);recenter();});
window.addEventListener("scroll",()=>{if(window.scrollX)recenter();},{passive:true});

/* ---------- écran du mot de passe ---------- */
let lastAct=Date.now(),hiddenAt=0;
function canLock(){const s=state.settings;return !!(s.lockOn&&s.lockPass);}
const isLocked=()=>document.documentElement.classList.contains("locked");
function lockNow(){if(!canLock()||isLocked())return;if(modalKind==="form"||modalStash)draftSaveNow();else closeModal();clearSearch();document.documentElement.classList.add("locked");setupLock();}
["pointerdown","keydown","input"].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now();},true));
window.addEventListener("scroll",()=>{lastAct=Date.now();},{passive:true});
setInterval(()=>{const m=state.settings.lockIdle;if(m>0&&canLock()&&!isLocked()&&!document.hidden&&Date.now()-lastAct>=m*60000)lockNow();},5000);
document.addEventListener("visibilitychange",()=>{const now=Date.now();
  if(document.hidden){hiddenAt=now;return;}
  const a=state.settings.lockAway;
  if(hiddenAt&&a>=0&&canLock()&&!isLocked()&&now-hiddenAt>=a*60000)lockNow();
  hiddenAt=0;lastAct=now;});
function setupLock(){
  const s=state.settings,root=document.documentElement;
  if(!s.lockOn||!s.lockPass){root.classList.remove("locked");onOpen();return;}
  $("#lockLogo").src=LOGO;
  const inp=$("#lockIn"),msg=$("#lockMsg"),hb=$("#lockHintBtn"),hp=$("#lockHint");
  msg.textContent="";hp.hidden=true;inp.value="";
  hb.hidden=!s.lockHint;
  hb.onclick=()=>{hp.textContent="💡 "+s.lockHint;hp.hidden=false;};
  const bb=$("#lockBio");bb.hidden=!s.bioId;
  const ok=()=>{inp.oninput=null;root.classList.remove("locked");inp.value="";msg.textContent="";lastAct=Date.now();onOpen();};
  bb.onclick=async()=>{if(await bioUnlock())ok();else msg.textContent="Empreinte non reconnue : utilise ton mot de passe";};
  inp.oninput=()=>{if(inp.value===s.lockPass){const f=$("#lockForm");if(f.requestSubmit)f.requestSubmit();else f.onsubmit({preventDefault(){}});}};
  $("#lockForm").onsubmit=e=>{e.preventDefault();
    if(inp.value===s.lockPass){inp.oninput=null;root.classList.remove("locked");inp.value="";msg.textContent="";lastAct=Date.now();onOpen();}
    else{msg.textContent="Mot de passe incorrect";inp.value="";inp.focus();}};
  if(!s.bioId)setTimeout(()=>inp.focus(),50);
}

/* ---------- V17 : fenêtre adaptée au clavier ---------- */
function fitViewport(){const v=window.visualViewport;if(!v)return;const r=document.documentElement.style;r.setProperty("--vvh",v.height+"px");r.setProperty("--vvt",v.offsetTop+"px");
  const a=document.activeElement;if(a&&a.closest&&a.closest("#sheet")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))setTimeout(()=>a.scrollIntoView({block:"center"}),60);}
if(window.visualViewport){visualViewport.addEventListener("resize",fitViewport);visualViewport.addEventListener("scroll",fitViewport);fitViewport();}

/* ---------- démarrage ---------- */
applyTheme();applyPhase();
if(!state.seed19){try{state.rep.forEach(r=>{if(!r.subj)r.subj=autoSubj(r.text);});}catch(e){}state.seed19=true;save();}
bootChrono();
Object.keys(FABS).forEach(k=>setupFab(document.getElementById(k)));
restoreFabs();
render();
setInterval(tick,1000);
setupLock();
window.addEventListener("load",()=>{setHdr();recenter();document.querySelectorAll(".hs").forEach(hsUpd);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{setHdr();document.querySelectorAll(".hs").forEach(hsUpd);});
if(merged)setTimeout(()=>toast("Bon retour ! Ta séance continue."),600);
mailPublish();if(syncReady()&&canSyncHere())gisLoad().catch(()=>{});syncBtnUpd();
</script>

/* Application mobile : fonctionne seulement une fois le carnet en ligne (https) */
if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
