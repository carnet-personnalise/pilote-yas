<style>
/* ---------- couleurs de base ---------- */
:root{
  --bg:#E6F0EE;--head:#CFE5E2;--surface:#FFFFFF;--ink:#1D2A31;--muted:#536570;--line:#CADAD8;
  --accent:#0F7C79;--accent-soft:#CDE8E5;--on-accent:#FFFFFF;
  --sun:#D98E04;--sun-soft:#FBEFD6;--green:#2F8A55;--orange:#D9822B;--red:#C8433C;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1D1D;--head:#163130;--surface:#172726;--ink:#E6EEF0;--muted:#9DB1B2;--line:#2A3F3E;
    --accent:#4DB8B3;--accent-soft:#163B3A;--on-accent:#0F1A1C;
    --sun:#EBA73A;--sun-soft:#3A311B;--green:#5BBF85;--orange:#E8A160;--red:#E46A62;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1D1D;--head:#163130;--surface:#172726;--ink:#E6EEF0;--muted:#9DB1B2;--line:#2A3F3E;
  --accent:#4DB8B3;--accent-soft:#163B3A;--on-accent:#0F1A1C;
  --sun:#EBA73A;--sun-soft:#3A311B;--green:#5BBF85;--orange:#E8A160;--red:#E46A62;color-scheme:dark;
}
/* ---------- ambiance selon la phase (clair) ---------- */
:root[data-phase="haute"]{--bg:#E7ECF6;--head:#D2DBF0;--line:#CBD4E8;--accent:#3E5C9A;--accent-soft:#DAE2F4}
:root[data-phase="basse"]{--bg:#F7EBDD;--head:#F0D8BC;--line:#E6D2BC;--accent:#A55A2A;--accent-soft:#F5DFCA}
/* ---------- ambiance selon la phase (sombre) ---------- */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"])[data-phase="neutre"]{--bg:#0F1D1D;--head:#163130;--surface:#172726;--line:#2A3F3E;--accent:#4DB8B3;--accent-soft:#163B3A}
  :root:not([data-theme="light"])[data-phase="haute"]{--bg:#121827;--head:#1C2640;--surface:#182033;--line:#2A3552;--accent:#8EA8E6;--accent-soft:#1F2B4A}
  :root:not([data-theme="light"])[data-phase="basse"]{--bg:#20160E;--head:#33231A;--surface:#271C14;--line:#43301F;--accent:#E39A63;--accent-soft:#3B2718}
}
:root[data-theme="dark"][data-phase="neutre"]{--bg:#0F1D1D;--head:#163130;--surface:#172726;--line:#2A3F3E;--accent:#4DB8B3;--accent-soft:#163B3A}
:root[data-theme="dark"][data-phase="haute"]{--bg:#121827;--head:#1C2640;--surface:#182033;--line:#2A3552;--accent:#8EA8E6;--accent-soft:#1F2B4A}
:root[data-theme="dark"][data-phase="basse"]{--bg:#20160E;--head:#33231A;--surface:#271C14;--line:#43301F;--accent:#E39A63;--accent-soft:#3B2718}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 170px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5;transition:background-color .5s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);border-bottom:1px solid var(--line);padding:10px 16px 0;transition:background-color .5s}
.top{display:flex;align-items:center;gap:12px;max-width:860px;margin:0 auto}
.logo{width:44px;height:44px;border-radius:12px;background:#FFFFFF;padding:3px;flex:0 0 auto;border:1px solid var(--line)}
.logo img{width:100%;height:100%;display:block}
h1{font-size:1.4rem;margin:0;line-height:1.15;letter-spacing:-.01em}
.today{color:var(--muted);font-size:.9rem;display:block}
.searchwrap{position:relative;max-width:860px;margin:10px auto 0}
#q{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit}
#results{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:55vh;overflow:auto;z-index:40;box-shadow:0 10px 28px rgba(0,0,0,.18)}
.res{display:block;width:100%;text-align:left;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;cursor:pointer;margin:0}
.res small{display:block;color:var(--muted)}
.tabbar{display:flex;align-items:center;gap:2px;max-width:860px;margin:8px auto 0}
.arrow{flex:0 0 auto;border:0;background:none;color:var(--muted);font-size:1.4rem;line-height:1;padding:6px 8px;cursor:pointer}
#tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;scroll-behavior:smooth}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;padding:10px 12px;font:inherit;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
main{max-width:860px;margin:0 auto;padding:18px 16px 230px}
h2{font-size:1.3rem;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 16px}
.hello{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.hello .logo{width:64px;height:64px;border-radius:16px}
.hello h2{font-size:1.5rem;margin:0}
.hello p{margin:2px 0 0;color:var(--muted)}
.block{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:16px;margin-bottom:14px}
.block h3{font-size:1.06rem;margin:0 0 8px;color:var(--accent)}
.block p{margin:6px 0}
.mode{display:flex;gap:8px;margin-bottom:12px}
.mode button{flex:1;padding:11px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.mode button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.modebox{border-left:6px solid var(--accent);background:var(--accent-soft);border-radius:0 14px 14px 0;padding:14px 16px;margin-bottom:14px}
.modebox.haute{border-left-color:var(--sun)}
.modebox p{margin:8px 0}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.icon{border:0;background:none;padding:6px;font-size:1.05rem;cursor:pointer;color:var(--muted);min-width:38px;min-height:38px;border-radius:8px;flex:0 0 auto}
.icon:disabled{opacity:.3;cursor:default}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=checkbox]{width:22px;height:22px;flex:0 0 auto;margin:4px 0 0;accent-color:var(--accent)}
input[hidden]{display:none}
label{display:block;font-size:.92rem;color:var(--muted);margin:12px 0 4px}
.hint{font-size:.85rem;color:var(--muted);margin:2px 0 6px}
.inline{display:flex;gap:8px}
.inline > *{flex:1;min-width:0}
.inline > .btn{flex:0 0 auto}
.linkrow{display:grid;grid-template-columns:1fr 110px;gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.linkrow input[type=url]{grid-column:1 / -1}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.dot{width:18px;height:18px;border-radius:50%;border:0;flex:0 0 auto;margin-top:6px;cursor:pointer;padding:0}
.dot.vert{background:var(--green)}.dot.orange{background:var(--orange)}.dot.rouge{background:var(--red)}
.done .ttl{text-decoration:line-through;color:var(--muted)}
.meta{font-size:.9rem;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.93rem;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.tag{cursor:default;display:inline-flex;align-items:center;gap:4px;padding:4px 4px 4px 12px}
.chip.tag button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:2px 6px}
.badge{display:inline-block;font-size:.8rem;font-weight:400;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:middle}
.badge.goal{background:var(--sun-soft);color:var(--ink)}
.warn{background:var(--sun-soft);border-radius:10px;padding:10px 12px;margin:10px 0}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.phead h3{margin:0}
.tools{display:flex;flex-wrap:wrap;justify-content:flex-end}
details summary{cursor:pointer;color:var(--muted);padding:8px 0}
.tablewrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.93rem;min-width:560px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:400}
td.nowrap{white-space:nowrap}
ol.steps{padding-left:0;list-style:none;counter-reset:s;margin:0}
ol.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s);flex:0 0 28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center}
.pic{font-size:1.3rem;flex:0 0 auto}
.num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:700}
.tocbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 0;font:inherit;color:var(--ink);cursor:pointer}
.tocbtn:last-child{border-bottom:0}
details.sec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;margin-bottom:12px}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;cursor:pointer;color:var(--ink);font-weight:700}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .st{flex:1}
details.sec>summary .chev{color:var(--muted);transition:transform .2s}
details.sec[open]>summary .chev{transform:rotate(90deg)}
.pinbtn{border:1px dashed var(--line);background:none;font-size:1.15rem;cursor:pointer;opacity:.35;min-width:42px;min-height:42px;border-radius:10px;filter:grayscale(1)}
.pinbtn.on{opacity:1;filter:none;background:var(--sun-soft);border:2px solid var(--accent)}
.tocbtn.pinned{background:var(--accent-soft);border-radius:8px;padding-left:8px;font-weight:700;border-bottom-color:transparent;margin:2px 0}
details.sec>.body{padding:0 16px 16px}
details.sec>.body p{margin:6px 0}
.dots{letter-spacing:.35em;color:var(--accent);font-size:1.3rem;margin:4px 0}
.fab{position:fixed;right:16px;width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.2);font-size:1.45rem;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;z-index:50;color:var(--ink);user-select:none;-webkit-user-select:none;padding:0}
#fabPin{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#fabPomo{bottom:calc(82px + env(safe-area-inset-bottom,0px))}
#fabChrono{bottom:calc(148px + env(safe-area-inset-bottom,0px))}
.fab .b{position:absolute;top:-8px;right:-12px;background:var(--accent);color:var(--on-accent);font-size:.72rem;border-radius:999px;padding:2px 6px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums;white-space:nowrap}
#fabPin.calm{opacity:.4}
#fabPin.soft .b{background:var(--accent-soft);color:var(--ink)}
#fabPin.alert{background:var(--red);border-color:var(--red)}
#fabPin.alert .b{background:var(--ink);color:var(--bg)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:100}
#modal.open{display:flex}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){#modal{align-items:center}.sheet{border-radius:18px}}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.big{font-size:2.8rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:12px 0}
.center{text-align:center}
.em{font-size:3.4rem;text-align:center;display:block;line-height:1.2}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:120;opacity:0;pointer-events:none;transition:opacity .2s;max-width:80vw;text-align:center}
#toast.show{opacity:1}
.flash{animation:flash 1.2s ease-in-out 3}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 transparent}45%,60%{box-shadow:0 0 0 5px var(--sun);background-color:var(--sun-soft)}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:3px solid var(--sun)}#tabs{scroll-behavior:auto}#toast,body,header{transition:none}}
/* ---------- V14 : santé, pense-bête, natures ---------- */
.gcross{color:#1E9E4A;font-weight:700;margin-right:4px}
.chip.check{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:.93rem;color:var(--ink)}
.chip.check input{margin:0;width:18px;height:18px}
.chip.check:has(input:checked){background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.lvl{display:inline-block;min-width:2.2em;text-align:center;border-radius:999px;padding:1px 8px;font-weight:700;font-size:.85rem}
.lvl.l0{background:var(--accent-soft);color:var(--ink)}.lvl.l1{background:var(--sun-soft);color:var(--ink)}.lvl.l2{background:var(--orange);color:#fff}.lvl.l3{background:var(--red);color:#fff}
.range{display:flex;align-items:center;gap:12px}.range input{flex:1;padding:0;accent-color:var(--accent)}.range output{font-weight:700;font-size:1.3rem;min-width:3.2em;text-align:right}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.seg button{flex:1;min-width:80px;padding:9px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
#note{position:fixed;left:14px;right:92px;max-width:360px;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:rotate(-1.2deg);background:#FFF6BF;color:#3A3420;border-radius:4px 4px 14px 4px;padding:16px 16px 12px;box-shadow:0 10px 24px rgba(0,0,0,.22),0 2px 4px rgba(0,0,0,.12);z-index:90;display:none}
#note.show{display:block;animation:noteIn .35s ease-out}
#note h3{margin:0 0 6px;font-size:1rem}#note p{margin:6px 0;font-size:.95rem}
#note .x{position:absolute;top:4px;right:6px;border:0;background:none;font-size:1.2rem;color:#6B6040;cursor:pointer;padding:4px 8px}
#note .bar{margin:10px 0 0;gap:6px}#note .btn{padding:7px 12px;font-size:.88rem}
#note .btn.ghost{background:transparent;color:#3A3420;border-color:#C9B970}
@keyframes noteIn{from{opacity:0;transform:translateY(16px) rotate(-1.2deg)}to{opacity:1;transform:rotate(-1.2deg)}}
@media (prefers-reduced-motion:reduce){#note.show{animation:none}}
html.locked #note{visibility:hidden}
.histv{border-left:4px solid var(--accent);padding:2px 0 2px 12px;margin:12px 0}
.histv ul{margin:6px 0 0;padding-left:20px}.histv li{margin:4px 0}
/* ---------- V15 ---------- */
.spk{padding:6px 12px;font-size:.88rem}
.badge.todo{background:var(--sun-soft);color:var(--ink)}
.badge.ali{background:#DDF3E3;color:#1D5B33}
.rep.done .ttl{text-decoration:line-through;color:var(--muted)}
#speakBar,#askBar{position:fixed;left:14px;right:92px;max-width:420px;z-index:95;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;box-shadow:0 8px 20px rgba(0,0,0,.25);display:none;align-items:center;gap:8px;flex-wrap:wrap}

#askBar{bottom:calc(84px + env(safe-area-inset-bottom,0px))}

#speakBar button,#askBar button{border:1px solid var(--bg);background:transparent;color:var(--bg);border-radius:999px;padding:6px 12px;font:inherit;font-size:.88rem;cursor:pointer}
#askBar button.main{background:var(--bg);color:var(--ink);font-weight:700}
html.locked #speakBar,html.locked #askBar{visibility:hidden}
.toc .chips{margin:0}

details.jobc>summary .chev{color:var(--muted);transition:transform .2s}
details.jobc[open]>summary .chev{transform:rotate(90deg)}
.bagh{display:flex;justify-content:space-between;align-items:center;gap:8px}

.sheet{max-height:calc(var(--vvh,100dvh) * .92);padding-bottom:0}
.sheet::after{content:"";display:block;height:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet .actions{position:sticky;bottom:0;background:var(--surface);margin:18px -18px 0;padding:12px 18px;border-top:1px solid var(--line);z-index:3;box-shadow:0 -6px 12px rgba(0,0,0,.06)}
#lockBio{margin-top:12px}
.example{border:1.5px dashed var(--line);border-radius:12px;padding:10px 14px;margin:10px 0;color:var(--muted);font-style:italic;font-size:.93rem}
.example b{font-style:normal}
.qparts .chip{padding:10px 16px;font-size:1rem;font-weight:700;border-width:2px}
details.sub{border-top:1px solid var(--line);margin-top:12px}
details.sub>summary{font-weight:700;padding:12px 0;cursor:pointer;color:var(--accent)}
.outs .badge{margin:2px 4px 0 0}
.sorsbtn{width:100%;font-size:1.05rem;padding:14px}

.added{font-size:.78rem}
.repadd{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.selon{background:var(--accent-soft);border-radius:8px}

.medal{font-size:3rem;line-height:1.1}
.sens{display:inline-block;min-width:1.8em;text-align:center;border-radius:999px;padding:1px 8px;font-weight:700;font-size:.85rem;color:#fff}

.seg button.sens.on{outline:3px solid var(--ink);outline-offset:2px;transform:scale(1.08)}
tr.mark td{background:var(--accent-soft);font-weight:700;color:var(--accent)}
.daynav{display:flex;align-items:center;gap:8px;margin:10px 0}
.daynav input{flex:1}
.gone{opacity:.65}
.gone b,.gone .ttl{text-decoration:line-through;color:var(--muted)}
#alertPop{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);padding:16px}
#alertPop.show{display:flex}
#alertPop .card{width:100%;max-width:420px;border-radius:18px;padding:22px 20px;color:#fff;background:#C8433C;box-shadow:0 14px 40px rgba(0,0,0,.35);text-align:center}

#alertPop p{margin:8px 0;font-size:1.12rem}
#alertPop .btn{background:#fff;color:#1D2A31;border-color:#fff}
#alertPop .btn.ghost{background:transparent;color:#fff;border-color:#fff}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}

.lvlA{display:inline-block;border-radius:999px;padding:1px 8px;font-size:.8rem;color:#fff;margin-left:6px}
.lvlA.normal{background:#C8661F}.lvlA.important{background:#C8433C}.lvlA.urgent{background:#8E1B16}

function moveProj(id,dir){
  const arr=state.projects;const i=arr.findIndex(p=>p.id===id);if(i<0)return;

function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/[,;]/g,m=>"\\"+m).replace(/\n/g,"\\n");}
function icsLocal(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00";}
function downloadFile(name,content,type){
  const blob=new Blob([content],{type});const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function makeIcs(t,atTime){
  const stamp=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Carnet Pilote//FR","BEGIN:VEVENT","UID:"+t.id+"@carnet-pilote","DTSTAMP:"+stamp];
  if(t.time){const s=new Date(t.date+"T"+t.time+":00");const e=new Date(s.getTime()+(atTime?900000:3600000));L.push("DTSTART:"+icsLocal(s),"DTEND:"+icsLocal(e));}
  else{const s=new Date(t.date+"T12:00:00");const e=new Date(s.getTime()+86400000);L.push("DTSTART;VALUE=DATE:"+t.date.replace(/-/g,""),"DTEND;VALUE=DATE:"+icsLocal(e).slice(0,8));}
  L.push("SUMMARY:"+icsEsc(t.title),"DESCRIPTION:"+icsEsc([t.domain,t.note].filter(Boolean).join(" : ")));
  const alarm=tr=>L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(t.title),"TRIGGER:"+tr,"END:VALARM");
  if(atTime)alarm("PT0M");else{alarm("-P1D");if(t.time)alarm("-PT1H");}
  L.push("END:VEVENT","END:VCALENDAR");
  return L.join("\r\n");
}

const spkBtn=(id,small)=>small?`<button class="icon noread" data-act="speak" data-id="${id}" aria-label="Écouter">🔊</button>`:`<button class="btn ghost spk noread" data-act="speak" data-id="${id}">🔊 Écouter</button>`;
const EMO_WORDS=[["🔊","haut-parleur"],["✎","crayon"],["🗑","poubelle"],["⋮","trois petits points"],["🎤","micro"],["⏹","Arrêter"],["☑️","case cochée"]];
function cleanSpeech(t){t=String(t||"");EMO_WORDS.forEach(([e,w])=>{t=t.replace(new RegExp("(petit|le|la|un|une)\\s*"+e.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),"$1 "+w);});return t.replace(/[\p{Extended_Pictographic}️‍⃣]/gu," ").replace(/[•·|›‹▾▸✕✎🗑]/g," ").replace(/\s*\.\s*(\.\s*)+/g,". ").replace(/:\s*\./g,":").replace(/\s{2,}/g," ").replace(/^\s*\.\s*/,"").trim();}
function textOf(el){
  if(!el)return "";const c=el.cloneNode(true);
  c.querySelectorAll("button,input,select,textarea,.noread,.chev,.x,script,style").forEach(n=>n.remove());
  c.querySelectorAll("p,div,li,h2,h3,h4,tr,summary,label").forEach(n=>n.append(document.createTextNode(". ")));
  c.querySelectorAll("td,th").forEach(n=>n.append(document.createTextNode(", ")));
  return c.textContent;
}
function speak(txt){
  if(!("speechSynthesis" in window)||!window.SpeechSynthesisUtterance){toast("La lecture à voix haute n’est pas disponible sur cet appareil");return;}
  const t=cleanSpeech(txt);if(!t){toast("Rien à lire ici");return;}
  try{speechSynthesis.cancel();}catch(e){}
  const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=(RATES[state.settings.rate]||RATES.normale)[1];
  const v=(speechSynthesis.getVoices()||[]).find(x=>/^fr(-|_|$)/i.test(x.lang));if(v)u.voice=v;
  u.onend=u.onerror=()=>$("#speakBar").classList.remove("show");
  $("#speakBar").classList.add("show");speechSynthesis.speak(u);
}

const dupKey=s=>norm(s).replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(Boolean).map(w=>w.length>3?w.replace(/s$/,""):w).join(" ");
function dupOf(list,name,id,field){
  const k=dupKey(name);if(!k)return null;
  return list.find(x=>x.id!==id&&(()=>{const o=dupKey(x[field||"name"]);return o===k||(k.length>=6&&o.length>=6&&(o.includes(k)||k.includes(o)));})());
}

const TOPBTN=`<div class="bar noread" style="margin:12px 0 0"><button class="btn ghost" data-act="jumpTop">↑ Sommaire</button></div>`;
function withToc(html){
  const items=[];let n=0;
  const out=html.split('<section class="block"').map((chunk,i)=>{
    if(i===0)return chunk;
    const m=chunk.match(/^( id="([^"]+)")?>(\s*<div class="phead">)?\s*<h3>([\s\S]*?)<\/h3>/);
    if(!m)return '<section class="block"'+chunk;
    const id=m[2]||("sec"+(++n));items.push([id,m[4].replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim()]);
    let c=m[1]?chunk:' id="'+id+'"'+chunk;const e=c.indexOf("</section>");if(e>=0)c=c.slice(0,e)+TOPBTN+c.slice(e);
    return '<section class="block"'+c;
  }).join("");
  if(items.length<3)return out;
  const nav=`<nav class="block toc noread" id="tocNav" aria-label="Sommaire"><h3>Aller à</h3><div class="chips wrap">${items.map(([id,l])=>`<button class="chip" data-act="jump" data-id="${id}">${esc(l)}</button>`).join("")}</div></nav>`;
  const p=out.indexOf("</p>");return p<0?nav+out:out.slice(0,p+4)+nav+out.slice(p+4);
}

const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return Uint8Array.from(atob(s),c=>c.charCodeAt(0));};
const rnd=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return a;};
async function bioAvailable(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());}catch(e){return false;}}
async function bioEnable(){
  if(!await bioAvailable()){toast("L’empreinte n’est pas disponible ici. Elle marche dans l’application installée, sur ton téléphone.",5000);return;}
  try{const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:"Carnet Pilote"},user:{id:rnd(16),name:"carnet-pilote",displayName:state.name||"Carnet Pilote"},
      pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"discouraged"},timeout:60000}});
    state.settings.bioId=b64(c.rawId);save();render();toast("Empreinte activée 👆");}
  catch(e){toast("Empreinte non activée : "+(e&&e.name==="NotAllowedError"?"annulé":"essaie encore"),4000);}
}
async function bioUnlock(){
  const id=state.settings.bioId;if(!id)return false;
  try{await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:"public-key",id:unb64(id)}],userVerification:"required",timeout:60000}});return true;}
  catch(e){return false;}
}

const SKILL_PROMPT="Voici ce que j’ai fait récemment, extrait de mon Carnet Pilote. Traduis-le en compétences utiles pour un CV ou un recrutement (savoir-faire, savoir-être, compétences numériques). Réponds avec une compétence par ligne, sous la forme « Compétence : exemple concret qui la prouve [technique] » ou « … [transversale] ». [technique] = savoir-faire, outil, compétence numérique ou de métier ; [transversale] = savoir-être, organisation, utile dans tous les métiers. Reste simple et concis, sans titre ni introduction.";
function skillsSource(){

  const j=state.journal.filter(x=>ok(x.date));
  if(j.length){L.push("","JOURNAL DE BORD :");j.forEach(x=>L.push("- "+fmt(x.date)+" : "+x.text.replace(/\n/g," ")));}
  const w=state.work.filter(x=>ok(x.date)&&x.cat!=="Visite");
  if(w.length){L.push("","DURÉE DE TRAVAIL :");w.forEach(x=>L.push("- "+fmt(x.date)+", "+[x.tool,x.cat,x.details].filter(Boolean).join(", ")+" ("+fmtDur(x.min)+")"));}
  const done=state.tasks.filter(t=>t.done&&ok(t.doneDate||t.created));
  if(done.length){L.push("","TÂCHES TERMINÉES :");done.forEach(t=>L.push("- "+t.title+" ("+t.domain+")"));}
  const b=state.projects.filter(p=>p.status==="termine"&&(p.bilan||p.notes));
  if(b.length){L.push("","BILANS DE PROJETS TERMINÉS :");b.forEach(p=>L.push("- "+p.name+" : "+[p.bilan,p.notes].filter(Boolean).join(" ").replace(/\n/g," ")));}
  const a=state.projects.filter(p=>p.status==="actif");
  if(a.length){L.push("","PROJETS EN COURS :");a.forEach(p=>L.push("- "+p.name+(p.notes?" : "+p.notes.replace(/\n/g," "):"")));}
  return L.join("\n");
}
const SK_TYPES={tech:"🛠️ Technique",transv:"🤝 Transversale"};
function skType(raw){const n=norm(raw);if(/transv|savoir.?etre/.test(n))return "transv";if(/techn|savoir.?faire/.test(n))return "tech";return "";}
function cutType(l){const m=l.match(/\s*[\[(]\s*(techniques?|transversales?|savoir.?faire|savoir.?[eê]tre)\s*[\])]\s*\.?\s*$/i);return m?{l:l.slice(0,m.index).trim(),type:skType(m[1])}:{l,type:""};}
function parseSkills(raw){
  const items=[];
  raw.split(/\n/).forEach(line=>{
    let l=line.trim();if(!l||/^\|?\s*:?-{3,}/.test(l))return;
    if(l.includes("|")){const c=l.split("|").map(x=>x.replace(/\*\*/g,"").trim()).filter(Boolean);if(c.length>=1&&!/^comp[ée]tence/i.test(c[0])){const ct=cutType(c[1]||"");items.push({name:c[0],proof:ct.l,type:ct.type||skType(c[2]||"")});}return;}
    l=l.replace(/^([-*•]|\d+[.)])\s*/,"").replace(/\*\*/g,"").trim();
    const ct=cutType(l);l=ct.l;const ty=ct.type;
    const i=l.indexOf(":");
    if(i===l.length-1)return;
    if(i>0)items.push({name:l.slice(0,i).trim(),proof:l.slice(i+1).trim(),type:ty});else if(l)items.push({name:l,proof:"",type:ty});
  });
  return items;
}

function parseJob(raw){
  const have=[],todo=[];let mode="";
  raw.split(/\n/).forEach(line=>{
    let l=line.replace(/^[#>*\s]+|[*\s]+$/g,"").replace(/\*\*/g,"").trim();if(!l)return;
    const n=norm(l),head=!/^([-•]|\d+[.)])\s/.test(line.trim())&&(l.indexOf(":")<0||/:$/.test(l))&&l.length<60;
    if(head&&/deja|transferable|acquis/.test(n)){mode="have";return;}
    if(head&&/developp|manque|a acquerir/.test(n)){mode="todo";return;}
    if(!mode)return;
    l=l.replace(/^([-*•]|\d+[.)])\s*/,"").trim();const i=l.indexOf(":");
    const it={name:(i>0?l.slice(0,i):l).trim(),note:i>0?l.slice(i+1).trim():""};
    if(it.name)(mode==="have"?have:todo).push(mode==="todo"?Object.assign(it,{done:false}):it);
  });
  return {have,todo};
}

function skSame(a,b){
  const fa=skWords(a,true),fb=skWords(b,true);if(!fa.length||!fb.length||fa[0]!==fb[0])return false;
  const wa=skWords(a),wb=skWords(b);

function skillGroups(){

  list.forEach(k=>{if(k.link&&k.link!=="none"&&par[k.link])join(k.link,k.id);});
  list.forEach((a,i)=>{if(a.link==="none")return;list.slice(i+1).forEach(b=>{if(b.link!=="none"&&!(a.link&&a.link!=="none")&&!(b.link&&b.link!=="none")&&skSame(a.name,b.name))join(a.id,b.id);});});

    <p><b>Projets :</b> deux espaces, 💼 professionnel et 🏠 personnel, jusqu’à 3 actifs chacun. ☆ pour choisir tes 3 priorités du moment, sur l’Accueil. Un projet terminé a un « Bilan ». Jusqu’à 3 liens Drive par projet : sans nom, le lien prend le nom du projet.</p>
    <p><b>Loisirs :</b> ton espace ressource, jusqu’à 3 actifs. Il peut aussi avoir une priorité ⭐.</p>
    <p><b>Reprendre ici</b> (Accueil) : une chose par ligne, coche ce qui est fait. Quand tout est barré, la liste s’efface toute seule (« Annuler » quelques secondes).</p>
    <p><b>✚ Santé :</b> le suivi de tes douleurs, tes essentiels (ce qui t’aide, où c’est rangé) et tes choix validés.</p>
    <p><b>🏠 Quotidien :</b> astuces, alimentation, vêtements & sacs. Touche la partie voulue sous le titre, ou tape son nom dans la recherche.</p>
    <p><b>📓 Carnets :</b> dans Projets, choisis le type « Carnet » pour noter sa dernière version et son étape.</p>
    <p><b>Formulaires :</b> Enregistrer et Annuler restent en bas. Si tu fermes sans enregistrer, le carnet te demande.</p>
    <p><b>Doublons :</b> si tu ajoutes une chose déjà notée, le carnet te prévient et te propose de la voir.</p>
    <p><b>Tâches & RDV :</b> par domaine (plusieurs possibles), avec code couleur et « Où j’en suis » (à faire, à suivre, fait). Les tâches du même nom sont regroupées. La date d’ajout est notée toute seule. Dans « Projet ou loisir lié », « ➕ Autre… » crée un nouveau projet directement.</p>
    <p><b>Fichiers Drive :</b> tes dossiers 📁 et fichiers 📄, avec mots-clés.</p>
    <p><b>Journal de bord :</b> tes notes, le tableau de durée de travail et les totaux par catégorie (ex. temps de création d’un carnet).</p>
    <p><b>Compétences :</b> ce que tu fais, traduit pour ton CV.</p>
    <p><b>🔒 Verrouiller :</b> le bouton en haut cache le carnet tout de suite. Il se verrouille aussi tout seul quand tu ne le touches plus, ou quand tu quittes Chrome (durées dans Paramètres).</p>
    <p><b>Recherche :</b> tape un mot proche : elle cherche partout, même dans des mots-clés cachés.</p>
    <p><b>🏆 Mes victoires :</b> tes tâches faites, par domaine et par projet, avec des médailles.</p>
    <p><b>✎ Renommer un onglet :</b> ⚙️ Paramètres, Ordre et nom des onglets.</p>
    <p class="meta">Tout le contenu est modifiable par toi : listes, projets, durées, fréquences, ordre des onglets. Tu ne repasses par Claude que pour une nouvelle fonction.</p>`],
  ["phase","🌗 Selon ma phase",`<p><b>Phase haute :</b> je note mes idées. Je ne lance rien de nouveau. Je trie le lendemain.</p>
    <p><b>Phase basse :</b> je relis ce que j’ai déjà fait. Une seule micro-action de 10 minutes. Aucune grande décision.</p>
    <p><b>Neutre :</b> une tâche à la fois, avec le minuteur de pauses.</p>`],
  ["boutons","🔘 Les 3 boutons flottants",`<p><span class="pic">⏱</span> Chronomètre : démarre tout seul en « Visite ». Touche-le pour choisir l’outil et la nature du travail (plusieurs possibles). Si tu rouvres le carnet peu après l’avoir fermé, la séance continue. La sauvegarde enregistre aussi la séance en cours.</p>
    <p><span class="pic">🍅</span> Minuteur Pomodoro : ${s.cycles} cycles de ${s.pomo} min (💪 ✍️, 🎵 🎶 quand il te propose de la musique), petite pause de ${s.pause} min (⏳ 🏃‍♀️ 👀), puis grande pause de ${s.longPause} min. « Passer la pause » : <b>2 fois de suite maximum</b>.</p>
    <p><span class="pic">📌</span> Punaise : <b>rouge</b> avec un chiffre pour une note urgente ; petite feuille 🌿 pour un <b>rappel doux</b> (sauvegarde, point compétences) ; pâle quand tout va bien.</p>
    <p class="meta">Tu peux les déplacer au doigt.</p>`],
  ["agenda","🔔 Rappels et agenda",`<p>Le carnet ne peut pas t’envoyer de notification. Pour un rappel : touche 🔔 sur une tâche datée, puis ouvre le fichier téléchargé avec ton agenda. Ou demande à Claude de l’ajouter directement à ton agenda.</p>`],
  ["competences","🏅 Faire le point compétences",`<p>Tous les ${s.remSkills} jours, la punaise 🌿 te le rappelle. Dans l’onglet <b>Compétences</b> :</p>
    <ol class="steps"><li><span>Touche « Préparer et copier le texte ».</span></li><li><span>Colle-le à Claude.</span></li><li><span>Colle sa réponse dans le carnet, puis « Ajouter ». Une compétence déjà dans ta liste (même nom, même exemple) est ignorée.</span></li></ol>
    <p><b>📋 Détail</b> : ta liste complète, une ligne par compétence et par date. <b>🧩 Synthèse</b> : les compétences proches regroupées, avec toutes leurs dates à la suite. Le Détail reste intact : retrouve chaque date dans ton journal de bord.</p>
    <p><b>🏷️ Étiquettes</b> : 🛠️ <b>technique</b> (savoir-faire, outil, numérique) ou 🤝 <b>transversale</b> (savoir-être, organisation, utile partout). Les filtres montrent un seul type, avec leur nombre entre parenthèses. Pour les compétences sans étiquette : « Étiqueter avec Claude », même aller-retour en 3 étapes.</p>
    <p><b>🎯 Métier visé</b> : écris un métier, choisis avec quoi comparer (ton ancien métier, tes compétences du carnet, ou les deux), prépare le texte, colle-le à Claude, puis colle sa réponse. Tu vois tes compétences <b>transférables</b> (« J’ai déjà ») et celles « À développer ». Coche ⬜ quand tu en acquiers une. « 📋 Copier » copie la comparaison, par exemple pour ton tableau de reconversion.</p>
    <p><b>▾ Replier</b> « Ma liste » pour arriver plus vite à « Métier visé ». « ▸ Déplier » la rouvre.</p>
    <p>Un regroupement à corriger ? ✎ sur la compétence, puis « Regrouper dans la Synthèse » : automatique, ne pas regrouper, ou avec une autre.</p>
    <p class="meta">« Copier » remplit aussi une case de texte : si le téléphone bloque la copie, appui long dessus, « Tout sélectionner », « Copier ».</p>`],
  ["maj","🔄 Mettre à jour le carnet (en ligne)",`<ol class="steps">
    <li><span><span class="pic">⚙️</span> Par sécurité : Paramètres, <b>Sauvegarder</b>.</span></li>
    <li><span><span class="pic">💬</span> Envoie ta version actuelle à Claude (projet Carnet Pilote) avec le message ci-dessous.</span></li>
    <li><span><span class="pic">📄</span> Claude te donne <b>2 fichiers</b> : la nouvelle version, ex. <b>V19Carnet_Pilote.html</b> (version d’abord, à ranger sur le Drive) et <b>index.html</b> (pour GitHub). Télécharge les deux.</span></li>
    <li><span><span class="pic">🌐</span> Chrome : <b>github.com/carnet-personnalise/pilote-yas</b>. Touche les <b>trois petits points ⋮</b>, puis <b>Upload files</b>.</span></li>
    <li><span><span class="pic">⬆️</span> <b>Choose your files</b> : choisis <b>index.html</b> dans Téléchargements, puis <b>Commit changes</b>. Il remplace l’ancien tout seul.</span></li>
    <li><span><span class="pic">⏳</span> Attends <b>2 à 5 minutes</b>.</span></li>
    <li><span><span class="pic">📱</span> Ferme l’application Carnet Pilote et rouvre-la. Vérifie le numéro dans ⚙️ Paramètres, Version.</span></li>
    <li><span><span class="pic">✅</span> <b>Rien à restaurer</b> : tes données restent, car l’adresse ne change pas.</span></li>
    <li><span><span class="pic">☁️</span> Une fois par semaine, une copie du .json dans ton Drive : ta ceinture de sécurité.</span></li></ol>
    <p class="meta">Toujours l’ancienne version ? Attends encore un peu, puis ferme et rouvre l’application. Ne touche jamais aux autres fichiers du dépôt (manifest.json, sw.js, icônes).</p>
    <label for="promptCopy">Message à copier pour Claude</label><textarea id="promptCopy" rows="3" readonly>${esc(UPDATE_PROMPT)}</textarea>
    <div class="bar" style="margin:10px 0 0"><button class="btn ghost" data-act="copyPrompt">Copier le message</button></div>`],
  ["idee","💡 J’ai une idée d’amélioration",`<ol class="steps">
    <li><span><span class="pic">💬</span> Je vais dans le <b>bon projet Claude</b> (ex. « Carnet Pilote » pour ce carnet), et je dis mon idée directement à Claude.</span></li>
    <li><span><span class="pic">⏹️</span> Claude est en train de préparer une version ? J’appuie sur <b>stop</b>, je donne l’idée, il reprend. Une fois le fichier envoyé, l’idée va dans la version suivante.</span></li>
    <li><span><span class="pic">✅</span> Ce qui marche bien devient une <b>consigne</b> : je demande à Claude de l’écrire, puis je la colle dans les <b>instructions du projet</b>. Plus besoin de la répéter.</span></li>
    <li><span><span class="pic">🆕</span> Pour un <b>nouveau projet</b> (autre carnet, prestation…), je repars des instructions d’un projet qui fonctionne, et de « Mes règles pour tout nouveau carnet » : ce qui est fait n’est plus à refaire.</span></li></ol>
    <p class="meta">Le Pense-bête 🟨 te rappelle ces étapes de temps en temps.</p>`],
  ["voix","🔊 Écouter au lieu de lire",`<p>Quand lire te fatigue : touche <b>🔊 Écouter</b> (ou le petit 🔊 sur une ligne). Le carnet lit seulement cette partie, sans les émoticônes ni les boutons.</p>
    <p><b>⏹ Arrêter</b> : le bouton noir qui apparaît pendant la lecture.</p>
    <p>Vitesse, et lecture automatique du Pense-bête : ⚙️ Paramètres, Lecture à voix haute.</p>
    <p class="meta">Pour écrire sans taper : le micro 🎤 du clavier de ton téléphone.</p>`],
  ["quotidien","🏠 Mon quotidien",`<p><b>💡 Astuces :</b> ce qui est efficace et validé. Ajoute des <b>mots cachés</b> : la recherche retrouvera l’astuce même si tu as oublié le mot exact (ex. « papiers » retrouve le filigrane).</p>
    <p><b>🥗 Alimentation :</b> préférés, toujours à la maison, alicaments. Coche 🌿 Alicament : il apparaît aussi dans ✚ Santé. Une seule fiche pour les deux.</p>
    <p><b>👗 Vêtements & sacs :</b> où est rangé chaque vêtement, tes sacs prêts à cocher avant de partir, tes astuces vêtements.</p>
    <p><b>💄 Beauté :</b> tes soins et produits (pour quoi, fréquence, comment, où, combien, rangé où).</p>
    <p><b>🏃‍♀️ APA perso :</b> tes séances d’activité physique (date, activité, durée, ressenti), avec le total sur 7 et 30 jours.</p>
    <p><b>🤝 Prêté :</b> ce que tu as prêté ou emprunté, à qui, et le retour prévu. « ✓ Rendu » : la ligne est barrée et rangée à part.</p>
    <p><b>💳 Abonnements :</b> IA et autres, tarif, dates, total par mois. Une alerte apparaît 7 jours avant la fin.</p>
    <p>Une partie très utilisée peut devenir un <b>onglet à part</b> : ⚙️ Paramètres, Mon quotidien.</p>`],
  ["sors","👗 Je sors : quoi prendre ?",`<ol class="steps">
    <li><span><span class="pic">👗</span> Sur l’Accueil, touche <b>« Je sors : quoi prendre ? »</b> (ou tape « sortie » dans la recherche).</span></li>
    <li><span><span class="pic">📍</span> Choisis la sortie : plage, randonnée… ou ➕ Autre…</span></li>
    <li><span><span class="pic">📝</span> Lis ta <b>fiche mémo</b> (météo, crème solaire…), puis regarde ce que le carnet te propose.</span></li>
    <li><span><span class="pic">🧠</span> Essaie de te souvenir où c’est rangé. Si tu bloques, touche <b>« Où est-ce ? »</b>. Le rangement n’est noté que si la chose n’est pas à sa place habituelle.</span></li>
    <li><span><span class="pic">🎒</span> Coche ce qui est dans le sac.</span></li></ol>
    <p class="meta">Pour qu’un élément apparaisse : dans Quotidien, Vêtements & sacs, ouvre sa fiche et coche ses sorties. Pareil pour un sac : « Modifier ».</p>`],
  ["mange","🥗 Qu’est-ce que je mange ?",`<ol class="steps">
    <li><span><span class="pic">🥗</span> Sur l’Accueil, touche <b>« Qu’est-ce que je mange ? »</b> (ou tape « faim » ou « manger » dans la recherche).</span></li>
    <li><span><span class="pic">✋</span> Choisis ton envie : petite faim, collation, encas santé, repas léger… ou 🌿 Alicaments.</span></li>
    <li><span><span class="pic">📝</span> Lis ta fiche mémo, puis regarde ce que le carnet te propose.</span></li></ol>
    <p class="meta">Pour qu’un aliment apparaisse : dans Quotidien, Alimentation, ouvre sa fiche et coche ses envies.</p>`],
  ["bio","👆 Ouvrir avec mon empreinte",`<p>⚙️ Paramètres, Mot de passe : <b>Activer l’empreinte</b>, puis pose ton doigt.</p>
    <p>Ensuite, sur l’écran du mot de passe : <b>« Ouvrir avec mon empreinte »</b>. Le mot de passe marche toujours, en secours.</p>
    <p class="meta">Ça marche dans l’application installée (en ligne). Si tu changes de téléphone, réactive l’empreinte.</p>`],
  ["ajout","➕ Ajouter des éléments dictés à Claude",`<ol class="steps">
    <li><span><span class="pic">🎤</span> Dans le projet Claude « Carnet Pilote », dicte ce que tu veux ajouter (ex. « ajoute le Revitive dans mes essentiels »).</span></li>
    <li><span><span class="pic">📄</span> Claude te donne un petit fichier <b>.json</b>. Télécharge-le.</span></li>
    <li><span><span class="pic">⚙️</span> Paramètres, <b>Ajouter des éléments</b>, choisis le fichier.</span></li>
    <li><span><span class="pic">✏️</span> Ce qui manque (ex. où c’est rangé) est marqué <b>À compléter</b>. Le Pense-bête te le rappelle.</span></li></ol>
    <p class="meta">⚠️ Ce fichier est privé : ne le dépose jamais sur GitHub. Les doublons sont ignorés.</p>`],
  ["sante","✚ Santé : suivi et essentiels",`<p><b>📋 Suivi :</b> « Noter une douleur » : où, intensité de 0 à 10, type, déclencheur, ce qui soulage. Date et heure se remplissent toutes seules. Après 3 notes, un résumé sur 30 jours apparaît.</p>
    <p><b>🧰 Mes essentiels :</b> ce que j’utilise, à quoi ça sert, <b>où c’est rangé</b>. Chaque essentiel s’ajoute aussi à la liste « Ce qui soulage ».</p>
    <p><b>✅ Mes choix validés :</b> ce qui marche pour toi, à garder pour la prochaine fois (ex. tes prochaines lunettes).</p>
    <p><b>🟨 Pense-bête :</b> de temps en temps à l’ouverture, il te rappelle un essentiel, une astuce, ou ce qui reste à compléter. Fréquence dans ⚙️ Paramètres.</p>
    <p class="meta">Ces notes restent dans ton téléphone (et dans ton .json). Elles ne sont jamais en ligne.</p>`],
  ["rep18","☑️ Reprendre ici : sujets et prompt",`<p>La case pour écrire est <b>en haut</b>, et chaque nouvelle ligne arrive en haut. La date d’ajout est notée en petit. ✎ pour corriger une ligne.</p>
    <p><b>Sujet :</b> choisis un projet ou un domaine, ou laisse « automatique » : le carnet cherche un nom de projet dans ta phrase. « 🗂️ Par sujet » regroupe les lignes du même projet.</p>
    <p><b>📋 Préparer un prompt :</b> coche ⬜ une ou plusieurs lignes, puis « Copier pour Claude ». Colle le texte dans le projet Claude « Carnet Pilote ».</p>
    <p class="meta">▾ Replier cache la liste et garde le nombre de lignes à reprendre.</p>`],
  ["rappels","🔴 Rappels importants",`<ol class="steps"><li><span>Touche la punaise 📌, puis <b>« Ajouter un rappel important »</b>.</span></li>
    <li><span>Écris ce qu’il ne faut pas oublier. Choisis l’<b>importance</b> (normal en orange, important en rouge, urgent en rouge foncé) et la <b>fréquence</b>.</span></li>
    <li><span>À l’ouverture du carnet, il s’affiche en grand. « Vu » le garde, « C’est réglé » le retire.</span></li></ol>
    <p class="meta">Différent du Pense-bête jaune 🟨, qui te rappelle doucement tes essentiels et ta méthode.</p>`],
  ["victoires","🏆 Mes victoires",`<p>L’onglet <b>Mes victoires</b> compte tes tâches faites et à faire : au total, par domaine et par projet, avec une barre de progression.</p>
    <p>Médailles : 🥉 5 tâches faites, 🥈 15, 🥇 30, 🏆 50, 👑 100. 🏅 quand toutes les tâches d’un domaine sont faites.</p>
    <p class="meta">En phase basse, c’est la page à relire.</p>`],
  ["mic","🚽 Calendrier mictionnel",`<ol class="steps"><li><span>✚ Santé, <b>Calendrier mictionnel</b>.</span></li>
    <li><span>Note l’heure du <b>lever</b> et du <b>coucher</b> du jour.</span></li>
    <li><span>À chaque passage aux toilettes : <b>🚽 Miction</b> (volume, besoin de 0 à 4, fuite, protection). À chaque boisson : <b>🥤 Boisson</b>. L’heure se remplit toute seule.</span></li>
    <li><span>Le carnet fait le <b>résumé du jour</b> (mictions de jour et de nuit 🌙, totaux).</span></li>
    <li><span><b>📋 Copier ce jour</b>, ou tous les jours, pour l’envoyer ou l’imprimer.</span></li></ol>
    <p class="meta">Ces notes restent dans ton téléphone et dans ton .json, jamais en ligne.</p>`],
  ["regles","📋 Mes règles pour tout nouveau carnet HTML",`<p>Avant de créer un nouveau carnet (ou de faire évoluer celui de Kay Numérique), copie ce texte et colle-le à Claude <b>avant</b> de décrire ton besoin.</p>
    <label for="basePrompt">Règles communes à copier</label><textarea id="basePrompt" rows="8" readonly>${esc(BASE_PROMPT)}</textarea>
    <div class="bar" style="margin:10px 0 0"><button class="btn ghost" data-act="copyBase">Copier les règles</button></div>`],
  ["appli","📲 Mon carnet en application",`<p>Le carnet est en ligne à l’adresse <b>carnet-personnalise.github.io/pilote-yas</b>. Il s’installe comme une vraie application, avec son icône « Yas ».</p>
    <ol class="steps">
    <li><span><span class="pic">🌐</span> Ouvre l’adresse dans <b>Chrome</b>.</span></li>
    <li><span><span class="pic">⋮</span> Menu ⋮, puis <b>Installer l’application</b> (ou « Ajouter à l’écran d’accueil »), puis <b>Installer</b>.</span></li>
    <li><span><span class="pic">📱</span> Ouvre-la toujours depuis l’icône <b>Carnet Pilote</b> de ton écran.</span></li>
    <li><span><span class="pic">⚙️</span> La première fois seulement : Paramètres, <b>Restaurer</b> ta sauvegarde .json.</span></li></ol>
    <p class="meta">Sans Internet, l’application s’ouvre quand même avec la dernière version gardée dans le téléphone.</p>`],
  ["enligne","🌐 Mettre un carnet en ligne (GitHub Pages)",`<p>À faire une seule fois par carnet (le tien, celui de Léa, celui d’un client).</p>
    <p><b>Les fichiers d’un dépôt :</b></p>
    <div class="tablewrap"><table style="min-width:0"><thead><tr><th>Fichier</th><th>À quoi il sert</th></tr></thead><tbody>
    <tr><td>index.html</td><td>Le carnet lui-même (le seul qui change à chaque version)</td></tr>
    <tr><td>manifest.json</td><td>La carte d’identité de l’application : nom, couleurs, icônes</td></tr>
    <tr><td>sw.js</td><td>Le Service Worker : fait reconnaître l’application et garde une copie pour ouvrir sans Internet</td></tr>
    <tr><td>icon-192.png, icon-512.png, icon-maskable-512.png</td><td>Les icônes de l’écran d’accueil (le logo)</td></tr></tbody></table></div>
    <ol class="steps">
    <li><span><span class="pic">👤</span> Compte GitHub : <b>carnet-personnalise</b>.</span></li>
    <li><span><span class="pic">➕</span> <b>+</b>, <b>New repository</b>. Nom court (ex. <b>pilote</b>, <b>lea</b>, prénom du client). <b>Public</b>. <b>Create repository</b>.</span></li>
    <li><span><span class="pic">⬆️</span> <b>uploading an existing file</b> : ajoute les 6 fichiers, puis <b>Commit changes</b>.</span></li>
    <li><span><span class="pic">⚙️</span> <b>Settings</b>, <b>Pages</b>. Branch : <b>main</b> et <b>/(root)</b>, puis <b>Save</b>.</span></li>
    <li><span><span class="pic">⏳</span> Attends 2 à 5 minutes. Adresse : <b>carnet-personnalise.github.io/nom-du-dépôt</b>.</span></li>
    <li><span><span class="pic">📲</span> Installe l’application (partie « Mon carnet en application »).</span></li></ol>
    <p class="meta">⚠️ Le dépôt est public : n’écris rien de personnel dans le fichier. Ce que tu tapes dans le carnet reste dans ton téléphone.</p>`],
  ["important","⚠️ Important",`<p>Tes données restent dans le téléphone, liées à l’adresse du carnet. Si tu vides les données de Chrome, désinstalles l’application ou changes de téléphone, le .json te permet de tout retrouver.</p>
    <p>Le fichier du carnet est <b>public</b> sur GitHub, mais tes données ne le sont pas : elles ne quittent jamais ton téléphone (sauf dans ton .json).</p>
    <p>Le mot de passe de départ (1234) est visible dans le fichier public : change-le dans ⚙️ Paramètres.</p>`]
  ];
  const toc=S.map(([k,t],i)=>`<button class="tocbtn${P.includes(k)?" pinned":""}" data-act="aideGo" data-id="${k}"><span class="num">${i+1}</span><span>${t}${P.includes(k)?" 🧷":""}</span></button>`).join("");
  return `<h2>🧠 Aide-mémoire</h2><p class="lead">Touche un numéro pour ouvrir la partie. Épingle 🧷 celles que tu veux garder ouvertes.</p>

/* ---------- chronomètre ---------- */
function recordWork(c,start,end){
  const min=Math.round((end-start-(c.gap||0))/60000);if(min<1)return 0;
  const s=new Date(start),e=new Date(end);
  addToList("tools",c.tool);splitCats(c.cat).forEach(x=>addToList("cats",x));
  state.work.push({id:uid(),date:isoOf(s),tool:c.tool||"",cat:c.cat||"",details:c.details||"",start:hm(s),end:hm(e),min});
  sortWork(state);return min;
}
const chronoMs=()=>Date.now()-state.chrono.start-(state.chrono.gap||0);
function startVisit(){const n=Date.now();state.chrono={running:true,start:n,lastSeen:n,gap:0,tool:"Carnet Pilote",cat:"Visite",details:""};save();}
let merged=false;
function bootChrono(){
  const c=state.chrono,now=Date.now(),g=(state.settings.mergeGap||0)*60000;
  if(c.running&&c.start&&c.lastSeen&&g>0&&now-c.lastSeen>=0&&now-c.lastSeen<=g){c.gap=(c.gap||0)+(now-c.lastSeen);c.lastSeen=now;merged=true;save();return;}
  if(c.running&&c.start){const end=c.lastSeen&&c.lastSeen>c.start?c.lastSeen:c.start;recordWork(c,c.start,end);}
  startVisit();
}
function chronoModal(){
  const c=state.chrono;
  const fields=`${selField("chTool","Outils","tools",c.tool)}${catChecks("chCat",c.cat)}
    <label for="chDet">Détails</label><textarea id="chDet" rows="2">${esc(c.details)}</textarea>`;
  if(c.running){
    openModal(`<h2>⏱ Chronomètre</h2><div class="big" id="chronoDisp">${hms(chronoMs())}</div>${fields}
    <p class="meta">Les changements s’enregistrent tout seuls.</p>
    <div class="actions"><button class="btn ghost" data-act="chronoStop">Arrêter et enregistrer</button><button class="btn ghost" data-act="chronoNext">Nouvelle séance</button><button class="btn" data-act="closeModal">Continuer</button></div>`,"chrono");
  }else{
    openModal(`<h2>⏱ Chronomètre</h2>${fields}
    <div class="actions"><button class="btn ghost" data-act="closeModal">Annuler</button><button class="btn" data-act="chronoStart">Démarrer</button></div>`,"chrono");
  }
}
function syncChronoField(id){
  const key={chTool:"tool",chCat:"cat",chToolO:"tool",chCatO:"cat",chDet:"details"}[id];if(!key)return;
  const base=id.replace(/O$/,"");
  state.chrono[key]=key==="details"?val("chDet"):key==="cat"?catVal("chCat",false):selVal(base,false);save();
}

/* ---------- minuteur de pauses ---------- */
function ensureAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(e){}}
function beep(){
  try{ensureAudio();if(!actx)return;[0,0.35,0.7].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=660;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(0.25,actx.currentTime+t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+t+0.28);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+0.3);});}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([300,150,300]);}catch(e){}
}
const nCycles=()=>Math.max(2,state.settings.cycles||4);
function dots(c){const n=nCycles();return `<p class="center dots" aria-label="Cycle ${c} sur ${n}">${Array.from({length:n},(_,i)=>i<c?"●":"○").join("")}</p>`;}
function nextCycle(){const p=state.pomo;return p.cycle>=nCycles()?1:(p.cycle||0)+1;}
function pomoModal(){
  const p=state.pomo,s=state.settings,n=nCycles();
  if(p.phase==="work"){
    openModal(`<h2>${p.emoji||"💪"} Cycle ${p.cycle} sur ${n}</h2>${dots(p.cycle)}<p class="center meta">Pause dans</p><div class="big" id="pomoDisp">${hms(p.end-Date.now())}</div>
    <div class="actions"><button class="btn ghost" data-act="pomoStop">Arrêter</button><button class="btn ghost" data-act="pomoPauseNow">Pause maintenant</button><button class="btn" data-act="closeModal">Continuer</button></div>`,"pomo");
  }else if(p.phase==="pause"){
    openModal(`<h2>${p.emoji||"⏳"} ${p.long?"Grande pause":"Pause"} en cours</h2>${dots(p.cycle)}<p class="center">Bouge, bois un verre d’eau 💧, repose tes yeux.</p><div class="big" id="pomoDisp">${hms(p.end-Date.now())}</div>
    <div class="actions"><button class="btn ghost" data-act="pomoStop">Arrêter</button><button class="btn" data-act="pomoResume">Reprendre le travail</button></div>`,"pomo");
  }else{
    const cont=p.next>1;
    openModal(`<h2>🍅 Minuteur Pomodoro</h2><p>${n} cycles de ${s.pomo} min, avec une petite pause de ${s.pause} min entre chaque, puis une grande pause de ${s.longPause} min.</p>

    <div class="actions"><button class="btn ghost" data-act="closeModal">Annuler</button>${cont?`<button class="btn ghost" data-act="pomoFresh">Recommencer au cycle 1</button><button class="btn" data-act="pomoResume">Continuer au cycle ${p.next}</button>`:`<button class="btn" data-act="pomoFresh">Démarrer</button>`}</div>`,"pomo");
  }
}
function startWork(cycle){
  ensureAudio();const n=nCycles();cycle=cycle>n||cycle<1?1:cycle;
  const m=pick(WORK_MSG);const music=Math.random()<0.35?pick(MUSIC):"";const em=music?pick(["🎵","🎶"]):m.e;
  Object.assign(state.pomo,{phase:"work",end:Date.now()+state.settings.pomo*60000,emoji:em,cycle,long:false});save();updateFabs();
  openModal(`<span class="em" aria-hidden="true">${em}</span><h2 class="center">Cycle ${cycle} sur ${n} : ${state.settings.pomo} min de concentration</h2>${dots(cycle)}
  <p class="center">${m.t}</p>${music?`<p class="center meta">🎵 ${music}</p>`:""}
  <div class="actions" style="justify-content:center"><button class="btn" data-act="closeModal">C’est parti</button></div>`,"start");
  setTimeout(()=>{if(modalKind==="start")closeModal();},9000);
}
function startPause(alert){
  const p=state.pomo,long=p.cycle>=nCycles(),m=pick(PAUSE_MSG);
  Object.assign(p,{phase:"pause",end:Date.now()+(long?state.settings.longPause:state.settings.pause)*60000,emoji:m.e,long});save();
  if(alert){
    beep();const left=2-(p.skips||0);
    openModal(`<span class="em" aria-hidden="true">${m.e}</span><h2 class="center">${long?"C’est l’heure de la grande pause":"C’est l’heure de la pause"}</h2>${dots(p.cycle)}
    <p class="center">${m.t}</p><p class="center meta">Et pense à boire un verre d’eau 💧</p>
    ${left>0?`<p class="center meta">Pas prête ? Tu peux passer la pause (encore ${left} fois).</p>`:`<div class="warn center">Tu as déjà passé 2 pauses de suite : celle-ci est obligatoire 🌿</div>`}
    <div class="actions" style="justify-content:center">${left>0?`<button class="btn ghost" data-act="pomoSkip">Passer la pause</button>`:""}<button class="btn ghost" data-act="pomoStop">Arrêter le minuteur</button><button class="btn" data-act="closeModal">OK, je prends ma pause</button></div>`,"pause");
  }
  updateFabs();
}
function endPause(){
  const p=state.pomo,next=p.long?1:(p.cycle||0)+1;
  Object.assign(p,{phase:"off",end:0,emoji:"",skips:0,next});save();beep();
  openModal(`<span class="em" aria-hidden="true">🌤</span><h2 class="center">${p.long?"Grande pause terminée":"Pause terminée"}</h2>
  <p class="center">Comment tu te sens ? Tu peux reprendre, ou t’arrêter là pour aujourd’hui.</p>
  <div class="actions" style="justify-content:center"><button class="btn ghost" data-act="closeModal">J’arrête pour aujourd’hui</button><button class="btn" data-act="pomoResume">Reprendre (cycle ${next} sur ${nCycles()})</button></div>`,"pause");
  updateFabs();
}

/* ---------- boutons flottants ---------- */
const FABS={fabChrono:chronoModal,fabPomo:pomoModal,fabPin:pinModal};
function placeFab(el,x,y){
  const w=el.offsetWidth||56,h=el.offsetHeight||56;
  x=Math.max(4,Math.min(innerWidth-w-4,x));y=Math.max(4,Math.min(innerHeight-h-4,y));
  el.style.left=x+"px";el.style.top=y+"px";el.style.right="auto";el.style.bottom="auto";
}
function restoreFabs(){
  Object.keys(FABS).forEach(k=>{const el=document.getElementById(k);const p=state.fabPos[k];
    if(p)placeFab(el,p.x,p.y);else{el.style.left="";el.style.top="";el.style.right="";el.style.bottom="";}});
}
function setupFab(el){
  let sx=0,sy=0,ox=0,oy=0,down=false,moved=false;
  el.addEventListener("pointerdown",e=>{down=true;moved=false;sx=e.clientX;sy=e.clientY;const r=el.getBoundingClientRect();ox=r.left;oy=r.top;try{el.setPointerCapture(e.pointerId);}catch(_){}});
  el.addEventListener("pointermove",e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&Math.hypot(dx,dy)<8)return;moved=true;placeFab(el,ox+dx,oy+dy);});
  const end=()=>{if(!down)return;down=false;if(moved){const r=el.getBoundingClientRect();state.fabPos[el.id]={x:r.left,y:r.top};save();justDragged=true;setTimeout(()=>justDragged=false,350);}};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  el.addEventListener("click",()=>{if(justDragged){justDragged=false;return;}FABS[el.id]();});
}
function setBadge(el,txt){const b=el.querySelector(".b");if(txt){b.textContent=txt;b.hidden=false;}else b.hidden=true;}
function updateFabs(){
  const pin=$("#fabPin"),n=state.urgent.length;
  const soft=n?0:dueReminders().length;pin.classList.toggle("alert",n>0);pin.classList.toggle("soft",!n&&soft>0);pin.classList.toggle("calm",!n&&!soft);setBadge(pin,n?String(n):soft?"🌿":"");
  const c=state.chrono;setBadge($("#fabChrono"),c.running?hms(chronoMs()):"");
  const p=state.pomo,pf=$("#fabPomo");
  pf.querySelector(".ic").textContent=p.phase!=="off"&&p.emoji?p.emoji:"🍅";
  setBadge(pf,p.phase!=="off"?Math.max(0,Math.ceil((p.end-Date.now())/60000))+" min":"");
}
function tick(){
  const p=state.pomo,now=Date.now();
  if(state.chrono.running){state.chrono.lastSeen=now;if(++tickCount%10===0)save();}
  if(p.phase==="work"&&now>=p.end)startPause(true);
  else if(p.phase==="pause"&&now>=p.end)endPause();
  const cd=$("#chronoDisp");if(cd&&state.chrono.running)cd.textContent=hms(chronoMs());
  const pd=$("#pomoDisp");if(pd&&state.pomo.phase!=="off")pd.textContent=hms(state.pomo.end-now);
  updateFabs();
  if(tickCount%15===0)pomoNudgeCheck();
}

function doSearch(q){
  const box=$("#results"),n=norm(q.trim());

  const has=(...xs)=>xs.some(x=>norm(x).includes(n));
  const hits=[];
  const partHit=Object.keys(QPARTS).map(p=>"q_"+p).some(k=>has(TABS[k].label,TABS[k].kw,tabLabel(k)));
  state.settings.tabOrder.forEach(k=>{const t=TABS[k];if(!has(t.label,t.kw,tabLabel(k)))return;if(k==="quotidien"&&partHit)return;
    if(k.startsWith("q_")){const p=k.slice(2);hits.push({tab:qTab(p),qv:p,title:"Partie "+tabLabel(k),sub:tabVisible(k)?"Aller à l’onglet":"Dans l’onglet Quotidien"});}
    else if(tabVisible(k))hits.push({tab:k,title:"Onglet "+tabLabel(k),sub:"Aller à l’onglet"});});
  if(has("je sors sortie sortir m’habiller m'habiller habiller tenue quoi mettre quoi prendre"))hits.push({fn:"jeSors",title:"👗 Je sors : quoi prendre ?",sub:"Tenue, chaussures, sac et fiche mémo"});
  if(has("manger mange faim quoi manger repas collation encas en-cas grignoter"))hits.push({fn:"mange",title:"🥗 Qu’est-ce que je mange ?",sub:"Selon ton envie ou ton repas"});
  state.lists.repas.forEach(s=>{if(has(s))hits.push({fn:"mangeGo",arg:s,title:"🥗 "+s,sub:"Ce que j’ai noté pour cette envie"});});
  state.lists.sorties.forEach(s=>{if(has(s))hits.push({fn:"sorsGo",arg:s,title:"👗 Je sors : "+s,sub:"Ce que j’ai prévu pour cette sortie"});});
  state.projects.forEach(p=>{if(has(p.name,p.why,p.bilan,p.next,p.notes,p.otherFiles,...p.links.map(l=>l.name)))hits.push({tab:p.space==="loisirs"?"loisirs":"projets",id:"p-"+p.id,title:p.name,sub:(p.kind==="objectif"?"Objectif, ":"")+(SPACE_TXT[p.space]||"Projet")+", "+STATUS[p.status]+(p.star?", ⭐":"")});});

  state.q.apa.forEach(x=>{if(has(x.act,x.note,x.feel))hits.push({tab:qTab("apa"),qv:"apa",id:"qap-"+x.id,title:x.act+(x.min?" ("+fmtDur(+x.min)+")":""),sub:"APA perso, "+fmt(x.date)});});
  state.q.pret.forEach(x=>{if(has(x.what,x.who,x.where,x.note,x.kind))hits.push({tab:qTab("pret"),qv:"pret",id:"qp-"+x.id,title:x.what,sub:(x.kind||"Prêté")+(x.who?", "+x.who:"")+(isBack(x)?", rendu":"")});});

  state.files.forEach(f=>{if(has(f.name,f.where,f.kw,f.domain,(state.projects.find(p=>p.id===f.project)||{}).name))hits.push({tab:"fichiers",id:"f-"+f.id,title:f.name,sub:f.type==="dossier"?"Dossier Drive":"Fichier Drive"});});
  state.journal.forEach(j=>{if(has(j.text))hits.push({tab:"journal",id:"j-"+j.id,title:j.text.slice(0,70),sub:"Journal, "+fmt(j.date)});});
  state.work.forEach(w=>{if(has(w.tool,w.cat,w.details))hits.push({tab:"journal",id:"w-"+w.id,title:w.cat||w.tool,sub:"Durée de travail, "+fmt(w.date)});});
  state.ideas.forEach(i=>{if(has(i.text))hits.push({tab:"accueil",id:"i-"+i.id,title:i.text,sub:i.later?"Idée, plus tard":"Boîte à idées",later:i.later});});
  state.urgent.forEach(u=>{if(has(u.text))hits.push({pin:true,title:u.text,sub:"Note urgente"});});
  state.q.ast.forEach(x=>{if(has(x.title,x.detail,x.kw,x.cat)){const p=x.cat==="Vêtements"?"vet":"ast";hits.push({tab:qTab(p),qv:p,id:"qa-"+x.id,title:x.title,sub:"Astuce"+(x.cat?", "+x.cat:"")});}});

  state.rep.forEach(r=>{if(has(r.text))hits.push({tab:"accueil",id:"r-"+r.id,title:r.text,sub:"Reprendre ici"});});
  state.sante.ess.forEach(x=>{if(has(x.name,x.use,x.where,x.cat))hits.push({tab:"sante",view:"ess",id:"e-"+x.id,title:x.name,sub:"Mes essentiels"+(x.where?", rangé : "+x.where:"")});});
  state.sante.suivi.forEach(x=>{if(has(x.loc,x.type,x.trig,x.relief,x.note))hits.push({tab:"sante",view:"suivi",id:"s-h-"+x.id,title:x.loc+" ("+(+x.int||0)+"/10)",sub:"Suivi santé, "+fmt(x.date)});});

  lastHits=hits.slice(0,30);
  box.innerHTML=lastHits.length?lastHits.map((h,i)=>`<button class="res" data-act="goto" data-id="${i}">${esc(h.title)}<small>${esc(h.sub)}</small></button>`).join("")
    :`<p class="res">Rien trouvé pour « ${esc(q)} ». Essaie un mot proche : un thème, un lieu, une personne.</p>`;
  box.hidden=false;
}

function copyText(txt,sel,msg){
  let t=sel?$(sel):null,tmp=false;
  const fail=()=>toast("Copie bloquée par le téléphone : appuie longuement sur le texte, puis « Tout sélectionner » et « Copier »",6000);
  const fb=()=>{
    if(!t){t=document.createElement("textarea");t.value=txt;t.setAttribute("readonly","");t.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";document.body.appendChild(t);tmp=true;}
    t.focus();t.select();try{t.setSelectionRange(0,t.value.length);}catch(e){}
    let ok=false;try{ok=document.execCommand("copy");}catch(e){}
    if(tmp)t.remove();
    if(ok)toast(msg);else fail();};
  if(window.isSecureContext&&navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast(msg),fb);else fb();}

/* ---------- écouteurs ---------- */
document.addEventListener("click",e=>{
  if(e.target.id==="modal"){tryClose();return;}
  const b=e.target.closest("[data-act]");
  if(b&&/^save/.test(b.dataset.act||""))modalDirty=false;
  if(!b){if(!e.target.closest(".searchwrap"))$("#results").hidden=true;return;}
  const fn=ACT[b.dataset.act];if(fn)fn(b.dataset.id,b,e);
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(modalKind==="form"&&t.closest&&t.closest("#sheet"))modalDirty=true;
  if(t.id==="q")doSearch(t.value);

  if(state.chrono.running&&["chDet","chToolO","chCatO"].includes(t.id))syncChronoField(t.id);
  if(t.id==="sInt"){const o=$("#sIntOut");if(o)o.textContent=t.value+" / 10";}
});
document.addEventListener("change",e=>{
  const t=e.target,k=t.dataset.set;
  if(t.tagName==="SELECT"&&t.dataset.kind){
    const o=document.getElementById(t.id+"O");
    if(o){o.hidden=t.value!=="__autre";if(!o.hidden)o.focus();}
    if(state.chrono.running&&(t.id==="chTool"||t.id==="chCat"))syncChronoField(t.id);
  }
  if(t.type==="checkbox"&&t.closest(".chips")&&t.closest(".chips").id){
    const box=t.closest(".chips");
    if(t.value==="__autre"){const o=document.getElementById(box.id+"O");if(o){o.hidden=!t.checked;if(t.checked)o.focus();}}
    if(state.chrono.running&&box.id==="chCat")syncChronoField("chCat");
  }
  if(modalKind==="form"&&t.closest&&t.closest("#sheet"))modalDirty=true;
  if(t.id==="fKind"){const w=$("#fCarnetWrap");if(w)w.hidden=t.value!=="Carnet";}
  if(t.id==="mangeMemo"&&mangeCur){state.q.memoMange[mangeCur]=t.value.trim();save();toast("Fiche mémo enregistrée");}
  if(t.id==="sorsMemo"&&sorsCur){state.q.memo[sorsCur]=t.value.trim();save();toast("Fiche mémo enregistrée");}
  if(t.id&&t.id.startsWith("jobSt-")){const jid=t.id.slice(6).replace(/O$/,""),tg=state.targets.find(x=>x.id===jid);
    if(tg){if(t.tagName==="SELECT"){if(t.value!=="__autre"){tg.status=t.value;save();jobOpen.add(jid);render();toast("Statut : "+t.value);}}
      else{const v=t.value.trim();if(v){addToList("jobStatus",v);tg.status=v;save();render();toast("Statut : "+v);}}}}
  if(t.id&&t.id.startsWith("jobWhy-")){const tg=state.targets.find(x=>x.id===t.id.slice(7));if(tg){tg.why=t.value.trim();save();toast("Enregistré");}}
  if(t.id==="addFile"&&t.files&&t.files[0]){
    const file=t.files[0],r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);
      if(o&&Array.isArray(o.projects)&&Array.isArray(o.tasks)){toast("C’est une sauvegarde complète : utilise plutôt « Restaurer »",5000);return;}
      if(!o||o.carnetPilote!=="ajout")throw new Error("format");
      const res=importAdd(o);save();render();
      toast(res.add+" élément"+(res.add>1?"s":"")+" ajouté"+(res.add>1?"s":"")+(res.skip?", "+res.skip+" déjà présent"+(res.skip>1?"s":""):""),5000);}
      catch(err){toast("Ce fichier n’est pas un fichier d’ajout du carnet",4000);}};
    r.readAsText(file);t.value="";
  }
  if(t.dataset&&t.dataset.proj){const o=document.getElementById(t.id+"New");if(o){o.hidden=t.value!=="__new";if(!o.hidden)o.focus();}}
  if(t.dataset&&t.dataset.subj){const o=document.getElementById(t.id+"O");if(o){o.hidden=t.value!=="__autre";if(!o.hidden)o.focus();}}
  if(t.id==="micDayIn"&&t.value){micDay=t.value;render();}
  if((t.id==="micLever"||t.id==="micCoucher")&&micDay){const D=state.sante.micDays[micDay]=state.sante.micDays[micDay]||{};D[t.id==="micLever"?"lever":"coucher"]=t.value;save();render();toast("Enregistré");}
  if(t.id==="mUri"){const w=$("#mUriWrap");if(w)w.hidden=!t.checked;}
  if(t.id==="mNm"){const v=$("#mVol");if(v){v.disabled=t.checked;if(t.checked)v.value="";}}
  if(t.id==="tProj"){const w=$("#tProjNewWrap");if(w){w.hidden=t.value!=="__new";if(!w.hidden)$("#tProjNew").focus();}}
  if(t.id==="fStatus"){const end=t.value==="termine";$("#fWhyWrap").hidden=end;$("#fBilanWrap").hidden=!end;}
  if(k==="name"){state.name=t.value.trim()||"Yas";save();renderHeader();}
  else if(k==="theme"){state.settings.theme=t.value;save();applyTheme();}
  else if(k==="lockIdle"||k==="lockAway"){state.settings[k]=parseInt(t.value,10);save();lastAct=Date.now();toast("Réglage enregistré");}
  else if(k==="lockOn"){state.settings.lockOn=t.value==="1";save();renderHeader();toast(state.settings.lockOn?"Mot de passe activé":"Mot de passe désactivé");}
  else if(k==="lockHint"){state.settings.lockHint=t.value.trim();save();toast("Indice enregistré");}
  else if(["pomo","pause","longPause","cycles","remSave","remSkills","mergeGap","pomoNudge"].includes(k)){
    const lim={pomo:[5,90],pause:[1,30],longPause:[5,60],cycles:[2,8],remSave:[1,60],remSkills:[1,60],mergeGap:[0,120],pomoNudge:[0,180]}[k];
    const pv=parseInt(t.value,10);const v=Math.max(lim[0],Math.min(lim[1],isNaN(pv)?lim[0]:pv));state.settings[k]=v;t.value=v;save();toast("Réglage enregistré");}
  if(t.id==="importFile"&&t.files&&t.files[0]){
    const file=t.files[0],r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.projects)||!Array.isArray(o.tasks))throw new Error("format");
      if(!confirm("Remplacer le contenu actuel par cette sauvegarde ?"))return;
      const keepChrono=state.chrono,d=new Date();
      state=fixState(o);state.chrono=keepChrono;state.lastRestore={date:isoOf(d),time:hm(d),file:file.name};
      save();applyTheme();restoreFabs();cur="params";render();toast("Carnet restauré");}
      catch(err){toast("Ce fichier n’est pas une sauvegarde du carnet");}};
    r.readAsText(file);t.value="";
  }
});
document.addEventListener("toggle",e=>{const d=e.target;if(d&&d.dataset&&d.dataset.sp){state.ui.foldSp[d.dataset.sp]=!d.open;save();}if(d&&d.dataset&&d.dataset.fg!==undefined){state.ui.fileFold[d.dataset.fg]=!d.open;save();}if(d&&d.id==="jobRech")jobSec.r=d.open;if(d&&d.id==="jobRes")jobSec.s=d.open;if(d&&d.classList&&d.classList.contains("jobc")){const id=d.dataset.job;if(d.open){jobOpen.add(id);jobOpen.delete("x"+id);}else{jobOpen.delete(id);jobOpen.add("x"+id);}}},true);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){speakStop();if($("#alertPop").classList.contains("show"))$("#alertPop").classList.remove("show");else if($("#modal").classList.contains("open"))tryClose();else if($("#note").classList.contains("show"))hideNote();else{$("#results").hidden=true;}}
  if(e.key==="Enter"&&!e.shiftKey){
    if(e.target.id==="ideaIn"){e.preventDefault();ACT.addIdea();}
    else if(e.target.id==="uIn"){e.preventDefault();ACT.addUrgent();}
    else if(e.target.id==="repIn"){e.preventDefault();ACT.repAdd();}
    else if(e.target.id&&e.target.id.startsWith("bagIn-")){e.preventDefault();ACT.bagAdd(e.target.id.slice(6));}
  }
});
document.addEventListener("visibilitychange",()=>{
  const c=state.chrono,now=Date.now();
  if(document.hidden){if(c.running){c.lastSeen=now;save();}return;}
  if(c.running&&c.lastSeen&&now-c.lastSeen>30*60000){recordWork(c,c.start,c.lastSeen);startVisit();render();toast("Bon retour ! Nouvelle visite lancée.");}
});

["pointerdown","keydown","input"].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now();},true));
window.addEventListener("scroll",()=>{lastAct=Date.now();},{passive:true});
setInterval(()=>{const m=state.settings.lockIdle;if(m>0&&canLock()&&!isLocked()&&!document.hidden&&Date.now()-lastAct>=m*60000)lockNow();},5000);
document.addEventListener("visibilitychange",()=>{const now=Date.now();
  if(document.hidden){hiddenAt=now;return;}
  const a=state.settings.lockAway;
  if(hiddenAt&&a>=0&&canLock()&&!isLocked()&&now-hiddenAt>=a*60000)lockNow();
  hiddenAt=0;lastAct=now;});
function setupLock(){
  const s=state.settings,root=document.documentElement;
  if(!s.lockOn||!s.lockPass){root.classList.remove("locked");onOpen();return;}
  $("#lockLogo").src=LOGO;
  const inp=$("#lockIn"),msg=$("#lockMsg"),hb=$("#lockHintBtn"),hp=$("#lockHint");
  msg.textContent="";hp.hidden=true;inp.value="";
  hb.hidden=!s.lockHint;
  hb.onclick=()=>{hp.textContent="💡 "+s.lockHint;hp.hidden=false;};
  const bb=$("#lockBio");bb.hidden=!s.bioId;
  const ok=()=>{inp.oninput=null;root.classList.remove("locked");inp.value="";msg.textContent="";lastAct=Date.now();onOpen();};
  bb.onclick=async()=>{if(await bioUnlock())ok();else msg.textContent="Empreinte non reconnue : utilise ton mot de passe";};
  inp.oninput=()=>{if(inp.value===s.lockPass){const f=$("#lockForm");if(f.requestSubmit)f.requestSubmit();else f.onsubmit({preventDefault(){}});}};
  $("#lockForm").onsubmit=e=>{e.preventDefault();
    if(inp.value===s.lockPass){inp.oninput=null;root.classList.remove("locked");inp.value="";msg.textContent="";lastAct=Date.now();onOpen();}
    else{msg.textContent="Mot de passe incorrect";inp.value="";inp.focus();}};
  if(!s.bioId)setTimeout(()=>inp.focus(),50);
}

/* ---------- V17 : fenêtre adaptée au clavier ---------- */
function fitViewport(){const v=window.visualViewport;if(!v)return;const r=document.documentElement.style;r.setProperty("--vvh",v.height+"px");r.setProperty("--vvt",v.offsetTop+"px");
  const a=document.activeElement;if(a&&a.closest&&a.closest("#sheet")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))setTimeout(()=>a.scrollIntoView({block:"center"}),60);}
if(window.visualViewport){visualViewport.addEventListener("resize",fitViewport);visualViewport.addEventListener("scroll",fitViewport);fitViewport();}

/* ---------- démarrage ---------- */
applyTheme();applyPhase();
bootChrono();
Object.keys(FABS).forEach(k=>setupFab(document.getElementById(k)));
restoreFabs();
render();
setInterval(tick,1000);
setupLock();
if(merged)setTimeout(()=>toast("Bon retour ! Ta séance continue."),600);
</script>
<script>
/* Application mobile : fonctionne seulement une fois le carnet en ligne (https) */
if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
